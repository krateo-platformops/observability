apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "krateo-sse-proxy.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "krateo-sse-proxy.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "krateo-sse-proxy.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "krateo-sse-proxy.selectorLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "krateo-sse-proxy.serviceAccountName" . }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
      containers:
        - name: sse-proxy
          image: {{ include "krateo.image" (dict "img" .Values.image "global" .Values.global "defaultTag" .Chart.AppVersion) | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: CLICKHOUSE_URL
              value: {{ .Values.clickhouse.url | quote }}
            - name: CLICKHOUSE_USER
              value: {{ .Values.clickhouse.user | quote }}
            - name: CLICKHOUSE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.clickhouse.passwordSecret.name | quote }}
                  key: {{ .Values.clickhouse.passwordSecret.key | quote }}
                  optional: {{ .Values.clickhouse.passwordSecret.optional }}
            - name: LISTEN_ADDR
              value: {{ .Values.listenAddr | quote }}
            # authn base URL for RS256/JWKS token verification on /events and
            # /notifications. The JWKS document is derived as
            # <URL_AUTHN>/.well-known/jwks.json. Defaults to authn in this release's
            # namespace. Verification is MANDATORY (no open mode — the proxy refuses
            # to start without a JWKS source); override auth.urlAuthn only to point at
            # a non-co-located authn.
            - name: URL_AUTHN
              value: {{ .Values.auth.urlAuthn | default (printf "http://authn.%s.svc.cluster.local:8082" .Release.Namespace) | quote }}
          {{- if eq (include "krateo-sse-proxy.otelAnySignal" .) "true" }}
            # OTLP export (telemetry.go). EVERY var below is emitted ONLY when the
            # corresponding value is set, so an unset value leaves the BINARY's own default
            # authoritative instead of silently pinning it from here. Until this block
            # existed the chart offered no way to enable export at all, so the four
            # sse_proxy_* instruments were computed on every poll and discarded.
            {{- if .Values.otel.enabled }}
            - name: OTEL_ENABLED
              value: "true"
            {{- end }}
            {{- if not (kindIs "invalid" .Values.otel.tracing) }}
            - name: OTEL_TRACING_ENABLED
              value: {{ .Values.otel.tracing | quote }}
            {{- end }}
            {{- if not (kindIs "invalid" .Values.otel.metrics) }}
            - name: OTEL_METRICS_ENABLED
              value: {{ .Values.otel.metrics | quote }}
            {{- end }}
            # The collector Service is HEADLESS (clusterIP: None), so its DNS name resolves to
            # EVERY collector pod and the exporter connects to an arbitrary one — measured on
            # krateo-057: a pod on node …-s9a6, whose local collector is 10.40.3.2, got back all
            # four collector IPs. internalTrafficPolicy: Local is set on that Service but is inert
            # on a headless one, so it does not rescue the DNS path. Export still WORKED (every
            # collector has the same otlp receiver and clickhouse exporter), which is why the
            # earlier node-local CLAIM went unchallenged — the cost was a cross-node hop per batch
            # and the loss of node attribution, not a failure.
            #
            # $(HOST_IP) is expanded by the kubelet from THIS pod's node, so it reaches the
            # collector on the same node with no DNS and no hop. This is the pattern snowplow
            # already uses on the estate; matching it also means one way to read the wiring
            # instead of two.
            - name: HOST_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.hostIP
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: {{ .Values.otel.endpoint | default "http://$(HOST_IP):4318" | quote }}
          {{- end }}
          {{- if .Values.rbacScoping.enabled }}
            # Per-caller event scoping (rbac.go). The grants this needs are created by this
            # same flag in rbac-event-scoping.yaml — see that file for why they cannot be
            # separated.
            - name: RBAC_SCOPING_ENABLED
              value: "true"
            {{- if not (kindIs "invalid" .Values.rbacScoping.verb) }}
            - name: RBAC_SCOPING_VERB
              value: {{ .Values.rbacScoping.verb | quote }}
            {{- end }}
            {{- if not (kindIs "invalid" .Values.rbacScoping.resource) }}
            - name: RBAC_SCOPING_RESOURCE
              value: {{ .Values.rbacScoping.resource | quote }}
            {{- end }}
            {{- if not (kindIs "invalid" .Values.rbacScoping.apiGroup) }}
            - name: RBAC_SCOPING_APIGROUP
              value: {{ .Values.rbacScoping.apiGroup | quote }}
            {{- end }}
            {{- if not (kindIs "invalid" .Values.rbacScoping.cacheTTL) }}
            - name: RBAC_SCOPING_CACHE_TTL
              value: {{ .Values.rbacScoping.cacheTTL | quote }}
            {{- end }}
          {{- end }}
          # Lenient liveness tolerance (org standard): the Kubernetes defaults
          # (timeoutSeconds: 1, failureThreshold: 3) kill HEALTHY pods under CPU
          # contention — a slow-but-alive /health reply counts as a failure and the
          # resulting restart storm worsens the contention. Only a truly dead process
          # should die: 10s period x 6 failures = 60s of continuous failure before
          # a restart.
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          # Readiness stays prompt (5s period, 3 failures) so a genuinely unhealthy
          # endpoint is removed from the Service quickly, but timeoutSeconds: 5 keeps
          # load alone from flapping the endpoint in and out.
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
