apiVersion: v2
name: krateo-sse-proxy
description: >-
  Krateo SSE proxy. Polls ClickHouse and pushes new K8s events to connected
  browsers via Server-Sent Events.
type: application
# 0.1.13: bump the sse-proxy image to 1.1.7 — prunes the GET /events?composition_id=... scan with a
# tokenbf prefilter on Body (sse-proxy#20/#21). The composition predicate was JSONExtractString over
# a non-indexed column, so it could not prune and cost ~2s REGARDLESS of result size; the 0-row case
# was the slowest of all because nothing could early-exit at LIMIT 200. Measured on krateo-057
# 2026-10-12 with the shipped SELECT shape (medians of 3 interleaved rounds): 18.49s for a
# composition with no events, 5.21s with events, against a 1.33s unfiltered control.
# 0.1.14: bump the sse-proxy image to 1.1.8 — the /events composition predicate is now ONE indexed
# map lookup (sse-proxy#20/#22). 0.1.13's tokenbf prefilter pruned the scan ~1.7x but left the
# JSONExtractString half parsing every surviving row; removing it takes the pathological 0-row case
# from 18.49s to 0.42s (medians, shipped SELECT shape, 3 interleaved rounds, 1.33s control).
# Safe because otel-collector#11 returns a root composition's own metadata.uid as its composition-id,
# so a composition's OWN events are labelled too (1,612 of devday-milan's 1,613 over 12h on 057).
# COST: rows written while composition-id stamping was broken are now invisible to the panel. That
# decay is fixed going forward by otel-collector 1.0.4, but affected rows persist for otel_logs'
# 7-day TTL — concentrated on components rolled during the window (v1-12-42 0/8, v0-3-413 0/6),
# not on long-lived compositions (v0-1-0 3224/3225).
# 0.1.15: bump the sse-proxy image to 1.1.9 (sse-proxy#25/#26), with two scan fixes:
#   (1) The poll cursor was `toUnixTimestamp(Timestamp) > N`. Because the column was wrapped in a
#   function, no index could prune, so every 3s poll scanned ALL k8s-events rows. On krateo-057 that
#   was ~828 polls an hour at ~4.25M rows each, using ~3.25 of ClickHouse's 4-core limit; ClickHouse
#   was pinned at its CPU limit and every other query waited on it. The cursor is now
#   `Timestamp >= toDateTime64(N+1, 9)`, which selects the same rows. EXPLAIN indexes=1: 53 parts /
#   731 granules -> 1 part / 1 granule.
#   (2) /events tries the newest window first (1h, then 24h, then unbounded) and stops at the
#   first window that fills the limit. The result is identical to the unbounded query, because
#   every row outside a full window is older than every row inside it. Granules read: unfiltered
#   730 -> 4; devday-milan 528 -> 86.
#   Result equivalence was checked on 057 with pinned samples (count + cityHash64 match).
#   Independent gate: reviewer-small PASS, from pushed SHA f61dd601.
# 0.1.18: metadata only -- `sources` names this repo by its current name, krateo-platformops/observability
# (was the old clickstack-chart, which only redirects). Bumped so the next tag does not overwrite
# 0.1.17 with different metadata: consumers cache by version (see krateo-observability 0.1.3).
# 0.1.19: bump the sse-proxy image to 1.3.0, with auditScoping.
# WAS 0.1.18 ON THIS BRANCH AND HAD TO MOVE. #89 took 0.1.18 for the `sources` metadata fix above and
# released it in tag 3.1.31, so this branch and main both claimed that version. `release-oci` pushes
# with no exists-check, so whichever tag ran second would have published a DIFFERENT chart under an
# existing version -- and consumers cache by version, so some installs would keep 1.2.0's chart while
# others got 1.3.0's, with nothing to say which. Caught by a peer session reading the release, not by
# a gate: nothing here compares a PR's chart version against what is already published.
# 0.1.20: bump the sse-proxy image to 1.3.1: grpc and the OTel Go SDK updated, built with Go 1.26, and
# a LICENSE added. No behaviour change. Smoke-tested locally only, not yet on a cluster.
# 0.1.21: bump the sse-proxy image to 1.4.0. BREAKING for any client still sending a token in the query
# string: it gets 401, even with valid credentials (sse-proxy#40). Every cluster running this proxy has
# a frontend past that, 1.8.13 or later. Also answers CORS preflights itself, so a portal on another
# origin connects without a gateway answering them; a0-openstack-d3's bell needs this.
# 0.1.22: bump the sse-proxy image to 1.4.1. The stream is live events: the first client after a
# boot or an idle period no longer receives an hour of backlog into a 64-slot buffer, and a client
# with no topic no longer receives a row twice (sse-proxy#30). History stays on GET /events.
version: 0.1.22
appVersion: "1.4.1"
home: https://krateo.io
