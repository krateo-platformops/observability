global:
  # Optional mirror/air-gap override. When set, it replaces ONLY the registry host of every
  # image (repository paths preserved), e.g. imageRegistry: harbor.internal ->
  # harbor.internal/krateo-platformops/sse-proxy:<tag>. Empty = images pull from their own registry.
  imageRegistry: ""

# Single replica: sse-proxy is a STATEFUL in-memory SSE hub (each pod runs its own
# ClickHouse poller + client hub). Behind an L4 LoadBalancer with sessionAffinity:None,
# GCP hashes each client to one backend, so a client deterministically pins to a single
# replica — if any replica degrades (e.g. its poller/ClickHouse path), a fixed subset of
# users gets stuck 503s on /notifications (this is exactly what broke the portal bell).
# A single hub eliminates the split. HA isn't needed for this lightweight proxy; the
# poller resumes from lastSeenUnix on restart. (To scale >1 later: gate readiness on
# poller health AND add sessionAffinity, or move to a shared event store.)
replicaCount: 1

image:
  # registry is the image host; global.imageRegistry (if set) overrides it. Split out of
  # repository so a mirror/air-gap relocation only swaps the host and preserves the repo path.
  registry: ghcr.io
  repository: krateo-platformops/sse-proxy
  tag: "1.2.0"
  pullPolicy: IfNotPresent

imagePullSecrets: []

nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  name: ""

service:
  type: ClusterIP
  port: 8080

auth:
  # authn base URL used to verify end-user JWTs (RS256) on /events and
  # /notifications; the JWKS document is fetched from <urlAuthn>/.well-known/jwks.json.
  # Empty (the default) makes the deployment target authn in THIS release's namespace
  # (http://authn.<namespace>.svc.cluster.local:8082). Verification is MANDATORY by
  # design — there is no open mode; the proxy refuses to start if it cannot resolve a
  # JWKS source. Set this to point at a non-co-located authn.
  urlAuthn: ""

clickhouse:
  url: "http://krateo-clickstack-clickhouse-clickhouse-headless.krateo-system.svc:8123"
  user: "default"
  passwordSecret:
    name: clickhouse-credentials
    key: password
    optional: true

listenAddr: ":8080"

# OpenTelemetry export. DEFAULT-OFF, and every key below is emitted as an env var ONLY when
# it is set — so with the defaults the BINARY's own defaults remain the single source of
# truth. A chart that always writes a value makes the binary's default dead code and leaves
# nobody able to say which is authoritative (the cdc shipped WORKERS=10 on 68 configmaps for
# exactly this reason, and main.go's default has been unreachable ever since).
#
# Until this block existed there was NO WAY to enable export at all: the Deployment hardcoded
# five env vars and the chart offered no hook, so sse_proxy_events_delivered_total,
# _dropped_total, _poll_errors_total and _connected_clients were computed and discarded.
otel:
  # Master gate (OTEL_ENABLED). The per-signal flags below default to this in the binary.
  enabled: false
  # Per-signal overrides (OTEL_TRACING_ENABLED / OTEL_METRICS_ENABLED). Leave null to inherit
  # `enabled`; set true/false only to diverge from it.
  tracing: null
  metrics: null
  # OTEL_EXPORTER_OTLP_ENDPOINT. Empty resolves to `http://$(HOST_IP):4318` — the OTLP agent
  # on THIS POD'S OWN NODE, via a HOST_IP env the Deployment projects from status.hostIP.
  #
  # IT USED TO RESOLVE TO THE COLLECTOR SERVICE'S DNS NAME AND THIS COMMENT CLAIMED THAT WAS
  # NODE-LOCAL. It is not. That Service is headless (clusterIP: None), so its name resolves to
  # every collector pod and the exporter picks one arbitrarily — measured on krateo-057: a pod
  # on node …-s9a6, whose local collector is 10.40.3.2, resolved all four collector IPs.
  # `internalTrafficPolicy: Local` is set on that Service but is inert on a headless one. Export
  # still worked, because every collector instance has the same otlp receiver and the same
  # clickhouse exporter, so the only costs were a cross-node hop per batch and the loss of node
  # attribution — which is exactly why a wrong comment survived: nothing failed.
  #
  # The daemonset collector is the only one on the estate with an OTLP receiver (verified on
  # krateo-057: its otlp receiver binds :4318 and feeds the `traces` and `metrics` pipelines into
  # clickhouse); the gateway collector (`...-deployment-...`) declares port 4318 on its Service
  # but runs only k8s_cluster and k8sobjects receivers, so it ACCEPTS THE CONNECTION AND DROPS
  # EVERYTHING. $(HOST_IP) cannot reach it by accident, which the Service name could.
  #
  # Set this explicitly only for a collector that is NOT on the pod's node.
  endpoint: ""
  #
  # There is deliberately NO `protocol` key. telemetry.go constructs otlptracehttp /
  # otlpmetrichttp directly, and the Go OTLP-HTTP exporters do not read
  # OTEL_EXPORTER_OTLP_PROTOCOL (only the autoexport/otelconf packages do). The collector
  # DOES listen on :4317 for gRPC, so `protocol: grpc` would look entirely plausible, pass
  # schema validation, reach the pod, and change nothing. Offering gRPC means changing the
  # exporter in telemetry.go; the values key belongs with that change, not ahead of it.

# Per-caller event scoping (sse-proxy#29). DEFAULT-OFF.
#
# ENABLING THIS ALSO GRANTS THE SERVICE ACCOUNT, in this same chart, and that is deliberate:
# the proxy resolves a caller's namespaces with SubjectAccessReviews, and if the flag is on
# while the SA cannot create them, resolveRequestScope fails and EVERY /notifications request
# answers 500 — killing every bell on the cluster, admins included. The flag and the grants
# must be one change, so they are one template.
rbacScoping:
  enabled: false
  # RBAC_SCOPING_VERB / _RESOURCE / _APIGROUP / _CACHE_TTL. All null = the binary's defaults
  # (list / events / "" / 60s). Set one only to diverge.
  verb: null
  resource: null
  apiGroup: null
  cacheTTL: null

resources:
  limits:
    cpu: 200m
    memory: 128Mi
  requests:
    cpu: 50m
    memory: 32Mi

podAnnotations: {}

nodeSelector: {}

tolerations: []

affinity: {}
