# krateo-observability — ClickStack for Krateo observability, as a composition.
#
# The heavy upstream `clickstack` values live under the `clickstack:` key and are
# passed through verbatim. Helm's top-level `global` propagates into clickstack and
# all of its subcharts (clickhouse / otel / hyperdx / mongodb).

# storageClassName overrides the chart default (local-path) for GKE.
global:
  storageClassName: "standard-rwo"

# ---------------------------------------------------------------------------
# Krateo additions (rendered by this chart's own templates)
# ---------------------------------------------------------------------------
# NOTE: the GET /events?composition_id=<uid> ClickHouse HTTP handler (used by the
# portal events bell + the sse-proxy /notifications poller) is NO LONGER a separate
# ConfigMap mounted via clickstack.clickhouse.extraVolumes — that path is inert
# (upstream renders only cluster.spec) and the file-mount crashlooped on kind. It now
# lives natively in clickstack.clickhouse.cluster.spec.settings.extraConfig.http_handlers
# (see below), which the clickhouse.com operator merges into config.d/.

# Credentials Secret for the OTel collectors (otel-clickhouse-credentials).
# Created in THIS release's namespace (krateo-system) — the same namespace the
# collector pods run in, so no cross-namespace replication is needed.
# username/password must match the ClickStack ClickHouse `otelcollector` user
# (clickstack provisions it via extraUsersConfig with this same password).
otelCredentials:
  enabled: true
  secretName: otel-clickhouse-credentials
  username: otelcollector
  password: otelcollectorpass

# HyperDX external access. The upstream chart only emits a ClusterIP Service
# (krateo-clickstack-app); enabling this renders an ADDITIONAL LoadBalancer Service
# for the HyperDX UI (no hardcoded IP — the cloud assigns one).
#
# DISABLED BY DEFAULT (secure-by-default). HyperDX 2.35.0 OSS has ONLY its own built-in
# email+password login — no external JWT/OIDC/SSO federation — so a public LoadBalancer
# puts an internet-facing app guarded solely by that login on a raw cloud IP, outside the
# platform authn/agentgateway edge. Leave this false and reach the UI in-cluster
# (port-forward the krateo-clickstack-app ClusterIP:3000) or front it through the
# agentgateway. Set enabled:true only if you accept a directly-exposed HyperDX.
hyperdxLoadBalancer:
  enabled: false
  name: krateo-clickstack-app-lb
  port: 3000

# Default Alert rules so a FRESH install lands on a populated /alerts page instead of an
# empty one (the chart ships the Alert CRD + alert-troubleshooter but seeded zero Alerts).
# enabled:true by default; extend/override `alerts` freely, or set enabled:false to seed
# none. Each renders as an observability.krateo.io Alert CR off the live CRD schema
# (interval/threshold/thresholdType/where/description) and is user-editable/deletable.
# NOTE: the Alert CRD is served by the clickstack-agent — these apply AFTER that CRD is
# present (installer applies clickstack-agent first). Standalone-without-CRD → enabled:false.
# Metric resources that metric alerts in defaultAlerts refer to by name (metricRef).
defaultMetrics:
  - name: k8s-volume-available
    metricName: k8s.volume.available
    type: gauge
    unit: By
    collectedBy: kubeletstatsreceiver
    description: Bytes free on a pod volume. otel-collector-daemonset reports PersistentVolumeClaims only.
  - name: k8s-container-ready
    metricName: k8s.container.ready
    type: gauge
    collectedBy: k8sclusterreceiver
    description: 1 while a container passes its readiness probe, 0 otherwise. otel-collector-deployment reports it every 30s and drops it for Job pods.

defaultAlerts:
  # Ship the default alert set. Requires the Alert and Metric CRDs from alert-provider-crd; set
  # false when installing this chart standalone without them.
  enabled: true

  # Also ship the EXTENDED tier. Core alerts are the ones that should be silent on a healthy
  # cluster. Extended ones are catch-alls and baseline-relative rates — a busy cluster has a
  # non-zero steady level of them, so their thresholds mean "far above normal" and want retuning
  # against the cluster's own baseline before they are trusted.
  extended: false

  # THE ALERT SET.
  #
  # Every `where` below was RUN against 7 days of real rows before it was written here, and the
  # count it returned is recorded in docs/alerts.md. A zero there is not a defect — it means that
  # failure mode did not occur in the window, which is the healthy state for most of this list.
  # What the counts buy is the difference between "quiet because nothing is wrong" and "quiet
  # because the filter can never match", and the second is not hypothetical: the five alerts this
  # set replaces were all of the second kind.
  #
  # `above N` MEANS `count >= N`, NOT `count > N`. Read from the running HyperDX build
  # (2.35.0, packages/api/build/tasks/checkAlerts/index.js):
  #
  #     ABOVE -> value >= threshold        ABOVE_EXCLUSIVE -> value > threshold
  #     BELOW -> value <  threshold        BELOW_OR_EQUAL  -> value <= threshold
  #
  # So `threshold: 0` with `above` is UNCONDITIONALLY TRUE and fires on an empty result. The first
  # version of this catalogue shipped 15 such alerts; every one went ALERT on a cluster where the
  # condition was not occurring, and each firing alert opened a TroubleshootingReport. Verified by
  # A/B on the live cluster: two alerts with a clause matching zero rows, identical but for the
  # threshold — 0 fired, 1 stayed OK — and a third with threshold 1 over a clause matching 2,538
  # rows fired correctly.
  #
  # So a threshold is THE SMALLEST COUNT THAT SHOULD FIRE. `1` means "any occurrence". The
  # calibrated numbers below were measured as `count > N`, so they are written as N+1 here — which
  # is not pedantry: volume-attach at `above 3` fires in 9.4% of 15-minute windows against 0.6% at
  # `above 4`, a 15x difference.
  #
  # THREE RULES, each learned from an alert that could not fire:
  #
  #  1. `where` is CLICKHOUSE SQL, not Lucene — whatever the CRD's own field description says. The
  #     reconciler copies the filter verbatim into the query's WHERE clause, where Lucene dies:
  #         WHERE (Body:"MemoryPressure" OR Body:"DiskPressure")
  #         -> Code: 62. DB::Exception: Syntax error ... (SYNTAX_ERROR)
  #     The alert then sits at OK forever, indistinguishable from a healthy cluster.
  #  2. Do not filter on severity here. Before otel-collector-daemonset 0.1.17 it was empty on every
  #     row (0 non-empty of 8,140,061 over 24h), and this chart can install alongside an older
  #     collector, where a severity predicate counts zero forever. From 0.1.17 only JSON log lines
  #     carry it. Filter on Body, or on the event's own JSON. Elsewhere, use SeverityNumber >= 17.
  #  3. A LOG alert must exclude the observability stack; an EVENT alert need not. HyperDX writes
  #     the query it is running into its own container logs, so a log alert searching for a word
  #     finds the line in which the platform echoed that very word and diagnoses itself. Container
  #     logs carry telemetry.source = '' and events carry 'k8s-events', so scoping to events is a
  #     structural guard and scoping to logs needs the explicit ServiceName exclusion used below.
  #
  # Event alerts skip DELETED rows, the copy of an expired Event that re-fires them an hour later.
  #
  # METRIC ALERTS: an entry with metricRef aggregates a Metric from defaultMetrics instead of
  # counting log rows. Its labels select points by attribute or resource attribute, which needs
  # alert-provider 0.2.61: an older one matches point attributes only, so a kubeletstats filter
  # matches nothing, and a `below` alert then fires forever on the empty window.
  # Still not covered: CPU and memory pressure, node capacity, certificate days remaining.
  #
  # COST: each firing alert starts a model-driven RCA and opens a TroubleshootingReport, one per
  # alert (observed: 3 firing alerts -> exactly 3 reports). AlertTroubleshooter's reportCooldown
  # bounds re-runs per alert, not the fan-out across alerts.
  #
  # NAMES ARE PREFIXED sre- because Helm will not adopt a resource it does not already own: an
  # entry reusing the name of an alert someone hand-applied fails the upgrade outright with an
  # ownership error, which a draft of this set did against a hand-applied CR on a live cluster.
  alerts:
    - name: sre-pod-crashloop
      tier: core
      displayName: Pod crash-looping
      where: ResourceAttributes['telemetry.source'] = 'k8s-events' AND JSONExtractString(Body, 'type') != 'DELETED' AND JSONExtractString(Body, 'object', 'reason') = 'BackOff' AND positionCaseInsensitive(JSONExtractString(Body, 'object', 'message'), 'restarting failed container') > 0
      threshold: 1
      thresholdType: above
      interval: 5m
      description: A container keeps crashing and Kubernetes keeps restarting it.
    - name: sre-pod-oomkilled
      tier: core
      displayName: Pod killed for memory
      where: ResourceAttributes['telemetry.source'] = 'k8s-events' AND JSONExtractString(Body, 'type') != 'DELETED' AND (JSONExtractString(Body, 'object', 'reason') = 'OOMKilling' OR positionCaseInsensitive(JSONExtractString(Body, 'object', 'message'), 'oomkill') > 0)
      threshold: 1
      thresholdType: above
      interval: 5m
      description: A container was stopped because it used more memory than its limit allows.
    - name: sre-image-pull-failure
      tier: core
      displayName: Image pull failing
      where: ResourceAttributes['telemetry.source'] = 'k8s-events' AND JSONExtractString(Body, 'type') != 'DELETED' AND JSONExtractString(Body, 'object', 'reason') IN ('Failed', 'ErrImagePull', 'ImagePullBackOff') AND positionCaseInsensitive(JSONExtractString(Body, 'object', 'message'), 'pull image') > 0
      threshold: 1
      thresholdType: above
      interval: 5m
      description: A pod cannot download its container image, usually because of a wrong tag or expired registry credentials.
    - name: sre-pod-unschedulable
      tier: core
      displayName: Pod cannot be scheduled
      where: ResourceAttributes['telemetry.source'] = 'k8s-events' AND JSONExtractString(Body, 'type') != 'DELETED' AND JSONExtractString(Body, 'object', 'reason') = 'FailedScheduling'
      threshold: 1
      thresholdType: above
      interval: 15m
      description: A pod is waiting because no node has room for it or meets its requirements.
    - name: sre-pod-evicted
      tier: core
      displayName: Pod evicted
      where: ResourceAttributes['telemetry.source'] = 'k8s-events' AND JSONExtractString(Body, 'type') != 'DELETED' AND JSONExtractString(Body, 'object', 'reason') IN ('Evicted', 'EvictionThresholdMet')
      threshold: 1
      thresholdType: above
      interval: 5m
      description: A pod was removed from its node because the node ran short of memory or disk.
    - name: sre-pod-sandbox-failure
      tier: core
      displayName: Pod sandbox / lifecycle failure
      where: ResourceAttributes['telemetry.source'] = 'k8s-events' AND JSONExtractString(Body, 'type') != 'DELETED' AND JSONExtractString(Body, 'object', 'reason') IN ('FailedCreatePodSandBox', 'FailedKillPod', 'FailedSync')
      threshold: 1
      thresholdType: above
      interval: 5m
      description: Kubernetes could not set up or tear down a pod, usually because of a network or node problem.
    # count >= 3 keeps a probe that kept failing and drops the single readiness failure every pod
    # logs once on start (0.1.32). Readiness is not counted here since 0.1.35:
    # sre-container-not-ready watches it per container from the readiness metric. In the 7 days to
    # 2026-11-09 readiness was 160 of the 161 repeated probe events and all 5 firing windows, every
    # one a short dip during a roll or a node event. Liveness and startup probes stay here, because
    # a failing liveness probe restarts the container and shows no lasting unreadiness.
    - name: sre-probe-failing
      tier: core
      displayName: Liveness or startup probe failing
      where: ResourceAttributes['telemetry.source'] = 'k8s-events' AND JSONExtractString(Body, 'type') != 'DELETED' AND JSONExtractString(Body, 'object', 'reason') = 'Unhealthy' AND JSONExtractInt(Body, 'object', 'count') >= 3 AND NOT startsWith(JSONExtractString(Body, 'object', 'message'), 'Readiness probe')
      threshold: 6
      thresholdType: above
      interval: 15m
      description: A container keeps failing its liveness or startup health check, so Kubernetes restarts it.
    # One series per container: fires when a container has not been ready for 5 whole minutes in a
    # row, naming the namespace, pod and container that is out of its Service's endpoints. A roll's
    # short readiness dip stays below 5 minutes, and an empty minute restarts the count, so a pod
    # that is gone stops counting. Needs alert-provider 0.2.64 (groupBy, consecutiveWindows) and
    # otel-collector-deployment 0.3.15 (30s readiness, no Job pods: a finished Job pod is unready
    # for good, 895 such 5-minute runs in 7 days before 0.3.15). In the 7 days to 2026-11-09 on
    # krateo-057 it would have fired once: acmp's deliberate readiness test.
    - name: sre-container-not-ready
      tier: core
      displayName: Container not ready for 5 minutes
      metricRef: k8s-container-ready
      aggregation: max
      groupBy:
        - k8s.namespace.name
        - k8s.pod.name
        - k8s.container.name
      consecutiveWindows: 5
      threshold: 1
      thresholdType: below
      interval: 1m
      description: A container has failed its readiness check for 5 minutes, so it is not receiving traffic.
    - name: sre-job-failed
      tier: core
      displayName: Job or CronJob failed
      where: ResourceAttributes['telemetry.source'] = 'k8s-events' AND JSONExtractString(Body, 'type') != 'DELETED' AND JSONExtractString(Body, 'object', 'reason') IN ('BackoffLimitExceeded', 'JobFailed', 'FailedCreate')
      threshold: 1
      thresholdType: above
      interval: 15m
      description: A Job or CronJob failed, so the work it runs did not happen.
    - name: sre-volume-attach-failure
      tier: core
      displayName: Volume mount or attach failing
      where: ResourceAttributes['telemetry.source'] = 'k8s-events' AND JSONExtractString(Body, 'type') != 'DELETED' AND JSONExtractString(Body, 'object', 'reason') IN ('FailedMount', 'FailedAttachVolume') AND JSONExtractString(Body, 'object', 'involvedObject', 'namespace') != 'krateo-incident-checks'
      threshold: 4
      thresholdType: above
      interval: 15m
      description: A pod cannot mount one of its volumes.
    - name: sre-pvc-provisioning-failure
      tier: core
      displayName: PersistentVolume provisioning failed
      where: ResourceAttributes['telemetry.source'] = 'k8s-events' AND JSONExtractString(Body, 'type') != 'DELETED' AND JSONExtractString(Body, 'object', 'reason') IN ('ProvisioningFailed', 'FailedBinding')
      threshold: 1
      thresholdType: above
      interval: 15m
      description: Kubernetes cannot create or find the storage a volume claim asks for.
    - name: sre-node-not-ready
      tier: core
      displayName: Node not ready
      where: ResourceAttributes['telemetry.source'] = 'k8s-events' AND JSONExtractString(Body, 'type') != 'DELETED' AND JSONExtractString(Body, 'object', 'reason') IN ('NodeNotReady', 'NodeNotSchedulable', 'Rebooted')
      threshold: 1
      thresholdType: above
      interval: 5m
      description: A node went down, rebooted or stopped accepting new pods.
    - name: sre-node-resource-pressure
      tier: core
      displayName: Node under resource pressure
      where: ResourceAttributes['telemetry.source'] = 'k8s-events' AND JSONExtractString(Body, 'type') != 'DELETED' AND JSONExtractString(Body, 'object', 'reason') IN ('NodeHasDiskPressure', 'NodeHasInsufficientMemory', 'NodeHasInsufficientPID', 'FreeDiskSpaceFailed', 'ImageGCFailed')
      threshold: 1
      thresholdType: above
      interval: 5m
      description: A node is running low on disk, memory or process IDs.
    - name: sre-node-preempted
      tier: core
      displayName: Node preempted or scheduled for termination
      where: ResourceAttributes['telemetry.source'] = 'k8s-events' AND JSONExtractString(Body, 'type') != 'DELETED' AND JSONExtractString(Body, 'object', 'reason') IN ('Preempting', 'Preempted', 'TerminationScheduled')
      threshold: 1
      thresholdType: above
      interval: 5m
      description: The cloud provider is taking back a spot or preemptible node.
    - name: sre-loadbalancer-failure
      tier: core
      displayName: LoadBalancer reconciliation failing
      where: ResourceAttributes['telemetry.source'] = 'k8s-events' AND JSONExtractString(Body, 'type') != 'DELETED' AND JSONExtractString(Body, 'object', 'reason') IN ('SyncLoadBalancerFailed', 'CreatingLoadBalancerFailed', 'DeleteLoadBalancerFailed')
      threshold: 1
      thresholdType: above
      interval: 15m
      description: Kubernetes cannot create, update or delete a cloud load balancer.
    - name: sre-telemetry-pipeline-stalled
      tier: core
      displayName: Telemetry pipeline stalled
      where: ''
      threshold: 100
      thresholdType: below
      interval: 15m
      description: Almost no logs are arriving, so the other alerts may be blind.
    # The last two clauses drop two errors controller-runtime retries on its own: a reconcile cut short
    # by shutdown ("context canceled") and an optimistic-lock conflict ("the object has been
    # modified"). Both appear whenever core-provider restarts in a roll. On krateo-057 they were every
    # match in the 2 days to 2026-11-07, firing on 4 rolls. Config Connector's 516 matches in 4 days
    # were conflicts it re-queues too. What still fires is real: a CompositionDefinition stuck
    # waiting for its compositions to delete, 10 windows in those 4 days.
    - name: sre-krateo-composition-reconcile-error
      tier: core
      displayName: Krateo — composition reconcile errors
      where: (positionCaseInsensitive(Body, 'Reconciler error') > 0 OR JSONExtractString(Body, 'object', 'reason') = 'CannotObserveExternalResource') AND ResourceAttributes['telemetry.source'] = '' AND ServiceName NOT IN ('krateo-observability', 'krateo-alert-troubleshooter', 'krateo-alert-provider', 'incident-controller', 'incident-provider', 'krateo-clickstack', 'krateo-clickstack-clickhouse-clickhouse', 'krateo-clickstack-keeper-keeper', 'krateo-clickstack-mongodb', 'clickhouse-mcp-server', 'clickhouse-operator', 'incident-agent', 'autopilot', 'agentiko', 'kagent', 'repo-mcp-server') AND positionCaseInsensitive(concat(JSONExtractString(Body, 'err'), JSONExtractString(Body, 'error')), 'context canceled') = 0 AND positionCaseInsensitive(concat(JSONExtractString(Body, 'err'), JSONExtractString(Body, 'error')), 'the object has been modified') = 0
      threshold: 3
      thresholdType: above
      interval: 15m
      description: Krateo compositions are failing to reconcile, even if they still show Ready.
    - name: sre-krateo-provider-connection-failure
      tier: core
      displayName: Krateo — provider cannot reach its target
      where: ResourceAttributes['telemetry.source'] = 'k8s-events' AND JSONExtractString(Body, 'type') != 'DELETED' AND JSONExtractString(Body, 'object', 'reason') = 'CannotConnectToProvider'
      threshold: 11
      thresholdType: above
      interval: 15m
      description: A Krateo provider cannot connect to the system it manages, often because of expired credentials.
    - name: sre-app-panic
      tier: core
      displayName: Application panic or unhandled traceback
      where: 'ResourceAttributes[''telemetry.source''] = '''' AND ServiceName NOT IN (''krateo-observability'', ''krateo-alert-troubleshooter'', ''krateo-alert-provider'', ''incident-controller'', ''incident-provider'', ''krateo-clickstack'', ''krateo-clickstack-clickhouse-clickhouse'', ''krateo-clickstack-keeper-keeper'', ''krateo-clickstack-mongodb'', ''clickhouse-mcp-server'', ''clickhouse-operator'', ''incident-agent'', ''autopilot'', ''agentiko'', ''kagent'', ''repo-mcp-server'') AND (position(Body, ''panic: '') > 0 OR position(Body, ''Traceback (most recent call last)'') > 0 OR position(Body, ''Unhandled exception'') > 0)'
      threshold: 1
      thresholdType: above
      interval: 15m
      description: An application crashed on an unhandled error.
    - name: sre-app-out-of-memory
      tier: core
      displayName: Out-of-memory reported by an application
      where: ResourceAttributes['telemetry.source'] = '' AND ServiceName NOT IN ('krateo-observability', 'krateo-alert-troubleshooter', 'krateo-alert-provider', 'incident-controller', 'incident-provider', 'krateo-clickstack', 'krateo-clickstack-clickhouse-clickhouse', 'krateo-clickstack-keeper-keeper', 'krateo-clickstack-mongodb', 'clickhouse-mcp-server', 'clickhouse-operator', 'incident-agent', 'autopilot', 'agentiko', 'kagent', 'repo-mcp-server') AND (positionCaseInsensitive(Body, 'out of memory') > 0 OR position(Body, 'OutOfMemoryError') > 0 OR positionCaseInsensitive(Body, 'cannot allocate memory') > 0)
      threshold: 1
      thresholdType: above
      interval: 15m
      description: An application logged that it ran out of memory.
    # The drift exclusion: a composition controller's drift line lists changedObjects, and this
    # alert's own name holds both words it searches for, so it fired on its own update.
    - name: sre-certificate-expiry-warning
      tier: core
      displayName: Certificate expiry or TLS verification failure
      where: 'ResourceAttributes[''telemetry.source''] = '''' AND JSONExtractString(Body, ''msg'') != ''Composition drift detected and self-healed'' AND ServiceName NOT IN (''krateo-observability'', ''krateo-alert-troubleshooter'', ''krateo-alert-provider'', ''incident-controller'', ''incident-provider'', ''krateo-clickstack'', ''krateo-clickstack-clickhouse-clickhouse'', ''krateo-clickstack-keeper-keeper'', ''krateo-clickstack-mongodb'', ''clickhouse-mcp-server'', ''clickhouse-operator'', ''incident-agent'', ''autopilot'', ''agentiko'', ''kagent'', ''repo-mcp-server'') AND ((positionCaseInsensitive(Body, ''certificate'') > 0 AND (positionCaseInsensitive(Body, ''expir'') > 0 OR positionCaseInsensitive(Body, ''has expired'') > 0)) OR positionCaseInsensitive(Body, ''x509: certificate'') > 0)'
      threshold: 1
      thresholdType: above
      interval: 1h
      description: Something logged an expired, expiring or untrusted TLS certificate.
    # The redaction detector for installer#394. The collectors DO sweep JWTs out of log bodies
    # AND log attributes (transform/log_statements: replace_pattern on body.string, because a map
    # body ignores replace_pattern on body, and replace_all_patterns on attributes) — but that
    # processor runs error_mode: ignore, so a redaction statement that
    # FAILS is skipped SILENTLY and the pipeline keeps shipping. Switching to propagate would turn
    # a redaction bug into a telemetry outage, so the detector is the only thing that survives a
    # skipped statement. Matches the JWT SHAPE, not the string 'eyJ': a redacted row carries
    # <REDACTED-JWT> and must not match, which is the control measured below.
    # Unlike the other log alerts this one has neither telemetry.source = '' nor a ServiceName
    # exclusion, deliberately. Rule 3's exclusion stops an alert matching its own query text echoed
    # into logs, and this regex cannot match itself. The excluded services are the ones most likely
    # to leak: agents pass `--token eyJ...` on every kubectl call, and a token in HyperDX's own logs
    # is still a token in the store. Measured with no exclusions: 0 rows over 7 days on krateo-057.
    - name: sre-jwt-in-telemetry
      tier: core
      # A firing means a token got past both collectors. Its incident goes to a person: no RCA,
      # so no agent reads the row. Needs alert-provider 0.2.61; older ones ignore the label.
      metadataLabels:
        observability.krateo.io/analysis: human
      displayName: JWT leaked into telemetry
      where: '(match(Body, ''eyJ[A-Za-z0-9._-]{20,}'') OR match(toString(mapValues(LogAttributes)), ''eyJ[A-Za-z0-9._-]{20,}''))'
      threshold: 1
      thresholdType: above
      interval: 15m
      description: "An access token was stored unredacted in the logs and should be treated as leaked."
      runbook: "1. Treat the token as leaked from the moment it was written. Do not copy its value into a ticket, chat or query result you share. 2. Find who emitted it, without printing the value: group the matching otel_logs rows by ServiceName and ResourceAttributes['k8s.pod.name'] over the alert window. 3. If it may still be valid, revoke it. For a Krateo authn token, only a signing-key rotation revokes it (authn has no per-token revocation), which signs every user out, so weigh it against the token's remaining lifetime (decode only iss and exp). For other issuers, rotate the credential. 4. Stop it at the source: change the emitting service so it does not log the token. A collector redaction rule (otel-collector-daemonset) is defense in depth, not the fix. 5. Check the other copies: the pod's own container log and Google Cloud Logging (GKE ships stdout there, kept 30 days) hold the raw line even when ClickHouse is redacted."
    # The span half of installer#394: the same JWT shape, read from otel_traces. The collectors
    # delete http.header.Authorization and redact the rest, so this is the check for a token that
    # got past them. Needs alert-provider 0.2.62, which adds `source`; an older one refuses the field.
    - name: sre-jwt-in-traces
      tier: core
      metadataLabels:
        observability.krateo.io/analysis: human
      displayName: JWT leaked into traces
      source: traces
      where: "match(toString(mapValues(SpanAttributes)), 'eyJ[A-Za-z0-9._-]{20,}') OR match(StatusMessage, 'eyJ[A-Za-z0-9._-]{20,}') OR match(toString(mapValues(ResourceAttributes)), 'eyJ[A-Za-z0-9._-]{20,}') OR arrayExists(x -> match(toString(x), 'eyJ[A-Za-z0-9._-]{20,}'), `Events.Attributes`)"
      threshold: 1
      thresholdType: above
      interval: 15m
      description: "An access token was stored unredacted in the traces and should be treated as leaked."
      runbook: "1. Treat the token as leaked from the moment it was written. Do not copy its value into a ticket, chat or query result you share. 2. Find who emitted it, without printing the value: group the matching otel_traces rows by ServiceName and SpanName over the alert window, and note which attribute holds it. 3. If it may still be valid, revoke it. For a Krateo authn token, only a signing-key rotation revokes it (authn has no per-token revocation), which signs every user out, so weigh it against the token's remaining lifetime (decode only iss and exp). For other issuers, rotate the credential. 4. Stop it at the source: change the service's instrumentation so it does not record the token. otel-collector-daemonset deletes credential header keys and redacts JWT-shaped values; a firing means a token got past both, so also report the attribute to the collector's owner. 5. If the service also prints spans to stdout, check its container log and Google Cloud Logging."
    # S1 (2026-11-09): a credential HEADER, by key, in otel_traces: any span or span-event attribute
    # whose key names authorization, proxy-authorization, cookie or set-cookie. otel-collector-daemonset
    # 0.1.24 deletes those keys whatever the value, so one here means the redaction failed or a sender
    # bypassed the node agents. It complements sre-jwt-in-traces, which matches JWT-shaped VALUES and so
    # misses an opaque bearer token or a session cookie. Upstream kagent tools copy the raw
    # Authorization header into spans when tracing is on. 0 rows on krateo-057 in the 7 days to
    # 2026-11-09. Human-only, like the JWT detectors: no agent reads the leaked span.
    - name: sre-credential-header-in-traces
      tier: core
      metadataLabels:
        observability.krateo.io/analysis: human
      displayName: Credential header leaked into traces
      source: traces
      where: "arrayExists(k -> match(lower(k), 'authorization|cookie'), mapKeys(SpanAttributes)) OR arrayExists(m -> arrayExists(k -> match(lower(k), 'authorization|cookie'), mapKeys(m)), `Events.Attributes`)"
      threshold: 1
      thresholdType: above
      interval: 15m
      description: A credential header reached the traces, so the redaction failed; treat the credential as leaked and rotate it.
    # An incident whose check script stopped giving a verdict. incident-provider (>= 0.8.0) gives up
    # after the no-verdict bound and logs reason=ChecksUnknown once, in the JSON body (filelog leaves
    # its fields in Body, not LogAttributes). From then on nothing moves the incident except a person:
    # spec.applied, spec.closed or spec.reanalysis. Event-shaped: one line per incident, so the alert
    # fires once for each newly stuck incident and then resolves. Human-only: an RCA of "a check gave
    # no verdict" would re-read the same script output the log line already carries. Validated on
    # krateo-057 on 2026-11-10: 16 lines at the 0.8.0 roll = 16 Incidents with ChecksUnknown=True.
    # Decision: Diego 2026-11-10 (ChecksUnknown only, not "Open too long").
    - name: sre-incident-checks-unknown
      tier: core
      metadataLabels:
        observability.krateo.io/analysis: human
      displayName: Incident stuck, its checks give no verdict
      where: "ServiceName = 'incident-provider' AND JSONExtractString(Body, 'reason') = 'ChecksUnknown'"
      threshold: 1
      thresholdType: above
      interval: 15m
      description: An incident's check script stopped giving a verdict, so the incident can't move on by itself; open it and apply, close or re-analyse it.
    # The ClickHouse data volume. A full disk is how this stack has failed before (installer#393):
    # inserts fail, collectors buffer and crash, and telemetry stops. The threshold is 20% of the
    # 15Gi claimed in clickhouse.cluster.spec.dataVolumeClaimSpec below. Change both together.
    # `below` also fires if the metric stops: the volume stopped reporting, which is worth knowing.
    # Needs otel-collector-daemonset 0.1.19 or later for k8s.volume.*, and alert-provider 0.2.61.
    - name: sre-clickhouse-disk-headroom
      tier: core
      displayName: ClickHouse disk below 20% free
      metricRef: k8s-volume-available
      aggregation: min
      labels:
        k8s.persistentvolumeclaim.name: clickhouse-storage-volume-krateo-clickstack-clickhouse-clickhouse-0-0-0
      threshold: 3221225472
      thresholdType: below
      interval: 15m
      description: "The telemetry database's disk has less than 3 GiB free, and audit partitions must never be dropped to free it."
      runbook: "1. Confirm the disk is the problem. A Ready ClickHouse pod is not evidence of a healthy disk. The definitive symptom is Code: 243 or 'Not enough space' in the ClickHouse log (kubectl logs -n krateo-system -l clickhouse.altinity.com/chi=krateo-clickstack-clickhouse --tail=200). 2. Find and stop the source first, or the disk fills again within the hour: SELECT ServiceName, count() FROM default.otel_logs WHERE Timestamp > now() - INTERVAL 1 HOUR GROUP BY ServiceName ORDER BY 2 DESC LIMIT 10 (works with the shipped otelcollector credentials). Rule out your own diagnostic Jobs, whose output the collectors scrape back into otel_logs. 3. Make room. Expand the volume through the Installer CR, componentValues krateo-observability clickstack.clickhouse.cluster.spec.dataVolumeClaimSpec.resources.requests.storage, never by editing the PVC (the reconciler reverts it). Expansion is one-way; FileSystemResizePending clears when the pod restarts. Or, with an ops principal, drop the oldest partition of otel_logs or otel_traces. 4. NEVER drop a partition of krateo_audit, krateo_audit_seal or krateo_audit_worm: the audit trail is sealed, and removing rows is indistinguishable from tampering. If the audit tables filled the disk, escalate instead. Full runbook: docs/clickhouse-disk-full.md in krateo-platformops/observability."
    - name: sre-rbac-denied-burst
      tier: extended
      displayName: Authorization failures elevated
      where: 'ResourceAttributes[''telemetry.source''] = '''' AND ServiceName NOT IN (''krateo-observability'', ''krateo-alert-troubleshooter'', ''krateo-alert-provider'', ''incident-controller'', ''incident-provider'', ''krateo-clickstack'', ''krateo-clickstack-clickhouse-clickhouse'', ''krateo-clickstack-keeper-keeper'', ''krateo-clickstack-mongodb'', ''clickhouse-mcp-server'', ''clickhouse-operator'', ''incident-agent'', ''autopilot'', ''agentiko'', ''kagent'', ''repo-mcp-server'') AND (positionCaseInsensitive(Body, ''is forbidden: user'') > 0 OR positionCaseInsensitive(Body, ''permission denied'') > 0 OR position(Body, ''AccessDenied'') > 0)'
      threshold: 20
      thresholdType: above
      interval: 15m
      description: Many requests are being refused for missing permissions.
    - name: sre-upstream-timeouts
      tier: extended
      displayName: Upstream timeouts elevated
      where: ResourceAttributes['telemetry.source'] = '' AND ServiceName NOT IN ('krateo-observability', 'krateo-alert-troubleshooter', 'krateo-alert-provider', 'incident-controller', 'incident-provider', 'krateo-clickstack', 'krateo-clickstack-clickhouse-clickhouse', 'krateo-clickstack-keeper-keeper', 'krateo-clickstack-mongodb', 'clickhouse-mcp-server', 'clickhouse-operator', 'incident-agent', 'autopilot', 'agentiko', 'kagent', 'repo-mcp-server') AND (position(Body, 'context deadline exceeded') > 0 OR positionCaseInsensitive(Body, 'i/o timeout') > 0 OR positionCaseInsensitive(Body, 'connection refused') > 0)
      threshold: 50
      thresholdType: above
      interval: 15m
      description: Calls between services are timing out or being refused more than usual.
    - name: sre-volume-resize-issue
      tier: extended
      displayName: Volume resize pending or failed
      where: ResourceAttributes['telemetry.source'] = 'k8s-events' AND JSONExtractString(Body, 'type') != 'DELETED' AND JSONExtractString(Body, 'object', 'reason') IN ('FileSystemResizeRequired', 'VolumeResizeFailed', 'ExternalExpanding')
      threshold: 1
      thresholdType: above
      interval: 1h
      description: A volume resize is stuck or waiting for a pod restart.
    - name: sre-krateo-external-resource-failure
      tier: extended
      displayName: Krateo — external resource operations failing
      where: ResourceAttributes['telemetry.source'] = 'k8s-events' AND JSONExtractString(Body, 'type') != 'DELETED' AND JSONExtractString(Body, 'object', 'reason') LIKE 'Cannot%ExternalResource'
      threshold: 200
      thresholdType: above
      interval: 15m
      description: Krateo providers are failing to manage their external resources far more often than usual.
    - name: sre-kubernetes-warning-burst
      tier: extended
      displayName: Kubernetes warning events elevated
      where: ResourceAttributes['telemetry.source'] = 'k8s-events' AND JSONExtractString(Body, 'type') != 'DELETED' AND JSONExtractString(Body, 'object', 'type') = 'Warning'
      threshold: 100
      thresholdType: above
      interval: 15m
      description: Kubernetes is reporting far more warnings than usual.

# ---------------------------------------------------------------------------
# Upstream clickstack passthrough (verbatim from obs-stack/clickstack/values.yaml)
# ---------------------------------------------------------------------------
clickstack:
  # Stable resource names regardless of the Helm release name. Krateo's core-provider
  # installs a composition's release as "<composition-name>-<random>", so without this
  # the ClickHouse/Keeper/Mongo Services would be named after that random release name
  # and the otel-collector / mcp / sse-proxy references (which expect
  # krateo-clickstack-clickhouse-clickhouse-headless) would not resolve.
  fullnameOverride: krateo-clickstack

  clickhouse:
    enabled: true
    # IMPORTANT: upstream clickstack 3.0.0 renders ONLY `clickhouse.cluster.spec` into the
    # ClickHouseCluster CR (templates/clickhouse/cluster.yaml: `tpl (toYaml
    # .Values.clickhouse.cluster.spec)`) and references NONE of the top-level clickhouse.*
    # keys. So container resources MUST live under cluster.spec.containerTemplate.resources
    # to take effect; the old top-level `resources:` here was INERT (ClickHouse ran at the
    # operator default ~1Gi and the bell /notifications poller OOMed — MEMORY_LIMIT_EXCEEDED).
    cluster:
      spec:
        containerTemplate:
          # ClickHouse server image. Upstream clickstack 3.2.0 defaults this to
          # clickhouse/clickhouse-server:25.7-alpine (a MAP: image.repository +
          # image.tag — see charts/clickstack/values.yaml cluster.spec.containerTemplate.image),
          # which is now EOL. Override only the tag to 26.8-alpine (newest ClickHouse
          # LTS); repository deep-merges from upstream (clickhouse/clickhouse-server).
          # This is the REAL, live image now (it lands in the ClickHouseCluster CR spec
          # the operator reads), NOT the old inert top-level clickhouse.image placeholder
          # that upstream ignored. Realizing it live is a ClickHouse server version
          # upgrade (25.7->26.8) that ROLLS the StatefulSet — it must be bench-validated
          # and must not ride an unrelated installer reconcile (Keeper lockstep,
          # versionProbe Job, http_handlers/TTL config re-check on 26.8).
          # PINNED BY DIGEST (0.1.43). The tag `26.8-alpine` floats: every pod restart pulls the
          # newest 26.8 build, so the S1 lockdown restart on 2026-11-11 silently upgraded 057 from
          # 26.8.7.19 to 26.8.36.3. The operator (v0.0.7 ContainerImage.String) uses `tag` if it is
          # set and `hash` only otherwise, so the upstream tag is nulled to make the hash win.
          # The digest is the multi-arch index of clickhouse/clickhouse-server:26.8.36.3-alpine
          # (== 26.8-alpine on 2026-10-26), the build 057 runs now, and the digest krateo-slo-rollup
          # pins for its client. To upgrade, change the digest and say which version it is here.
          image:
            tag: null
            hash: "sha256:f5443f9ffa48f0154cdd50cab39fed732201762574a27f04f1f564bbba81832d"
          # Password hashes of the chart's ClickHouse users (settings.extraUsersConfig below). Each
          # user's password_sha256_hex is read from one of these variables with @from_env, so the hash
          # comes from a Secret and never sits in values, the ClickHouseCluster CR or the operator's
          # ConfigMap. templates/clickhouse-user-credentials.yaml creates every Secret named here and
          # refuses to render if any entry is missing: a componentValues override of this list
          # replaces it whole, and without the variable the user has no valid password.
          # The variables are read when the pod starts, so adding one ROLLS the ClickHouse pod, and
          # changing a Secret's password needs a restart before the new one works. That is why every
          # user of the lockdown (and default's future hash) is here at once: one restart (0.1.42).
          env:
            - name: CLICKHOUSE_USER_SSE_PROXY_SHA256
              valueFrom:
                secretKeyRef:
                  name: clickhouse-sse-proxy-credentials
                  key: password_sha256_hex
            - name: CLICKHOUSE_USER_SNOWPLOW_READER_SHA256
              valueFrom:
                secretKeyRef:
                  name: clickhouse-snowplow-reader-credentials
                  key: password_sha256_hex
            - name: CLICKHOUSE_USER_ANALYST_SHA256
              valueFrom:
                secretKeyRef:
                  name: clickhouse-analyst-credentials
                  key: password_sha256_hex
            - name: CLICKHOUSE_USER_MCP_READER_SHA256
              valueFrom:
                secretKeyRef:
                  name: clickhouse-mcp-reader-credentials
                  key: password_sha256_hex
            - name: CLICKHOUSE_USER_NIGHTLY_READER_SHA256
              valueFrom:
                secretKeyRef:
                  name: clickhouse-nightly-reader-credentials
                  key: password_sha256_hex
            - name: CLICKHOUSE_USER_AUDIT_SEALER_SHA256
              valueFrom:
                secretKeyRef:
                  name: clickhouse-audit-sealer-credentials
                  key: password_sha256_hex
            - name: CLICKHOUSE_USER_AUDIT_VERIFIER_SHA256
              valueFrom:
                secretKeyRef:
                  name: clickhouse-audit-verifier-credentials
                  key: password_sha256_hex
            - name: CLICKHOUSE_USER_OTEL_WRITER_SHA256
              valueFrom:
                secretKeyRef:
                  name: clickhouse-otel-writer-credentials
                  key: password_sha256_hex
            - name: CLICKHOUSE_USER_HYPERDX_SHA256
              valueFrom:
                secretKeyRef:
                  name: clickhouse-hyperdx-credentials
                  key: password_sha256_hex
            - name: CLICKHOUSE_USER_SLO_ROLLUP_SHA256
              valueFrom:
                secretKeyRef:
                  name: clickhouse-slo-rollup-credentials
                  key: password_sha256_hex
            # `default`'s future hash. NOTHING reads it yet: `default` keeps the operator's
            # no_password until the lockdown's last step, which then only edits users.default in
            # extraUsersConfig (a hot reload, no restart) to read this variable. Shipping the
            # variable now is what saves that step a restart.
            - name: CLICKHOUSE_USER_DEFAULT_SHA256
              valueFrom:
                secretKeyRef:
                  name: clickhouse-default-password
                  key: password_sha256_hex
          resources:
            limits:
              cpu: "4"
              memory: 8Gi
            requests:
              cpu: "1"
              memory: 2Gi
        # RETENTION INCIDENT (2026-07): the upstream default 10Gi data volume filled in
        # 8 DAYS on a live bench — no TTL anywhere (otel_* tables unbounded + the
        # system.* log tables unbounded at ~3.6GiB) → every insert failed with code 243
        # (NOT_ENOUGH_SPACE) → the OTel collectors buffered, OOM-crash-looped and
        # telemetry went fully dead. 15Gi matches the live relief (PVC expanded
        # 10Gi->15Gi); the paired fixes are the 3-day system-log ttl under
        # settings.extraConfig below and the 7-day otel_* TTL in the collector charts'
        # clickhouse exporter (ttl: 168h). Only the overridden key is set here — Helm
        # deep-merges cluster.spec over the upstream default (same pattern as
        # containerTemplate.resources above, which inherits upstream's image), so
        # accessModes etc. still come from upstream clickstack.
        dataVolumeClaimSpec:
          resources:
            requests:
              storage: 15Gi
        # VERSION-PROBE OOM: on every install/upgrade the clickhouse.com operator runs a
        # one-shot "version-probe" Job (a Pod that reports the target ClickHouse image's
        # version before the real StatefulSet rolls) with NO resource request/limit of its
        # own — it inherits nothing from containerTemplate above (different pod entirely).
        # On a memory-constrained node it gets OOMKilled/Pending and the rollout stalls, so
        # every install had to be finished by hand:
        #   kubectl patch clickhouseclusters.clickhouse.com -n krateo-system krateo-clickstack-clickhouse \
        #     --type merge -p '{"spec":{"versionProbeTemplate":{"spec":{"template":{"spec":{"containers":[
        #     {"name":"version-probe","resources":{"requests":{"cpu":"100m","memory":"128Mi"},
        #     "limits":{"cpu":"500m","memory":"1Gi"}}}]}}}}}}'
        # versionProbeTemplate is a real field on the ClickHouseCluster CRD (a bare PodTemplate
        # spec) and cluster.spec is passed through verbatim same as containerTemplate/
        # dataVolumeClaimSpec above, so setting it here makes the patch permanent instead of a
        # per-install manual step.
        versionProbeTemplate:
          spec:
            template:
              spec:
                containers:
                  - name: version-probe
                    resources:
                      requests:
                        cpu: 100m
                        memory: 128Mi
                      limits:
                        cpu: 500m
                        memory: 1Gi
        # ClickHouse server config merged into /etc/clickhouse-server/config.d/ by the
        # clickhouse.com operator. The GET /events?composition_id=<uid> handler MUST be
        # registered here, NOT via clickhouse.extraVolumes (see below): a predefined HTTP
        # handler is the ONLY supported way to serve /events — the portal events bell and
        # the sse-proxy /notifications poller both call this endpoint; the raw native-SQL /
        # dynamic-query API path is intentionally not used.
        #
        # Why extraConfig and not a mounted ConfigMap file:
        #   - upstream clickstack 3.0.0 renders ONLY clickhouse.cluster.spec into the
        #     ClickHouseCluster CR (templates/clickhouse/cluster.yaml does
        #     `tpl (toYaml .Values.clickhouse.cluster.spec)`), so clickhouse.extraVolumes /
        #     extraVolumeMounts are NEVER read — the old clickhouse-http-handlers ConfigMap
        #     was a dead object and /events 404'd;
        #   - the clickhouse.com ClickHouseCluster CRD has no extraVolumes field anyway —
        #     volumes go under cluster.spec.podTemplate.volumes + containerTemplate.volumeMounts;
        #   - and a subPath file-mount into config.d/ crashloops the pod on kind/containerd
        #     ("not a directory").
        # settings.extraConfig is the operator-native merge point: the operator writes it into
        # config.d/ (as YAML, which ClickHouse loads natively). A YAML list under `rule` renders
        # to repeated <rule> elements. The /ping, /replicas_status, /metrics and the catch-all `/`
        # dynamic_query_handler rules are required: once http_handlers is defined ClickHouse stops
        # serving its default routes, so the operator probes + native query API must be re-declared.
        settings:
          # PORTAL READER USERS. sse-proxy and snowplow read ClickHouse as `default` today, which has
          # no password and GRANT ALL. These two users bound portal reads instead: read-only, a time
          # limit, two threads each and a per-user query cap, so reads can't fill the server's 100
          # query slots that ingestion also needs. This chart only ADDS them; moving the clients onto
          # them is a separate, coordinated change (sse-proxy's CLICKHOUSE_USER/PASSWORD, and the
          # portal's clickhouse-endpoint Secret for snowplow).
          #
          # LOCKDOWN USERS (0.1.42). One user per remaining client of `default`, `app` and
          # `otelcollector`: analyst, mcp_reader, nightly_reader, audit_sealer, audit_verifier,
          # otel_writer, hyperdx, slo_rollup. Same pattern: a chart-generated Secret, the hash via
          # @from_env, one per-table GRANT statement. 0.1.42 only ADDS them; each client moves onto
          # its user in its own later change. Grants and profiles as tested on kind against 057's
          # DDL with ClickHouse 26.8.36.3 and operator 0.0.7 (2026-11-10).
          #
          # Helm deep-merges this map with upstream clickstack's (app, otelcollector) and with any
          # componentValues users (chops). Keys are ClickHouse users.d YAML, written by the operator
          # to users.d/99-extra-users-config.yaml.
          #
          # readonly is 2, NOT 1: readonly=1 refuses every query that sets a setting, and sse-proxy
          # sends readonly, cancel_http_readonly_queries_on_client_close and max_execution_time with
          # each query. cancel_http_readonly_queries_on_client_close only acts when readonly > 0, and
          # it cancels a query whose HTTP client has gone away instead of running it to the end.
          # The constraints keep a client from raising the limits per query.
          extraUsersConfig:
            profiles:
              portal_reader:
                readonly: 2
                cancel_http_readonly_queries_on_client_close: 1
                max_execution_time: 8
                max_threads: 2
                max_concurrent_queries_for_user: 16
                constraints:
                  max_execution_time:
                    max: 8
                  max_threads:
                    max: 2
                  max_concurrent_queries_for_user:
                    const: true
              # snowplow's admin widgets: the same limits, at most 8 queries at a time. Written out
              # in full on purpose. `profile: portal_reader` (inheritance) does not work here: the
              # operator writes this map with its keys sorted, so `profile` lands after the
              # override and the inherited 16 wins (measured on kind: getSetting gave 16).
              # snowplow can't send settings per query, so this profile is all it gets.
              portal_reader_snowplow:
                readonly: 2
                cancel_http_readonly_queries_on_client_close: 1
                max_execution_time: 8
                max_threads: 2
                max_concurrent_queries_for_user: 8
                constraints:
                  max_execution_time:
                    max: 8
                  max_threads:
                    max: 2
                  max_concurrent_queries_for_user:
                    const: true
              # analyst: people and agent sessions running ad-hoc queries (port-forward scripts,
              # in-cluster curl, `kubectl exec ... clickhouse-client --user analyst`). readonly=2 so
              # per-query settings (log_comment, max_block_size, ...) are accepted; a client that
              # passes `--readonly=1` is refused (164) and has to drop the flag. 30 s, 4 threads,
              # 4 GiB and 4 queries at a time, none raisable.
              analyst:
                readonly: 2
                cancel_http_readonly_queries_on_client_close: 1
                max_execution_time: 30
                max_threads: 4
                max_concurrent_queries_for_user: 4
                max_memory_usage: 4294967296
                constraints:
                  max_execution_time:
                    max: 30
                  max_threads:
                    max: 4
                  max_concurrent_queries_for_user:
                    const: true
                  max_memory_usage:
                    max: 4294967296
              # mcp_reader: clickhouse-mcp-server (mcp-clickhouse 0.5.0) sends readonly=1 with EVERY
              # query, and a profile with readonly 1 or 2 refuses that (164, measured on kind). So
              # this profile is readonly=0 and the per-query readonly=1 is what applies; the grant
              # (SELECT only) is the write boundary either way. The caps can't be raised per query.
              mcp_reader:
                readonly: 0
                max_execution_time: 30
                max_threads: 2
                max_concurrent_queries_for_user: 4
                max_memory_usage: 2147483648
                constraints:
                  max_execution_time:
                    max: 30
                  max_threads:
                    max: 2
                  max_concurrent_queries_for_user:
                    const: true
                  max_memory_usage:
                    max: 2147483648
              # batch_reader: nightly-review's 02:00 run (max 1.6 s seen); it sets max_result_rows
              # and result_overflow_mode per query, which readonly=2 accepts.
              batch_reader:
                readonly: 2
                cancel_http_readonly_queries_on_client_close: 1
                max_execution_time: 60
                max_threads: 2
                max_concurrent_queries_for_user: 2
                constraints:
                  max_execution_time:
                    max: 60
                  max_threads:
                    max: 2
                  max_concurrent_queries_for_user:
                    const: true
              # hyperdx: the HyperDX UI and its alert checks (alert p99 0.5 s, max 4.1 s). HyperDX
              # sends its own settings per query, which readonly=2 accepts.
              hyperdx:
                readonly: 2
                cancel_http_readonly_queries_on_client_close: 1
                max_execution_time: 60
                constraints:
                  max_execution_time:
                    max: 60
              # audit_readonly: the krateo-audit-worm verify Job. readonly=2, not 1: its
              # `clickhouse-client --queries-file` sets log_comment, which readonly=1 refuses (164).
              audit_readonly:
                readonly: 2
            users:
              # Grants: ONE statement per user. users.d YAML applies only the FIRST `grants` item
              # and drops the rest without a word (docs/clickhouse-disk-full.md). Per table, never
              # ON default.* or ON system.*: default.* would reach krateo_audit's sealing tables.
              # Check on the database with SHOW GRANTS FOR <user> and CHECK GRANT, not in config.
              #
              # sse_proxy reads otel_logs (/events and the /notifications poller) and krateo_audit
              # (/audit), unqualified, in the default database.
              sse_proxy:
                password_sha256_hex:
                  "@from_env": CLICKHOUSE_USER_SSE_PROXY_SHA256
                profile: portal_reader
                grants:
                  - query: "GRANT SELECT ON default.otel_logs, SELECT ON default.krateo_audit"
              # snowplow_reader: the tables read by the RESTAction stages that use
              # endpointRef clickhouse-endpoint (41 stages in 35 RESTActions on krateo-057).
              snowplow_reader:
                password_sha256_hex:
                  "@from_env": CLICKHOUSE_USER_SNOWPLOW_READER_SHA256
                profile: portal_reader_snowplow
                grants:
                  - query: >-
                      GRANT SELECT ON default.otel_logs, SELECT ON default.otel_traces,
                      SELECT ON default.otel_metrics_gauge, SELECT ON default.otel_metrics_sum,
                      SELECT ON default.otel_metrics_histogram, SELECT ON default.krateo_audit
              # analyst: every telemetry table and krateo_audit, nothing else. No sealing tables and
              # no system.query_log (it holds every user's query text) unless Diego adds them.
              # system.tables and system.columns are readable without a grant, filtered to the
              # tables the user can see.
              analyst:
                password_sha256_hex:
                  "@from_env": CLICKHOUSE_USER_ANALYST_SHA256
                profile: analyst
                grants:
                  - query: >-
                      GRANT SELECT ON default.otel_logs, SELECT ON default.otel_traces,
                      SELECT ON default.otel_metrics_gauge, SELECT ON default.otel_metrics_sum,
                      SELECT ON default.otel_metrics_histogram,
                      SELECT ON default.otel_metrics_exponential_histogram,
                      SELECT ON default.otel_metrics_summary, SELECT ON default.krateo_audit
              # mcp_reader: clickhouse-mcp-server's run_query for clickstack-agent and incident-agent.
              mcp_reader:
                password_sha256_hex:
                  "@from_env": CLICKHOUSE_USER_MCP_READER_SHA256
                profile: mcp_reader
                grants:
                  - query: >-
                      GRANT SELECT ON default.otel_logs, SELECT ON default.otel_traces,
                      SELECT ON default.otel_metrics_gauge, SELECT ON default.otel_metrics_sum,
                      SELECT ON default.otel_metrics_histogram, SELECT ON default.krateo_audit
              # nightly_reader: nightly-review reads otel_logs only (057 query_log, 3 days).
              nightly_reader:
                password_sha256_hex:
                  "@from_env": CLICKHOUSE_USER_NIGHTLY_READER_SHA256
                profile: batch_reader
                grants:
                  - query: "GRANT SELECT ON default.otel_logs"
              # audit_sealer: the krateo-audit-worm seal CronJob. Every run executes schema.sql's
              # CREATE ... IF NOT EXISTS, and CREATE MATERIALIZED VIEW IF NOT EXISTS checks SELECT and
              # INSERT on its TO table (krateo_audit_worm) even when the view exists, so the sealer
              # can write WORM rows; it can already write seals. NEVER ALTER, DELETE, DROP or TRUNCATE.
              audit_sealer:
                password_sha256_hex:
                  "@from_env": CLICKHOUSE_USER_AUDIT_SEALER_SHA256
                profile: default
                grants:
                  - query: >-
                      GRANT SELECT ON default.krateo_audit,
                      SELECT, INSERT, CREATE TABLE ON default.krateo_audit_worm,
                      SELECT, INSERT, CREATE TABLE ON default.krateo_audit_seal,
                      CREATE VIEW ON default.krateo_audit_worm_mv
              # audit_verifier: the krateo-audit-worm verify CronJob. SHOW TABLES on the view: without
              # it the view is invisible to the user and verify reports `unprotected`.
              audit_verifier:
                password_sha256_hex:
                  "@from_env": CLICKHOUSE_USER_AUDIT_VERIFIER_SHA256
                profile: audit_readonly
                grants:
                  - query: >-
                      GRANT SELECT ON default.krateo_audit, SELECT ON default.krateo_audit_worm,
                      SELECT ON default.krateo_audit_seal, SHOW TABLES ON default.krateo_audit_worm_mv
              # otel_writer: the three collectors, in place of otelcollector. Per table:
              # - INSERT, the rows;
              # - CREATE TABLE, because CREATE TABLE IF NOT EXISTS on an existing table still checks it;
              # - SELECT, because the two materialized views have no definer and push with the
              #   INSERTER's rights: without SELECT on otel_traces / krateo_audit the source insert
              #   commits and the view's copy is refused (497), a silent gap in the WORM trail.
              # otel_traces_trace_id_ts needs SELECT and INSERT for tailsampling's
              # CREATE MATERIALIZED VIEW IF NOT EXISTS. NO grant at all on krateo_audit_worm or
              # krateo_audit_seal: the view feeds the WORM table without one, and with INSERT the
              # collectors' credential could forge WORM rows.
              otel_writer:
                password_sha256_hex:
                  "@from_env": CLICKHOUSE_USER_OTEL_WRITER_SHA256
                profile: default
                grants:
                  - query: >-
                      GRANT SELECT, INSERT, CREATE TABLE ON default.otel_logs,
                      SELECT, INSERT, CREATE TABLE ON default.otel_traces,
                      SELECT, INSERT, CREATE TABLE ON default.otel_traces_trace_id_ts,
                      SELECT, INSERT, CREATE TABLE ON default.otel_metrics_gauge,
                      SELECT, INSERT, CREATE TABLE ON default.otel_metrics_sum,
                      SELECT, INSERT, CREATE TABLE ON default.otel_metrics_histogram,
                      SELECT, INSERT, CREATE TABLE ON default.otel_metrics_exponential_histogram,
                      SELECT, INSERT, CREATE TABLE ON default.otel_metrics_summary,
                      SELECT, INSERT, CREATE TABLE ON default.krateo_audit,
                      CREATE VIEW ON default.otel_traces_trace_id_ts_mv
              # hyperdx: the HyperDX UI and alerts, in place of app. The one system table HyperDX
              # needs a grant for is data_skipping_indices; system.tables, columns, settings,
              # table_engines and one are readable without one.
              hyperdx:
                password_sha256_hex:
                  "@from_env": CLICKHOUSE_USER_HYPERDX_SHA256
                profile: hyperdx
                grants:
                  - query: >-
                      GRANT SELECT ON default.otel_logs, SELECT ON default.otel_traces,
                      SELECT ON default.otel_metrics_gauge, SELECT ON default.otel_metrics_sum,
                      SELECT ON default.otel_metrics_histogram, SELECT ON default.krateo_audit,
                      SELECT ON system.data_skipping_indices
              # slo_rollup: krateo-slo-rollup, off by default. Here so enabling it later neither
              # needs otelcollector nor restarts ClickHouse. (SHOW GRANTS names ALTER MODIFY TTL
              # `ALTER TTL`.)
              slo_rollup:
                password_sha256_hex:
                  "@from_env": CLICKHOUSE_USER_SLO_ROLLUP_SHA256
                profile: default
                grants:
                  - query: >-
                      GRANT SELECT ON default.otel_metrics_sum, SELECT ON default.otel_metrics_histogram,
                      SELECT, INSERT, CREATE TABLE, ALTER MODIFY TTL ON default.krateo_slo_daily,
                      CREATE VIEW ON default.krateo_slo_daily_mv
              # `default`, `app` and `otelcollector` are NOT changed here (0.1.42 switches no client).
          extraConfig:
            # SERVER LOG FILES — the other half of the retention incident below.
            # That fix bounded the system.* log TABLES with a 3-day ttl, but the server's own
            # log FILES on /var/log/clickhouse-server share the SAME PVC as the data, and nothing
            # bounded them. Upstream defaults are level=trace, size=1000M, count=50 — a rotation
            # budget of 50GB on a 15Gi volume, i.e. rotation can never reclaim anything because it
            # is allowed to hold more than three times the disk.
            #
            # Measured on krateo-057 2026-10-12: /var/log/clickhouse-server was 3.4G of a 13.1G/14.7G
            # (90% full) volume — a live 600M clickhouse-server.log growing ~100MB/h plus 15 rotated
            # ~100M .gz files. Data itself was only 9.7G. ClickHouse needs free space to merge, so a
            # volume held at 90% by its own logs degrades SELECTs on the data beside them.
            #
            # level `information` is ClickHouse's conventional production level; `trace` logs every
            # query pipeline step and also feeds system.text_log (29M rows / 1.13GiB here), so it
            # costs CPU and write bandwidth on a server that is already CPU-throttled.
            # size x count = 100M x 5 = 500MB ceiling, ~3% of the volume instead of 333%.
            logger:
              level: information
              size: 100M
              count: 5
            # SYSTEM-LOG RETENTION — DO NOT REMOVE (see the dataVolumeClaimSpec comment
            # above: with no <ttl> the system.* log tables grow unbounded and were
            # ~3.6GiB of the 10Gi disk when the bench filled up and inserts died with
            # code 243). Each key below merges into the server's default <query_log>/…
            # section via the same operator-native extraConfig->config.d merge that
            # http_handlers uses (YAML maps render as nested config elements). `ttl` is
            # the documented per-system-log-table engine TTL and is applied when
            # ClickHouse (re)creates the table. NOTE for EXISTING installs: on the next
            # server start ClickHouse detects the changed table definition, renames the
            # old table (e.g. query_log_0) and creates a fresh one with the TTL — the
            # renamed leftovers keep their disk until manually DROPped.
            query_log:
              ttl: "event_date + INTERVAL 3 DAY DELETE"
            text_log:
              ttl: "event_date + INTERVAL 3 DAY DELETE"
            metric_log:
              ttl: "event_date + INTERVAL 3 DAY DELETE"
            part_log:
              ttl: "event_date + INTERVAL 3 DAY DELETE"
            asynchronous_metric_log:
              ttl: "event_date + INTERVAL 3 DAY DELETE"
            trace_log:
              ttl: "event_date + INTERVAL 3 DAY DELETE"
            http_handlers:
              rule:
                # GET /events?composition_id=<uid>
                # The compositionresolver OTel processor enriches each K8s event with
                # LogAttributes['krateo.io/composition-id'] (composition resource UID).
                - url: "/events"
                  methods: "GET"
                  handler:
                    type: predefined_query_handler
                    query: |
                      SELECT
                          ifNull(JSONExtractString(Body, 'object', 'involvedObject', 'name'), '')      AS obj_name,
                          ifNull(JSONExtractString(Body, 'object', 'involvedObject', 'namespace'), '') AS obj_namespace,
                          ifNull(JSONExtractString(Body, 'object', 'involvedObject', 'uid'), '')       AS obj_uid,
                          ifNull(JSONExtractString(Body, 'object', 'involvedObject', 'kind'), '')      AS obj_kind,
                          ifNull(JSONExtractString(Body, 'object', 'reason'), '')                      AS reason,
                          ifNull(JSONExtractString(Body, 'object', 'message'), '')                     AS message,
                          ifNull(JSONExtractString(Body, 'object', 'type'), 'Normal')                  AS type,
                          coalesce(
                              nullIf(JSONExtractString(Body, 'object', 'eventTime'), ''),
                              nullIf(JSONExtractString(Body, 'object', 'lastTimestamp'), ''),
                              formatDateTime(toDateTime(Timestamp), '%Y-%m-%dT%H:%i:%SZ', 'UTC')
                          )                                                                             AS eventTime,
                          ifNull(JSONExtractString(Body, 'object', 'source', 'component'), '')         AS source_component
                      FROM otel_logs
                      WHERE ResourceAttributes['telemetry.source'] = 'k8s-events'
                        AND LogAttributes['krateo.io/composition-id'] = {composition_id:String}
                        AND JSONExtractString(Body, 'object', 'reason') != ''
                      ORDER BY Timestamp DESC
                      LIMIT 50
                      FORMAT JSON
                - url: "/ping"
                  handler:
                    type: static
                    status: 200
                    content_type: "text/plain; charset=UTF-8"
                    response_content: "Ok.\n"
                - url: "/replicas_status"
                  handler:
                    type: replicas_status
                - url: "/metrics"
                  handler:
                    type: prometheus
                - url: "/"
                  methods: "GET,POST"
                  handler:
                    type: dynamic_query_handler
                    query_param_name: query
    # STILL INERT (same wrong-path bug): upstream ignores these top-level keys — it renders
    # ONLY cluster.spec. The image is now set for real above at
    # cluster.spec.containerTemplate.image.tag (26.8-alpine); the old inert top-level
    # `image: clickhouse/clickhouse-server:26.3-alpine` placeholder was DELETED because it
    # implied a live version that was never applied. Storage is likewise REAL at 15Gi via
    # cluster.spec.dataVolumeClaimSpec above (retention incident); the 50Gi below remains
    # an inert aspiration — raising the real value later is a plain PVC expansion.
    persistence:
      enabled: true
      size: 50Gi

  otel:
    enabled: true
    resources:
      limits:
        cpu: "1"
        memory: 512Mi
      requests:
        cpu: 100m
        memory: 256Mi

  # Disable ClickStack/HyperDX's bundled OpAMP otel-collector (opentelemetry-collector
  # subchart). It crashlooped (exit 2): the image runs in OpAMP supervisor mode, ignores the
  # chart's --config relay.yaml (debug-only, no ClickHouse exporter), and HyperDX's OpAMP
  # server never pushes a working config. REDUNDANT here -- Krateo's own otel-collector
  # daemonset + the compositionresolver deployment do the real ClickHouse ingestion (with
  # krateo.io/composition-id). HyperDX still reads from ClickHouse, which they populate.
  otel-collector:
    enabled: false

  hyperdx:
    enabled: true
    ingress:
      enabled: false

    # HyperDX's MongoDB credential lives in ONE Secret, mongodb-hyperdx-credentials, which
    # templates/mongodb-hyperdx-credentials.yaml generates once and keeps (0.1.44). Upstream rendered
    # the full URI, with its public default password, into this ConfigMap in plain text, and the same
    # password into clickstack-secret and the MongoDB user's password Secret.
    #
    # MONGO_URI: null deletes upstream's key, so clickstack-config holds no credential at all. HyperDX
    # gets MONGO_URI from the Secret through deployment.env below; env wins over envFrom, but nothing
    # in the ConfigMap is left to win over. The template refuses to render if this key comes back.
    config:
      MONGO_URI: null
    # hyperdx.secrets.MONGODB_PASSWORD is deliberately NOT overridden in 0.1.44: upstream's default stays
    # in krateo-clickstack-mongodb-password and in clickstack-secret's MONGODB_PASSWORD. Nothing live
    # reads it any more (the MongoDB user's passwordSecretRef names mongodb-hyperdx-credentials, and
    # HyperDX's MONGO_URI comes from there), and once this upgrade rotates the user MongoDB refuses it:
    # it is a dead value. It is left alone because MCK watches the Secret the CR references, and Helm
    # updates Secrets before the CR in the same upgrade: changing that Secret now, to empty or anything
    # else, could set that value as the user's password until the CR update lands. The follow-up
    # release empties both once nothing references the old Secret. The template refuses an empty one.

    # The HyperDX app flapped 15 times on krateo-057 (2026-10-11), every one a SIGKILL after a
    # failed liveness probe. The decisive evidence is that the PREVIOUS container's log held only
    # the OpenTelemetry startup banner and nothing after it: it was being killed DURING BOOT, not
    # while wedged.
    #
    # Upstream's liveness budget is initialDelaySeconds 10 + periodSeconds 30 x failureThreshold 3,
    # so the kill lands ~70s after the container starts. Measured boot-to-first-/health-200 on 057:
    # 41.4s. That leaves a margin of ~29s, so a boot 70% slower than nominal is fatal -- which is
    # exactly what a stack roll produces (mongo restarting, image pulls, node contention). It then
    # went quiet once the node was warm, which is why this reads as transient and is not.
    #
    # A startupProbe is the right instrument and we cannot use it: upstream clickstack 3.2.0 does
    # not template one (grepped templates/, not assumed) and we do not patch third-party charts.
    # failureThreshold IS exposed, so it is the knob: 10 moves the kill to 10 + 30x10 = 310s, about
    # 7.5x the measured boot, while still restarting a genuinely wedged process inside ~5 minutes --
    # an acceptable detection delay for an observability UI, and the trade is explicit rather than
    # incidental. readinessProbe is deliberately left at upstream defaults: it already keeps the pod
    # out of the Service until /health answers, and it cannot kill.
    deployment:
      livenessProbe:
        failureThreshold: 10
      # Upstream ships `resources: {}`, so the pod lands in BestEffort QoS and is first to be evicted
      # under node pressure. Requests ONLY, deliberately. Measured steady state is 441Mi / 38m, and
      # the observed failure is a probe-budget failure, not a memory failure: a memory LIMIT would
      # add an OOMKill path that does not exist today, and a CPU limit would throttle precisely the
      # boot path whose slowness caused the flapping in the first place. Requests move it to
      # Burstable and fix scheduling without introducing a new way to die.
      resources:
        requests:
          cpu: 100m
          memory: 512Mi
      # HyperDX's own telemetry goes to the node-local agent, the same way sse-proxy and snowplow send
      # theirs. Upstream's default endpoint names the bundled collector subchart, which this chart
      # disables, so nothing arrived: 0 spans from HyperDX in 7 days on krateo-057.
      #
      # DO NOT REMOVE OTEL_EXPORTER_OTLP_ENDPOINT to turn this off. With no endpoint the SDK defaults
      # to https://in-otel.hyperdx.io, and HYPERDX_API_KEY is set. To stop exporting, set the
      # OTEL_*_EXPORTER variables to none and keep the endpoint.
      #
      # env wins over the envFrom ConfigMap that carries upstream's defaults.
      env:
        # $(HOST_IP) is expanded by the kubelet, so HOST_IP must stay above its first use.
        - name: HOST_IP
          valueFrom:
            fieldRef:
              fieldPath: status.hostIP
        - name: OTEL_EXPORTER_OTLP_ENDPOINT
          value: http://$(HOST_IP):4318
        # The same name its pod logs get, so the alert exclusions cover this telemetry too.
        - name: OTEL_SERVICE_NAME
          value: krateo-observability
        # filelog already collects these logs. Exporting them as well would store every line twice.
        # none also stops the pino transport that HYPERDX_API_KEY enables.
        - name: OTEL_LOGS_EXPORTER
          value: none
        - name: HDX_NODE_CONSOLE_CAPTURE
          value: "false"
        # Unsampled, every request is about 15 spans, against 9k spans a day for the whole platform.
        - name: OTEL_TRACES_SAMPLER
          value: traceidratio
        - name: OTEL_TRACES_SAMPLER_ARG
          value: "0.05"
        # MongoDB, from the generated Secret (see hyperdx.config above). The ConfigMap no longer
        # carries MONGO_URI. The template refuses to render without this entry: a componentValues
        # override of env replaces the whole list, so repeat it there.
        - name: MONGO_URI
          valueFrom:
            secretKeyRef:
              name: mongodb-hyperdx-credentials
              key: uri
      # The pod restart trigger for the MongoDB credential. Upstream templates podAnnotations with
      # toYaml, not tpl, so a checksum of the generated Secret cannot be put here; this number is the
      # equivalent. templates/mongodb-hyperdx-credentials.yaml keeps the Secret's password only while
      # the Secret was made for this same generation. To rotate, raise it by one: that one upgrade
      # generates a new password (the MongoDB operator re-runs SCRAM setup for the user) and rolls
      # HyperDX, whose new pod reads the new URI. Do not rotate by deleting the Secret: a password made
      # that way reaches MongoDB but not the running HyperDX pod.
      podAnnotations:
        krateo.io/mongodb-credential-generation: "1"
      # HyperDX 2.35.0 starts its HTTP server, then connects to MongoDB once (packages/api/src/server.ts).
      # If that connect is refused, it logs "Server start failed" and keeps running, /health still
      # answers 200 and mongoose does not retry an initial connect: a Ready pod with no database. The
      # upstream init container (wait-for-mongodb) only waits for the TCP port, which is open long
      # before a new password is in force. So this one waits until MongoDB accepts the URI itself, with
      # the same driver the app uses (/app/node_modules/mongodb in the HyperDX image, so no extra image
      # pull). On a credential change the old pod keeps serving until the new one passes this. The image
      # must be the app container's image: the template refuses to render otherwise.
      initContainers:
        - name: wait-for-mongodb-auth
          image: docker.hyperdx.io/hyperdx/hyperdx:2.35.0
          imagePullPolicy: IfNotPresent
          workingDir: /app
          command:
            - node
            - -e
            - |
              const { MongoClient } = require('mongodb');
              (async () => {
                for (;;) {
                  const client = new MongoClient(process.env.MONGO_URI, { serverSelectionTimeoutMS: 5000 });
                  try {
                    await client.connect();
                    await client.db().command({ ping: 1 });
                    console.log('MongoDB accepts the hyperdx credentials');
                    await client.close();
                    return;
                  } catch (err) {
                    // The error's name only: never the URI, which holds the password.
                    console.log('waiting for MongoDB to accept the hyperdx credentials: ' + (err.codeName || err.name));
                    await client.close().catch(() => {});
                  }
                  await new Promise((resolve) => setTimeout(resolve, 2000));
                }
              })();
          env:
            - name: MONGO_URI
              valueFrom:
                secretKeyRef:
                  name: mongodb-hyperdx-credentials
                  key: uri
          resources:
            requests:
              cpu: 10m
              memory: 64Mi

  mongodb:
    enabled: true
    persistence:
      size: 10Gi
    # #93: reap the MongoDB PVCs (data + logs) on teardown. The mongodb-community operator
    # passes spec.statefulSet.spec through to its StatefulSet (x-kubernetes-preserve-unknown-fields),
    # so we can set the GA StatefulSet PVC retention policy directly (unlike the ClickHouse operator,
    # which exposes no such field — hence the pvcReaper hook below for CH/Keeper).
    spec:
      statefulSet:
        spec:
          persistentVolumeClaimRetentionPolicy:
            whenDeleted: Delete
            whenScaled: Retain
      # Upstream's one user, repeated whole because a list override replaces the list. The only
      # change is passwordSecretRef: the generated Secret, key `password` (MCK's default key, named
      # explicitly). The operator watches that Secret: when its password changes it computes new
      # SCRAM-SHA-1/256 credentials, stores them in the scram Secret below and pushes the user to the
      # automation agent, which updates it in place without restarting mongod. The template refuses
      # to render if this user stops pointing at the Secret.
      users:
        - name: hyperdx
          db: hyperdx
          passwordSecretRef:
            name: mongodb-hyperdx-credentials
            key: password
          roles:
            - name: dbOwner
              db: hyperdx
            - name: clusterMonitor
              db: admin
          scramCredentialsSecretName: '{{ include "clickstack.mongodb.fullname" . }}-scram'
# NOTE (#93): the ClickHouse/Keeper orphaned-PVC reaper is NOT a chart hook — a composition-chart
# post-delete hook doesn't run reliably (cdc uninstall) and would race the operator's async STS
# teardown. It lives in the installer's ordered-teardown pre-delete path instead (installer >= 0.2.191).
# Only MongoDB's PVC retention (above) is chart-level, because its operator passes spec.statefulSet through.