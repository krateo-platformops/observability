apiVersion: v2
name: krateo-observability
description: >-
  ClickStack (ClickHouse + OTel gateway + HyperDX + MongoDB) for the Krateo
  observability stack, packaged as a Krateo composition. Wraps the upstream
  clickstack chart and folds in the ClickHouse HTTP-handlers ConfigMap, the
  otel-clickhouse credentials Secret, and a HyperDX LoadBalancer Service.
  Replaces obs-stack install.sh phases 1, 2, 2b and 2c (no imperative kubectl).
type: application
# 0.1.3: bump to make the ClickHouse 8Gi/2Gi (image 26.3-alpine, 50Gi) resourcing
# change a REAL, immutable version. 0.1.2 had been mutably overwritten with 8Gi at a
# later repo tag, but consumers (core-provider/helm) cache by version tag and never
# re-pull an unchanged version — so live ClickHouse stayed at the old 1Gi and OOMed
# the sse-proxy /notifications query. A version bump forces the re-pull.
# 0.1.6: move the GET /events?composition_id=<uid> handler from the (inert) clickhouse-http-handlers
# ConfigMap + clickhouse.extraVolumes mount into cluster.spec.settings.extraConfig.http_handlers.
# The mount was never applied (upstream renders only cluster.spec; the clickhouse.com CRD has no
# extraVolumes field; subPath into config.d/ also crashloops on kind) so /events 404'd and the only
# path that worked was the forbidden raw native-SQL/dynamic-query API. New version forces the re-pull.
# 0.1.9: durable retention fix. The 10Gi data volume filled in 8 days (no TTL anywhere: otel_*
# tables unbounded + ClickHouse system log tables unbounded ~3.6GiB) → inserts failed with
# code 243 → the OTel collectors OOM-crash-looped → telemetry dead. Now: dataVolumeClaimSpec
# 15Gi (matches the live relief) + 3-day system-log ttl (query_log/text_log/metric_log/part_log/
# asynchronous_metric_log/trace_log) via settings.extraConfig. Pairs with otel-collector-daemonset
# 0.1.5 + otel-collector-deployment 0.3.3 (clickhouse exporter ttl: 168h on the otel_* tables).
# 0.1.10: bump clickstack dep 3.0.0 → 3.0.2 (HyperDX 2.27.0 → 2.30.1). HyperDX 2.28+ exposes
# /api/v2/external/{alerts,webhooks,dashboards,sources} authenticated via Bearer user.accessKey
# (validateUserAccessKey middleware) — this unlocks replacing the session-cookie reconciler in
# krateo-alert-troubleshooter with native Composition + RESTDefinitions.
# 0.1.11: add krateo-clickstack-api ClusterIP Service (port 8000) so in-cluster clients can reach
# the HyperDX Express backend directly (bypass the Next.js /api-stripping proxy at port 3000).
# Required for Composition RESTDefinitions using Bearer auth against /api/v2/*.
# 0.1.12: bump clickstack dep 3.0.2 → 3.2.0 (HyperDX 2.30.1 → 2.35.0). Additive upstream: 3.1.0
# restored the inline OTel-collector-config hook (global.otelCollector.customConfig), 3.2.0 added
# optional securityContexts + hyperdx.deployment.{deploymentAnnotations,podAnnotations}. No breaking
# values removals, subchart dep (otel-collector ~0.146) unchanged, CRD-free app chart. We set none of
# the newly-deprecated keys (hyperdx.deployment.annotations), so this is a clean pin bump.
# 0.1.14: set cluster.spec.versionProbeTemplate container resources (100m/128Mi request,
# 500m/1Gi limit). The clickhouse.com operator's one-shot version-probe Job has no resources
# of its own and was OOMKilled/stuck Pending on every install, requiring a manual kubectl
# patch of the live ClickHouseCluster CR afterward. Now real out of the box.
# 0.1.15: bump the ClickHouse SERVER image 25.7-alpine (EOL) -> 26.8-alpine (newest LTS).
# Upstream clickstack 3.2.0 defaults cluster.spec.containerTemplate.image to
# {repository: clickhouse/clickhouse-server, tag: 25.7-alpine} — now EOL. We override just
# the tag (repository deep-merges from upstream) so it lands REAL in the ClickHouseCluster CR
# spec the operator reads, and DELETE the old inert top-level clickhouse.image:26.3-alpine
# placeholder (upstream renders only cluster.spec, so that key never applied). This is a
# ClickHouse version upgrade that ROLLS the StatefulSet — bench-validate; do NOT let it ride an
# unrelated installer reconcile (Keeper lockstep, versionProbe Job, http_handlers/TTL re-check
# on 26.8, HyperDX 2.35.0 events-bell smoke-test). Clean re-provision (short-TTL telemetry).
# 0.1.16: HyperDX LoadBalancer now DISABLED BY DEFAULT (hyperdxLoadBalancer.enabled=false).
# HyperDX OSS has only its own email+password login (no external JWT/SSO federation), so a
# public LB exposed an internet-facing app guarded solely by that login on a raw cloud IP,
# outside the platform authn/agentgateway edge. Secure-by-default; opt in explicitly, reach it
# in-cluster (port-forward the ClusterIP), or front it through the agentgateway.
# 0.1.19: the log-scoped default alerts also exclude ServiceName 'krateo-alert-provider', the
# alert-provider's own logs (it quotes incident-comparison verdicts, which can echo alert text).
# 0.1.20: the log-scoped default alerts also exclude ServiceName 'incident-controller', whose own
# "Reconciler error" lines (about Incidents) kept sre-krateo-composition-reconcile-error firing every
# minute; sre-volume-attach-failure skips the incident-check pods' FailedMount events in
# krateo-incident-checks.
# 0.1.21: the HyperDX app's liveness failureThreshold goes 3 -> 10. Upstream's 10 + 30x3 budget
# kills at ~70s and measured boot-to-first-/health-200 on 057 is 41.4s, a ~29s margin that a stack
# roll closes -- 15 SIGKILLs on 2026-10-11, each during boot. A startupProbe is not templated by
# clickstack 3.2.0 and we do not patch upstream, so failureThreshold is the exposed knob. Also sets
# requests (100m / 512Mi) against upstream's empty `resources`, which left the pod in BestEffort;
# no limits, on purpose.
# 0.1.22: bound the ClickHouse SERVER LOG FILES (logger level information, size 100M, count 5).
# Upstream defaults trace/1000M/50 give a 50GB rotation budget on a 15Gi PVC shared with the
# data, and on 057 they held /var/log/clickhouse-server at 3.4G of a 90%-full volume.
# 0.1.23: event alerts skip DELETED watch records, the Event's expiry copy an hour after it.
# 0.1.24: the log-scoped default alerts also exclude ServiceName 'incident-provider', the name
# incident-controller is being renamed to. Both names stay excluded while either can be logging,
# so the 0.1.20 feedback loop (its own "Reconciler error" lines re-firing the alerts) stays closed.
# 0.1.25: metadata only -- `sources` names this repo by its current name, krateo-platformops/observability
# (was the old clickstack-chart, which only redirects). Bumped so the next tag does not overwrite
# 0.1.24 with different metadata: consumers cache by version (see krateo-observability 0.1.3).
# 0.1.26: sre-jwt-in-telemetry also watches k8s-events. Its telemetry.source = '' scope hid that
# stream, the one path without redaction since otel-collector-deployment 0.3.10, so the detector
# could not see a leak there. The comment on severity filters is updated for daemonset 0.1.17.
# 0.1.27: six alert exclusions name the orchestrator `autopilot`, its real ServiceName. They said
# `krateo-autopilot`, which matched 0 of 26.74M rows over 7 days on krateo-057. sre-jwt-in-telemetry
# drops its ServiceName exclusion altogether, because it hid the services most likely to leak a token,
# kagent among them, and this regex cannot match its own query. No default alert's count changes.
# 0.1.28: HyperDX's own traces and metrics go to the node-local agent (G13). The upstream default named
# the disabled collector subchart, so none arrived. Logs stay off OTLP, because filelog has them, and
# traces are sampled at 5%. The endpoint must stay set: without one the SDK defaults to HyperDX's cloud.
# 0.1.29: a comment only (#106), naming alert-provider-crd as the Alert CRD's owner. Nothing
# rendered changes, so 0.1.28 stays pinned. A release refuses a published version whose contents
# differ, even by a comment, so this version has to move.
# 0.1.30 (installer#393): sre-clickhouse-disk-headroom, the first metric alert, fires below 3 GiB
# free on the ClickHouse claim, with its Metric k8s-volume-available. sre-jwt-in-telemetry carries
# observability.krateo.io/analysis: human, so a leak goes to a person without an RCA.
# sre-certificate-expiry-warning ignores composition drift lines, which matched its own name.
# NEEDS alert-provider 0.2.61 and otel-collector-daemonset 0.1.19. With an older alert-provider the
# headroom alert matches no points and fires forever, and the label does nothing.
# 0.1.31 (installer#394): sre-jwt-in-traces, the span half of the JWT detector, reading otel_traces
# with `source: traces`. Labelled analysis: human like the log detector. NEEDS alert-provider 0.2.62:
# an older one refuses the `source` field and the release fails.
# 0.1.32: sre-probe-failing counts only a probe event repeated at least 3 times, so the single
# startup readiness failure of every pod in a roll no longer fires it (17 roll windows in 7 days
# on krateo-057 down to 1, a 2-minute snowplow outage).
# 0.1.33: sre-krateo-composition-reconcile-error ignores "context canceled" and "the object has been
# modified", which controller-runtime retries and which core-provider logs on every roll. Its last
# four firings on krateo-057, all rolls, drop to none; real reconcile errors still match.
# 0.1.34: the six ServiceName exclusions that skip 'autopilot' also skip 'agentiko', the renamed agent
# that runs beside autopilot during the side-by-side cutover. 'autopilot' stays until it is retired.
# 0.1.35: sre-container-not-ready fires when one container stays unready for 5 minutes, naming it;
# sre-probe-failing keeps only liveness and startup probes. NEEDS alert-provider 0.2.64 (groupBy,
# consecutiveWindows) and otel-collector-deployment 0.3.15 (30s readiness, Job pods dropped).
# 0.1.36: every alert carries a one-sentence `description` in place of `message`. NEEDS
# alert-provider-crds with spec.description: an older CRD drops the field.
# 0.1.37: the three safety-critical descriptions carry their instruction again, in the one sentence:
# disk headroom (follow docs/clickhouse-disk-full.md, never drop audit partitions) and the two JWT
# alerts (rotate the token, stop it at source). 0.1.36's one-sentence rewrite had dropped them, and
# the description is what the notification and the RCA read. Interim until alert-provider gains a
# `runbook` field (Diego, 2026-11-09), where the full guidance moves back.
# 0.1.38: sre-credential-header-in-traces (S1) fires on any span or span-event attribute whose key
# names authorization or cookie, the case sre-jwt-in-traces can't see (an opaque token, a cookie).
# Pairs with otel-collector-daemonset 0.1.24, which deletes those keys. Human-only analysis.
# 0.1.39: sre-incident-checks-unknown fires once per incident whose check script stopped giving a
# verdict (incident-provider >= 0.8.0 logs reason=ChecksUnknown in the JSON body); only a person
# moves it on. Human-only analysis. Decision: Diego 2026-11-10, this signal only.
# 0.1.40: alerts take an optional `runbook`, rendered as spec.runbook. NEEDS alert-provider 0.2.69
# (an older CRD drops the field). The disk-headroom and two JWT alerts get one: the full guidance
# 0.1.37 had squeezed into the description moves there, and the descriptions are short again
# (the disk one keeps "never drop audit partitions"). The runbook follows the description in the
# notification and reaches the RCA prompt. The template refuses '{{', an @word and a message over
# HyperDX's 4096 characters.
# 0.1.41: ClickHouse users sse_proxy and snowplow_reader for portal reads, so they stop running as
# `default` (no password, GRANT ALL) once the clients switch (separately). Profiles portal_reader and
# portal_reader_snowplow: readonly=2, cancel-on-close, max_execution_time 8, max_threads 2, per-user
# query cap 16 and 8, with constraints. One per-table SELECT grant statement each, never default.* or
# system.*. The chart generates both credential Secrets and keeps them across upgrades. The new
# containerTemplate.env ROLLS the ClickHouse StatefulSet once. Decision: Diego 2026-11-10.
# 0.1.42: CONTAINS 0.1.41's users (sse_proxy, snowplow_reader; 0.1.41 was held, not rolled) and ADDS
# the rest of the ClickHouse lockdown's users: analyst, mcp_reader, nightly_reader, audit_sealer,
# audit_verifier, otel_writer, hyperdx, slo_rollup. Each has a chart-generated, lookup-kept Secret
# (clickhouse-<user>-credentials: username, password, password_sha256_hex), its hash read with
# @from_env, a profile and ONE per-table GRANT statement (never default.* or system.*; hyperdx's one
# system table is data_skipping_indices). Also clickhouse-default-password and its env variable,
# unused until `default` is closed later as a hot reload. Grants and profiles as tested on kind
# (S0, 2026-11-10). The new containerTemplate.env ROLLS ClickHouse ONCE. NO client is switched, and
# default, app and otelcollector are unchanged. Decision: Diego 2026-11-10.
# 0.1.43: PIN the ClickHouse server image by digest (multi-arch index of 26.8.36.3-alpine, the build
# 057 runs since S1). The floating tag `26.8-alpine` made the S1 restart an unplanned minor upgrade
# (26.8.7.19 -> 26.8.36.3) and left the operator's VersionInSync=False. Same binary, but the pod
# spec changes, so this ROLLS ClickHouse ONCE. It rides the 057 node-pool recreate (Thu 12 Nov
# 07:00Z, Diego 2026-11-11) rather than adding a restart of its own.
# 0.1.44: HyperDX's MongoDB credential moves to a generated Secret and is ROTATED. It was upstream's
# public default, and the whole URI sat in plain text in ConfigMap clickstack-config. Now the chart
# generates mongodb-hyperdx-credentials once (lookup-kept; keys username, password, uri), the
# MongoDBCommunity user's passwordSecretRef names it, and HyperDX gets MONGO_URI from it through
# secretKeyRef. clickstack-config has no MONGO_URI. Upstream's default stays, unreferenced and DEAD
# once the user is rotated (MongoDB refuses it), in krateo-clickstack-mongodb-password and in
# clickstack-secret's MONGODB_PASSWORD. The FOLLOW-UP release empties both, once nothing references the
# old Secret: MCK watches the Secret the CR references and Helm updates Secrets before the CR, so
# emptying it in this release could briefly set an empty password. The first upgrade gives MongoDB
# the new password (the operator re-runs SCRAM setup in place, no mongod restart) and ROLLS HyperDX;
# a new init container holds the new pod until MongoDB accepts the new URI, while the old pod keeps
# serving. Rotate later by raising
# krateo.io/mongodb-credential-generation. The render fails if an override undoes the wiring, or if
# hyperdx.tasks is enabled (the CronJob has no env hook). Decision: Diego 2026-11-11.
# CONTAINS 0.1.43's ClickHouse digest pin, which was held for the Thursday node-pool recreate.
# Rolling this version therefore ALSO ROLLS ClickHouse ONCE (the pin changes its pod spec), when this
# rolls and not on Thursday. Schedule it with that in mind.
version: 0.1.44
appVersion: "3.2.0"
dependencies:
  - name: clickstack
    version: "3.2.0"
    repository: https://clickhouse.github.io/ClickStack-helm-charts
home: https://krateo.io
icon: https://raw.githubusercontent.com/krateo-platformops/.github/main/brand/logo.svg
keywords:
  - krateo
  - platformops
  - clickstack
  - observability
  - clickhouse
  - opentelemetry
annotations:
  krateo.io/category: observability
  krateo.io/maturity: beta
  krateoSupportedVersion: ">= 2.5.1"
sources:
  - https://github.com/krateo-platformops/observability