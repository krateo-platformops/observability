{{- if .Values.clickstack.clickhouse.enabled }}
{{- /*
  Credentials of the chart's ClickHouse users, defined in
  clickstack.clickhouse.cluster.spec.settings.extraUsersConfig. One Secret per user, in this
  release's namespace, with three keys:
    username             the ClickHouse user name
    password             what the client sends
    password_sha256_hex  what ClickHouse checks, read through the containerTemplate.env entry
                         that names this Secret
  The password is generated once and kept: an existing Secret's password is reused (lookup), so
  a reconcile renders the same object and changes nothing. `data` with b64enc, not stringData,
  so the rendered object matches the stored one (the portal chart's admin-password pattern).
  helm template has no cluster, so its output carries a fresh password each time; only an
  install or upgrade against a cluster keeps the live one.

  0.1.41: sse_proxy, snowplow_reader. 0.1.42: the lockdown users, plus clickhouse-default-password,
  whose hash nothing reads yet (`default` stays no_password until the lockdown's last step; the
  env variable ships now so that step is a hot reload). otel_writer has its own Secret:
  otel-clickhouse-credentials keeps otelcollector's password until the collectors move.
  0.1.47: usage_collector, for the CMP team's cmp-usage-collector.
  0.1.59: chops, the disk-full runbook's operator, until then an inline hash in componentValues.
  0.1.57: clickhouse-portal-endpoint, snowplow_reader's login as a snowplow endpointRef Secret
  (server-url, username, password). It carries the same password as the user's own Secret, in the
  same render, so the two cannot differ.

  Each Secret is read by its own user's variable and by no other: the guard below fails the render
  if an entry names another user's Secret (krateo-slo-rollup 0.1.1 once defaulted to the collector
  writer's Secret, and nothing caught it).
*/}}
{{- $users := list
      (dict "user" "sse_proxy"       "secret" "clickhouse-sse-proxy-credentials"       "env" "CLICKHOUSE_USER_SSE_PROXY_SHA256")
      (dict "user" "snowplow_reader" "secret" "clickhouse-snowplow-reader-credentials" "env" "CLICKHOUSE_USER_SNOWPLOW_READER_SHA256")
      (dict "user" "analyst"         "secret" "clickhouse-analyst-credentials"         "env" "CLICKHOUSE_USER_ANALYST_SHA256")
      (dict "user" "mcp_reader"      "secret" "clickhouse-mcp-reader-credentials"      "env" "CLICKHOUSE_USER_MCP_READER_SHA256")
      (dict "user" "nightly_reader"  "secret" "clickhouse-nightly-reader-credentials"  "env" "CLICKHOUSE_USER_NIGHTLY_READER_SHA256")
      (dict "user" "audit_sealer"    "secret" "clickhouse-audit-sealer-credentials"    "env" "CLICKHOUSE_USER_AUDIT_SEALER_SHA256")
      (dict "user" "audit_verifier"  "secret" "clickhouse-audit-verifier-credentials"  "env" "CLICKHOUSE_USER_AUDIT_VERIFIER_SHA256")
      (dict "user" "otel_writer"     "secret" "clickhouse-otel-writer-credentials"     "env" "CLICKHOUSE_USER_OTEL_WRITER_SHA256")
      (dict "user" "hyperdx"         "secret" "clickhouse-hyperdx-credentials"         "env" "CLICKHOUSE_USER_HYPERDX_SHA256")
      (dict "user" "slo_rollup"      "secret" "clickhouse-slo-rollup-credentials"      "env" "CLICKHOUSE_USER_SLO_ROLLUP_SHA256")
      (dict "user" "usage_collector" "secret" "clickhouse-usage-collector-credentials" "env" "CLICKHOUSE_USER_USAGE_COLLECTOR_SHA256")
      (dict "user" "chops"           "secret" "clickhouse-chops-credentials"           "env" "CLICKHOUSE_USER_CHOPS_SHA256")
      (dict "user" "default"         "secret" "clickhouse-default-password"            "env" "CLICKHOUSE_USER_DEFAULT_SHA256") }}
{{- $spec := .Values.clickstack.clickhouse.cluster.spec }}
{{- $env := list }}
{{- if and $spec $spec.containerTemplate $spec.containerTemplate.env }}
{{- $env = $spec.containerTemplate.env }}
{{- end }}
{{- $chUsers := dict }}
{{- if and $spec $spec.settings $spec.settings.extraUsersConfig $spec.settings.extraUsersConfig.users }}
{{- $chUsers = $spec.settings.extraUsersConfig.users }}
{{- end }}
{{- range $r := $users }}
{{- /* A componentValues override that puts a hash inline replaces the @from_env map, and the user
       then logs in with that hash and not this Secret's: the credential sits in the Installer CR
       again, and nothing says so. Refuse it. `default` has no users entry yet (see values). */}}
{{- $u := index $chUsers $r.user }}
{{- if and $u (hasKey $u "password_sha256_hex") }}
{{- $h := index $u "password_sha256_hex" }}
{{- if not (and (kindIs "map" $h) (eq (toString (index $h "@from_env")) $r.env)) }}
{{- fail (printf "clickstack.clickhouse.cluster.spec.settings.extraUsersConfig.users.%s.password_sha256_hex must be {\"@from_env\": %s}: the chart keeps that user's password in Secret %s. Remove the inline value from componentValues." $r.user $r.env $r.secret) }}
{{- end }}
{{- end }}
{{- $wired := false }}
{{- range $e := $env }}
{{- if and (eq (toString $e.name) $r.env) $e.valueFrom $e.valueFrom.secretKeyRef (eq (toString $e.valueFrom.secretKeyRef.name) $r.secret) (eq (toString $e.valueFrom.secretKeyRef.key) "password_sha256_hex") }}
{{- $wired = true }}
{{- end }}
{{- if and (ne (toString $e.name) $r.env) $e.valueFrom $e.valueFrom.secretKeyRef (eq (toString $e.valueFrom.secretKeyRef.name) $r.secret) }}
{{- fail (printf "clickstack.clickhouse.cluster.spec.containerTemplate.env entry %s reads Secret %s, which belongs to ClickHouse user %s (variable %s): each user's variable reads its own Secret, and no other variable reads it." (toString $e.name) $r.secret $r.user $r.env) }}
{{- end }}
{{- end }}
{{- if not $wired }}
{{- fail (printf "clickstack.clickhouse.cluster.spec.containerTemplate.env must contain %s from secretKeyRef %s/password_sha256_hex: ClickHouse user %s reads its password hash from it. A componentValues override of containerTemplate.env replaces the whole list, so repeat the chart's entries in it." $r.env $r.secret $r.user) }}
{{- end }}
{{- $existing := lookup "v1" "Secret" $.Release.Namespace $r.secret }}
{{- $password := "" }}
{{- if and $existing $existing.data (index $existing.data "password") }}
{{- $password = index $existing.data "password" | b64dec }}
{{- else }}
{{- $password = randAlphaNum 32 }}
{{- end }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $r.secret }}
  labels:
    app.kubernetes.io/managed-by: {{ $.Release.Service }}
    app.kubernetes.io/component: observability
    app.kubernetes.io/part-of: krateo-observability-stack
type: Opaque
data:
  username: {{ $r.user | b64enc | quote }}
  password: {{ $password | b64enc | quote }}
  password_sha256_hex: {{ $password | sha256sum | b64enc | quote }}
{{- if eq $r.user "snowplow_reader" }}
---
apiVersion: v1
kind: Secret
metadata:
  name: clickhouse-portal-endpoint
  labels:
    app.kubernetes.io/managed-by: {{ $.Release.Service }}
    app.kubernetes.io/component: observability
    app.kubernetes.io/part-of: krateo-observability-stack
type: Opaque
data:
  server-url: {{ printf "http://%s-clickhouse-headless.%s.svc:8123" (include "clickstack.clickhouse.fullname" (dict "Values" $.Values.clickstack "Chart" (dict "Name" "clickstack") "Release" $.Release)) $.Release.Namespace | b64enc | quote }}
  username: {{ $r.user | b64enc | quote }}
  password: {{ $password | b64enc | quote }}
{{- end }}
{{- end }}
{{- end }}
