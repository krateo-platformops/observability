{{- if .Values.clickstack.clickhouse.enabled }}
{{- /*
  Credentials of the ClickHouse portal reader users (sse_proxy, snowplow_reader), defined in
  clickstack.clickhouse.cluster.spec.settings.extraUsersConfig. One Secret per user, in this
  release's namespace, with three keys:
    username             the ClickHouse user name
    password             what the client sends
    password_sha256_hex  what ClickHouse checks, read through the containerTemplate.env entry
                         that names this Secret
  The password is generated once and kept: an existing Secret's password is reused (lookup), so
  a reconcile renders the same object and changes nothing. `data` with b64enc, not stringData,
  so the rendered object matches the stored one (the portal chart's admin-password pattern).
  helm template has no cluster, so its output carries a fresh password each time; only an
  install or upgrade against a cluster keeps the live one.
*/}}
{{- $readers := list
      (dict "user" "sse_proxy"       "secret" "clickhouse-sse-proxy-credentials"       "env" "CLICKHOUSE_USER_SSE_PROXY_SHA256")
      (dict "user" "snowplow_reader" "secret" "clickhouse-snowplow-reader-credentials" "env" "CLICKHOUSE_USER_SNOWPLOW_READER_SHA256") }}
{{- $spec := .Values.clickstack.clickhouse.cluster.spec }}
{{- $env := list }}
{{- if and $spec $spec.containerTemplate $spec.containerTemplate.env }}
{{- $env = $spec.containerTemplate.env }}
{{- end }}
{{- range $r := $readers }}
{{- $wired := false }}
{{- range $e := $env }}
{{- if and (eq (toString $e.name) $r.env) $e.valueFrom $e.valueFrom.secretKeyRef (eq (toString $e.valueFrom.secretKeyRef.name) $r.secret) (eq (toString $e.valueFrom.secretKeyRef.key) "password_sha256_hex") }}
{{- $wired = true }}
{{- end }}
{{- end }}
{{- if not $wired }}
{{- fail (printf "clickstack.clickhouse.cluster.spec.containerTemplate.env must contain %s from secretKeyRef %s/password_sha256_hex: ClickHouse user %s reads its password hash from it. A componentValues override of containerTemplate.env replaces the whole list, so repeat the chart's entries in it." $r.env $r.secret $r.user) }}
{{- end }}
{{- $existing := lookup "v1" "Secret" $.Release.Namespace $r.secret }}
{{- $password := "" }}
{{- if and $existing $existing.data (index $existing.data "password") }}
{{- $password = index $existing.data "password" | b64dec }}
{{- else }}
{{- $password = randAlphaNum 32 }}
{{- end }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $r.secret }}
  labels:
    app.kubernetes.io/managed-by: {{ $.Release.Service }}
    app.kubernetes.io/component: observability
    app.kubernetes.io/part-of: krateo-observability-stack
type: Opaque
data:
  username: {{ $r.user | b64enc | quote }}
  password: {{ $password | b64enc | quote }}
  password_sha256_hex: {{ $password | sha256sum | b64enc | quote }}
{{- end }}
{{- end }}
