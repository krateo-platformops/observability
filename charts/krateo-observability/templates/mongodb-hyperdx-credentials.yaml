{{- if .Values.clickstack.mongodb.enabled }}
{{- /*
  HyperDX's MongoDB credential (0.1.44). One Secret, mongodb-hyperdx-credentials, in this release's
  namespace, with three keys:
    username  the MongoDB user, hyperdx
    password  what the MongoDBCommunity user's passwordSecretRef reads (MCK's key name)
    uri       the full MONGO_URI HyperDX gets through secretKeyRef, built here from the same
              password so that no consumer assembles it. Same host, port, database and authSource
              as upstream's ConfigMap entry: the MCK Service name comes from upstream's own helper.
  Upstream put that URI, with its public default password, in the clickstack-config ConfigMap.
  values.yaml now deletes it there (hyperdx.config.MONGO_URI: null), empties
  hyperdx.secrets.MONGODB_PASSWORD, and points the MongoDB user and HyperDX at this Secret.

  The password is generated once and kept, the same way templates/clickhouse-user-credentials.yaml
  keeps the ClickHouse users' passwords: an existing Secret's password is reused (lookup), so a
  reconcile renders the same object and changes nothing. `data` with b64enc, not stringData, so
  the rendered object matches the stored one. helm template has no cluster, so its output carries
  a fresh password each time; only an install or upgrade against a cluster keeps the live one.
  randAlphaNum is URI-safe, so the password goes into `uri` without escaping.

  One addition to that pattern, because a Secret change does not restart a pod: the password is
  kept only while the Secret was made for the generation in
  hyperdx.deployment.podAnnotations["krateo.io/mongodb-credential-generation"]. Raising that number
  is how to rotate: the same upgrade makes a new password here and changes HyperDX's pod template,
  so the new pod starts with the new URI (upstream renders podAnnotations with toYaml, not tpl, so a
  checksum of this Secret cannot be put there). The check-alerts CronJob would need nothing of the
  kind, each Job's pod reads the Secret when it starts, but it has no env hook at all (see below).

  The render fails when a componentValues override undoes the wiring, because each of these
  replaces a list or map entry whole and would silently bring back the default credential, or
  leave HyperDX without one.
*/}}
{{- $name := "mongodb-hyperdx-credentials" }}
{{- $user := "hyperdx" }}
{{- $db := "hyperdx" }}
{{- $hx := .Values.clickstack.hyperdx }}
{{- $genKey := "krateo.io/mongodb-credential-generation" }}
{{- $generation := index (default (dict) $hx.deployment.podAnnotations) $genKey | default "" | toString }}
{{- if not $generation }}
{{- fail (printf "clickstack.hyperdx.deployment.podAnnotations must carry %s: it is what restarts HyperDX when %s's password changes." $genKey $name) }}
{{- end }}
{{- if hasKey (default (dict) $hx.config) "MONGO_URI" }}
{{- fail (printf "clickstack.hyperdx.config.MONGO_URI must stay null: it renders into the clickstack-config ConfigMap in plain text. HyperDX reads MONGO_URI from Secret %s." $name) }}
{{- end }}
{{- if (default (dict) $hx.secrets).MONGODB_PASSWORD }}
{{- fail (printf "clickstack.hyperdx.secrets.MONGODB_PASSWORD must stay empty: upstream copies it into clickstack-secret and krateo-clickstack-mongodb-password, and the MongoDB user's password comes from Secret %s." $name) }}
{{- end }}
{{- if $hx.tasks.enabled }}
{{- fail (printf "clickstack.hyperdx.tasks.enabled must stay false: upstream clickstack 3.2.0's check-alerts CronJob takes its environment only from clickstack-config and clickstack-secret, with no env hook, so it cannot get MONGO_URI from Secret %s. HyperDX runs check-alerts in-process (RUN_SCHEDULED_TASKS_EXTERNALLY=false)." $name) }}
{{- end }}
{{- $wired := false }}
{{- range $e := (default (list) $hx.deployment.env) }}
{{- if and (eq (toString $e.name) "MONGO_URI") $e.valueFrom $e.valueFrom.secretKeyRef (eq (toString $e.valueFrom.secretKeyRef.name) $name) (eq (toString $e.valueFrom.secretKeyRef.key) "uri") }}
{{- $wired = true }}
{{- end }}
{{- end }}
{{- if not $wired }}
{{- fail (printf "clickstack.hyperdx.deployment.env must contain MONGO_URI from secretKeyRef %s/uri: HyperDX has no other MongoDB URI. A componentValues override of env replaces the whole list, so repeat the chart's entries in it." $name) }}
{{- end }}
{{- $waits := false }}
{{- range $c := (default (list) $hx.deployment.initContainers) }}
{{- if eq (toString $c.name) "wait-for-mongodb-auth" }}
{{- range $e := (default (list) $c.env) }}
{{- if and (eq (toString $e.name) "MONGO_URI") $e.valueFrom $e.valueFrom.secretKeyRef (eq (toString $e.valueFrom.secretKeyRef.name) $name) (eq (toString $e.valueFrom.secretKeyRef.key) "uri") }}
{{- $waits = true }}
{{- end }}
{{- end }}
{{- end }}
{{- end }}
{{- if not $waits }}
{{- fail (printf "clickstack.hyperdx.deployment.initContainers must contain wait-for-mongodb-auth with MONGO_URI from secretKeyRef %s/uri: without it a HyperDX pod that starts before MongoDB has the password stays Ready with no database. A componentValues override of initContainers replaces the whole list." $name) }}
{{- end }}
{{- $userOk := false }}
{{- range $u := (default (list) .Values.clickstack.mongodb.spec.users) }}
{{- if eq (toString $u.name) $user }}
{{- if and (eq (toString $u.db) $db) $u.passwordSecretRef (eq (toString $u.passwordSecretRef.name) $name) (eq (toString $u.passwordSecretRef.key) "password") }}
{{- $userOk = true }}
{{- end }}
{{- end }}
{{- end }}
{{- if not $userOk }}
{{- fail (printf "clickstack.mongodb.spec.users must contain %s (db %s) with passwordSecretRef {name: %s, key: password}: otherwise MongoDB keeps upstream's password Secret. A componentValues override of users replaces the whole list." $user $db $name) }}
{{- end }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
{{- $password := "" }}
{{- if and $existing $existing.data (index $existing.data "password") (eq (toString (index (default (dict) $existing.metadata.annotations) $genKey)) $generation) }}
{{- $password = index $existing.data "password" | b64dec }}
{{- else }}
{{- $password = randAlphaNum 32 }}
{{- end }}
{{- $svc := include "clickstack.mongodb.svc" (dict "Values" .Values.clickstack "Chart" (dict "Name" "clickstack") "Release" .Release) }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  annotations:
    {{ $genKey }}: {{ $generation | quote }}
  labels:
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    app.kubernetes.io/component: observability
    app.kubernetes.io/part-of: krateo-observability-stack
type: Opaque
data:
  username: {{ $user | b64enc | quote }}
  password: {{ $password | b64enc | quote }}
  uri: {{ printf "mongodb://%s:%s@%s:27017/%s?authSource=%s" $user $password $svc $db $db | b64enc | quote }}
{{- end }}
