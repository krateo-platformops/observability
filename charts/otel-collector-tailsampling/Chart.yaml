apiVersion: v2
name: otel-collector-tailsampling
description: >-
  Trace tail-sampling tier for Krateo. The node collectors route every span by TraceId to this
  collector, which waits for each trace to finish and keeps it only if it matters: any error, any
  HTTP status of 400 or more, any span outside the portal path, any JWT-shaped value, or a 5% sample
  of the rest. Exports the kept traces to ClickHouse otel_traces. Wraps the upstream
  opentelemetry-collector chart (installer#402; design in observability#118).
type: application
# 0.1.0: first release. It ships idle: nothing sends to it until otel-collector-daemonset's traces
# pipeline is switched to its loadbalancing exporter (observability#118, step 2).
# 0.1.1: this tier creates otel_traces (create_schema: true, ttl: 168h, as the daemonset did).
# After step 2 the daemonset's ClickHouse exporter no longer serves traces, and the exporter
# creates a signal's tables only when that signal's exporter starts, so without this a fresh
# install would have no otel_traces. Pin 0.1.1, not 0.1.0.
# 0.1.2: krateo-frontend joins the portal path, so browser-originated portal traces are sampled
# at 5% like the rest instead of being kept whole (installer#405; browser spans arrive through
# snowplow's rum-ingest). OTTL paths now carry their context prefix (span., spanevent.), which
# the collector otherwise rewrote at startup with an info note; the conditions are unchanged.
# 0.1.7: git-provider, incident-provider and core-provider join the sampled services (Diego,
# 2026-11-10): provider-runtime v1.14.0 traces every reconcile, so their routine loops are sampled
# at 5% before any chart turns tracing on; errors stay whole. core-provider's existing per-pass
# compositiondefinition.observe traces (31K a day on krateo-057) are sampled from here on.
# 0.1.8: comments only: alert-provider 0.2.71 (provider-runtime tracing) replaces alert.observe /
# alert.reconcile with the runtime's reconcile/connect/observe/update/delete. The policies key on the
# service and on ^incident\. span names, so they are unchanged; the policy test models the new tree.
# 0.1.9: krateo-observability (the HyperDX server) joins the sampled services (Diego, 2026-11-10):
# its spans ride in alert-provider's traces through the API calls, and as an unsampled service they
# kept about half of alert-provider's routine traces whole (about 11% stored instead of 5%).
# 0.1.10: HTTP 499 (client closed request) no longer keeps a trace under http-status-400-or-more.
# sse-proxy 1.5.0 answers 499 when its caller leaves; the caller's own error keeps the trace if it
# failed (Diego, 2026-11-10: caller cancels are not server errors).
# 0.1.11: keep every alert-provider reconcile that ACTED (provider_runtime.acted=true on the root;
# Diego, 2026-11-11, for provider-runtime#74). Routine alert-provider traces stay at 5%; an acting
# pass's root is kept whole so its act span's link resolves. Inert until plumbing's
# tracecontext.AttrActed ships through provider-runtime into alert-provider.
# 0.1.12: the acted keep rule covers every provider sampled at 5% (Diego, 2026-11-11): krateo-alert-
# provider, core-provider, git-provider, incident-provider, by the service.name each chart sets
# (provider-runtime design-tracing.md section 8). Renamed provider-acted. Still inert until each
# provider's runtime emits provider_runtime.acted.
# 0.1.13: keep rule snowplow-shared-upstream: a trace whose snowplow upstream CLIENT span carries
# snowplow.upstream.joiners > 0 (a wire request that answered other concurrent readers, snowplow #1322)
# is kept whole, so the joiners' span links resolve instead of only for the 5% sample. Matches nothing
# until snowplow ships #1322. tests/tailsampling-docker.py.
# 0.1.14: comments only: neutral wording in comments (no internal ids or private repo
# references); no rendered object changes.
# 0.1.15: comments and the chart description only: neutral wording (no
# internal work-item or plan ids); no rendered object changes.
# 0.1.16: the chart renders the collector's ConfigMap itself (templates/configmap.yaml) and the
# upstream subchart mounts it (configMap.create false + configMap.existingName). values.yaml used
# to drop upstream's default jaeger, prometheus and zipkin receivers, otlp's http protocol and its
# logs and metrics pipelines with null; Helm 4.2 and later drop a parent chart's nulls before the
# subchart's defaults merge in (upstream Helm change 31979), so under Helm 4 they came back. The
# template now leaves each out while it holds upstream's default; no null is left in values.yaml
# (ports.otlp.hostPort: null is gone too: upstream writes a hostPort only in daemonset mode). Under
# Helm 3 the render is the same object for object, ConfigMap name, labels and checksum/config value
# included, so pods do not restart; Helm 4 renders the same. tests/collector-helm4-render.py.
# 0.1.17: an upstream default receiver a pipeline names is kept. templates/_collector-config.tpl
# left out upstream's jaeger, prometheus and zipkin receivers whenever they held upstream's default,
# so a pipeline that named one (say zipkin, with its config left alone) pointed at an undeclared
# receiver and the collector would refuse to start. A whole receiver is now left out only while it
# equals upstream's default AND no pipeline names it (an extension: while service.extensions does
# not name it). The default render is the same byte for byte, checksum/config included, so pods
# do not restart.
# 0.1.18: keep rule credentialuse-degraded (Diego, 2026-11-22, provider-runtime#125): a trace whose
# `credentialuse.acquire` span event has provider_runtime.credentialuse.outcome = degraded is kept
# whole. A degraded pass ends OK, so no other rule keeps it. must_not_connect errors (kept by
# error-status); conflict and ok stay sampled. Matches nothing until a provider enables credential-use.
# tests/tailsampling-docker.py.
version: 0.1.18
# The collector this chart renders: the upstream chart's own appVersion picks the image tag.
# Keep equal to otel-collector-daemonset's appVersion, so both tiers run the same build.
appVersion: "0.158.0"
dependencies:
  - name: opentelemetry-collector
    version: 0.170.0
    repository: https://open-telemetry.github.io/opentelemetry-helm-charts
home: https://krateo.io
icon: https://raw.githubusercontent.com/krateo-platformops/.github/main/brand/logo.svg
keywords:
  - krateo
  - platformops
  - opentelemetry
  - observability
  - tracing
sources:
  - https://github.com/krateo-platformops/observability
annotations:
  krateo.io/display-name: OTel Trace Tail Sampler
