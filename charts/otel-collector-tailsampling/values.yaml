# otel-collector-tailsampling: the tier that decides, per FINISHED trace, whether it is stored.
#
# Why here and not at the gateway (installer#402, observability#118): agentgateway v1.5.0 decides
# sampling when a request ARRIVES (log.rs, Executor::new_request), before any response exists, so
# "always keep errors" cannot be a gateway rule. Only a decision taken after the trace has finished
# can keep every error trace complete. So the platform gateway and snowplow record everything, and
# this tier keeps what matters.
#
# Topology: every node's otel-collector-daemonset exports traces with a `loadbalancing` exporter
# keyed on TraceId to this chart's HEADLESS Service, so all spans of one trace reach the same
# replica whichever node they came from. Tail sampling is only correct under that routing.
#
# What this tier does NOT touch: the SLIs. The daemonset's `traces/slo` pipeline turns every snowplow
# server span into traces.span.metrics.* on the node, before anything is sampled, and
# krateo-slo-rollup reads only those metrics. Availability and p95 count every request.
opentelemetry-collector:
  mode: deployment
  # Keep the upstream chart's legacy component names (as both sibling charts do), so this config
  # reads the same as theirs.
  rewriteDeprecatedComponentNames: false
  # One replica is enough on krateo-057 (a few spans a second). More replicas are safe at any time:
  # the daemonset's loadbalancing exporter resolves the headless Service and re-routes by TraceId.
  replicaCount: 1
  image:
    repository: otel/opentelemetry-collector-contrib
  command:
    name: otelcol-contrib
  # HEADLESS: the loadbalancing exporter's DNS resolver needs one A record per replica, which a
  # ClusterIP Service would hide behind a single virtual IP.
  service:
    enabled: true
    type: ClusterIP
    clusterIP: None
  # OTLP/gRPC only. The daemonset is the only sender, and it speaks gRPC.
  ports:
    otlp:
      enabled: true
      hostPort: null
    otlp-http:
      enabled: false
    jaeger-compact:
      enabled: false
    jaeger-thrift:
      enabled: false
    jaeger-grpc:
      enabled: false
    zipkin:
      enabled: false
  presets:
    kubernetesAttributes:
      enabled: false
  # Same credentials Secret as the two sibling collectors.
  extraEnvs:
    - name: CH_USERNAME
      valueFrom:
        secretKeyRef:
          name: otel-clickhouse-credentials
          key: username
    - name: CH_PASSWORD
      valueFrom:
        secretKeyRef:
          name: otel-clickhouse-credentials
          key: password
  # tail_sampling holds every trace in memory for decision_wait. Sized for krateo-057 (about
  # 0.1-0.2 portal requests a second; num_traces below bounds the worst case). Re-size from
  # snowplow's production-scale bench with tracing on (about 250 req/s) before any large install.
  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 50m
      memory: 128Mi
  livenessProbe:
    timeoutSeconds: 5
    failureThreshold: 6
  readinessProbe:
    timeoutSeconds: 5
    failureThreshold: 3
  config:
    receivers:
      jaeger: null
      zipkin: null
      prometheus: null
      otlp:
        protocols:
          grpc:
            endpoint: ${env:MY_POD_IP}:4317
          http: null
    processors:
      memory_limiter:
        check_interval: 5s
        limit_percentage: 80
        spike_limit_percentage: 25
      tail_sampling:
        # How long after a trace's FIRST span the decision is taken. The portal path's spans
        # (gateway, snowplow, api-steps) all end within a request, so 30s covers slow requests with
        # margin.
        decision_wait: 30s
        # Upper bound on traces held in memory at once; the oldest are decided early beyond it.
        num_traces: 50000
        expected_new_traces_per_sec: 50
        # LATE SPANS. A span arriving after its trace was decided follows that decision instead of
        # starting a new trace. Needed for snowplow's GET /refreshes (SSE), whose server span ends
        # only when the stream closes, minutes to hours later.
        decision_cache:
          sampled_cache_size: 100000
          non_sampled_cache_size: 100000
        # OR'ed: a trace is kept if ANY policy keeps it.
        policies:
          # 5xx, panics, and snowplow's named-endpoint client spans on 4xx/5xx.
          - name: error-status
            type: status_code
            status_code:
              status_codes: [ERROR]
          # 4xx as well. Read from the attribute, never from span status: a 4xx SERVER span is
          # Unset by semconv. snowplow uses stable semconv (http.response.status_code); the gateway
          # uses http.status.
          - name: http-status-400-or-more
            type: ottl_condition
            ottl_condition:
              error_mode: ignore
              span:
                - 'Int(span.attributes["http.response.status_code"]) >= 400'
                - 'Int(span.attributes["http.status"]) >= 400'
          # Scope: only the SAMPLED SERVICES are sampled: the portal path, and alert-provider's routine
          # reconcile loop. A trace with any span from another service is kept whole, so composition-dynamic-controller reconcile traces (the obs-reconcile-* and
          # composition-reconcile-perf widgets) and agent-gateway LLM traces (agents-token-*) keep
          # what they have today. The portal path is the browser (krateo-frontend: its spans reach
          # the collectors through snowplow's rum-ingest), the platform gateway, snowplow and
          # sse-proxy (the portal's /events and /notifications streams). A portal service left out
          # here makes every trace through it match and be kept at 100%, which defeats the sample:
          # krateo-frontend (installer#405) and sse-proxy, whose 5-18K streams a day each gained
          # two gateway spans once the platform gateway traced every request.
          # krateo-alert-provider (Diego, 2026-11-09): its native tracing (0.2.66) puts a trace with
          # HyperDX API calls on every pass of every Alert (alert.observe/alert.reconcile until 0.2.70;
          # from 0.2.71, provider-runtime's `reconcile` root with connect/observe/update/delete),
          # about 316K spans a day on krateo-057, 2.3x the whole cluster's 139K the day before. That
          # routine loop is sampled; its errors (HyperDX 429s, failed reconciles) are kept by the two
          # rules above, and incident analysis by alert-provider-incident below.
          # git-provider, incident-provider, core-provider (Diego, 2026-11-10): provider-runtime
          # v1.14.0 traces every reconcile under these OTEL_SERVICE_NAMEs (provider-runtime#60), so
          # each provider's routine loop is sampled before its chart turns tracing on. core-provider
          # already sent a single-span compositiondefinition.observe trace on every pass (31,478 a
          # day on krateo-057, 0 errors, read by no widget or alert) and is sampled from here on.
          # Their errors stay whole under the two rules above. composition-dynamic-controller is
          # NOT here: the reconcile widgets read its traces.
          # krateo-observability is the HyperDX server's own service.name (Diego, 2026-11-10).
          # alert-provider's HyperDX API calls carry trace context, so HyperDX's server spans
          # (express middleware, mongodb.find) join alert-provider's trace; left out, they kept 82
          # of 171 alert-provider reconcile traces whole on krateo-057 in one hour (about 11%, not
          # 5%). Essentially all of HyperDX's traces are those calls. Its errors and HTTP >= 400
          # stay whole under the two rules above.
          - name: outside-sampled-services
            type: ottl_condition
            ottl_condition:
              error_mode: ignore
              span:
                - >-
                  resource.attributes["service.name"] != "krateo-agent-gateway-platform"
                  and resource.attributes["service.name"] != "snowplow"
                  and resource.attributes["service.name"] != "krateo-frontend"
                  and resource.attributes["service.name"] != "sse-proxy"
                  and resource.attributes["service.name"] != "krateo-alert-provider"
                  and resource.attributes["service.name"] != "git-provider"
                  and resource.attributes["service.name"] != "incident-provider"
                  and resource.attributes["service.name"] != "core-provider"
                  and resource.attributes["service.name"] != "krateo-observability"
          # The sre-jwt-in-traces detector's own pattern, over the same four places it reads, so
          # sampling never hides a leaked token from it.
          - name: jwt-shaped-value
            type: ottl_condition
            ottl_condition:
              error_mode: ignore
              span:
                - 'IsMatch(ToKeyValueString(span.attributes), "eyJ[A-Za-z0-9._-]{20,}")'
                - 'IsMatch(span.status.message, "eyJ[A-Za-z0-9._-]{20,}")'
                - 'IsMatch(ToKeyValueString(resource.attributes), "eyJ[A-Za-z0-9._-]{20,}")'
              spanevent:
                - 'IsMatch(ToKeyValueString(spanevent.attributes), "eyJ[A-Za-z0-9._-]{20,}")'
          # A snowplow resolve whose stages failed while the response still succeeded (snowplow#1264,
          # #1278): snowplow puts snowplow.stages.failed (int) on its Server span and leaves the
          # status Unset, so neither rule above keeps it. Absent (no stage outcomes) or 0 doesn't
          # match: Int() of a missing attribute is nil, which error_mode: ignore treats as no match.
          # Widget responses don't carry stage outcomes yet (snowplow#1279).
          - name: snowplow-stage-failure
            type: ottl_condition
            ottl_condition:
              error_mode: ignore
              span:
                - 'Int(span.attributes["snowplow.stages.failed"]) > 0'
          # An alert-provider incident: incident.fire is the root of an RCA trace (with a span link to
          # the observe that fired it: alert.observe until 0.2.70, the runtime's observe from 0.2.71),
          # and incident.compare / incident.analyze carry the model
          # and A2A calls. Kept whole by name, so an analysis never depends on whether a gateway or
          # agent span happened to land in the same trace.
          - name: alert-provider-incident
            type: ottl_condition
            ottl_condition:
              error_mode: ignore
              span:
                - 'IsMatch(span.name, "^incident\\.")'
          # An audited write (AUDIT-9, installer#415; Diego): the shared krateo-platformops/audit library
          # (v0.4.0, used by snowplow and rest-dynamic-controller) sets krateo.audit.recorded=true on the
          # request's Server span once the audit record is handed to the log pipeline. Keeping those
          # traces whole lets an audit row's TraceId resolve in otel_traces (7-day TTL), instead of only
          # for the 5% sample. Absent until a release carries audit v0.4.0, so the rule matches nothing.
          - name: audited-write
            type: ottl_condition
            ottl_condition:
              error_mode: ignore
              span:
                - 'span.attributes["krateo.audit.recorded"] == true'
          # Everything else from the sampled services: a fixed 5%, hashed on TraceId so every replica
          # agrees. Diego, 2026-10-24 (installer#402); alert-provider added 2026-11-09.
          - name: sample-5pct
            type: probabilistic
            probabilistic:
              sampling_percentage: 5
      batch: {}
    exporters:
      clickhouse:
        endpoint: "tcp://krateo-clickstack-clickhouse-clickhouse-headless.krateo-system.svc:9000"
        username: "${env:CH_USERNAME}"
        password: "${env:CH_PASSWORD}"
        database: default
        traces_table_name: otel_traces
        # THIS tier owns otel_traces once the daemonset routes traces here (observability#118,
        # step 2). The exporter creates a signal's tables only when that signal's exporter starts
        # (contrib v0.158.0 exporter_traces.go:49-54), so after step 2 the daemonset no longer
        # creates otel_traces and a fresh install would have none. Same settings as the daemonset
        # used, so the CREATE is identical: CREATE ... IF NOT EXISTS, and the 7-day TTL.
        # RETENTION, DO NOT REMOVE: with no TTL the otel_* tables filled the ClickHouse volume in
        # 8 days (incident 2026-07, see otel-collector-daemonset's clickhouse exporter).
        create_schema: true
        ttl: 168h
        timeout: 10s
        retry_on_failure:
          enabled: true
          initial_interval: 5s
          max_interval: 30s
          max_elapsed_time: 300s
    service:
      pipelines:
        logs: null
        metrics: null
        traces:
          receivers: [otlp]
          processors: [memory_limiter, tail_sampling, batch]
          exporters: [clickhouse]
