global: {}

# Prometheus -> OTLP bridge (KOS-1: Prometheus-only /metrics -> ClickHouse).
# Several components expose metrics ONLY as Prometheus /metrics scrape endpoints (NOT OTLP),
# so they never reach the ClickHouse otel_metrics_* tables. A `prometheus` receiver could
# scrape them via kubernetes_sd_configs (pod role) and feed the metrics pipeline.
#
# STATUS: the bridge is NOT usable with the default (minimal) krateo-otel-collector image,
# which does not compile in the prometheus receiver. The receiver is therefore nulled in
# config.receivers below (see the detailed note there) — a default install runs clean.
# Enabling it is a THREE-part change, not a one-flag switch (see that note):
#   (1) a collector image built WITH the prometheus receiver,
#   (2) restore the receiver config, and
#   (3) add `prometheus` to the metrics pipeline.
# `prometheusScrape.enabled` below is a MARKER only — it does NOT wire anything on its own
# (a values-only wrapper around the upstream opentelemetry-collector chart cannot
# conditionally omit a nested receiver key; the fix instead nulls the receiver by default).
#
# TARGET COMPONENTS (OTLP-less today) that the bridge would scrape once enabled — they must
# expose /metrics and carry prometheus.io/scrape|port|path annotations:
#   - kagent-tools                     -> :8085  /metrics
#   - ClickHouse server internal       -> :9363  /metrics
#   - controller-runtime controllers   -> :8080  /metrics (needs --metrics-bind-address)
# (The engine reconcile-throughput suite already has an OTLP path via
# provider-/unstructured-runtime; its Prometheus families are a legacy duplicate.)
collector:
  prometheusScrape:
    # MARKER ONLY — does not enable the bridge by itself (see the note above and at
    # config.receivers.prometheus). Enabling requires a prometheus-capable collector image.
    enabled: false

opentelemetry-collector:
  mode: deployment

  # Keep the collector's config using the CANONICAL component names (e.g. `k8sattributes`, not the
  # `k8s_attributes` form the chart rewrites to by default since ~0.162.x). The custom krateo otel
  # image (ghcr.io/krateo-platformops/otel-collector) is a minimal build that registers only
  # `k8sattributes` — the rewritten `k8s_attributes` id makes it fail at startup with
  # "unknown type k8s_attributes". This must stay false while the image is built against the older name.
  rewriteDeprecatedComponentNames: false

  replicaCount: 1

  image:
    # Renamed otelcol-krateo -> krateo-otel-collector when the custom collector was split
    # into its own single-image repo (krateo-platformops/otel-collector) on the canonical CI.
    repository: ghcr.io/krateo-platformops/otel-collector
    # 1.0.9: dependency-only: every Dependabot alert cleared, Go 1.26.11, govulncheck clean
    #        (otel-collector#30). Core stays v0.118.0; no config change.
    # 1.0.8: compositionresolver also writes krateo.io/composition-name and
    #        krateo.io/composition-namespace next to the id (otel-collector#40). Needed by the
    #        name_label_key/namespace_label_key keys below: the processor's config is strict, so
    #        1.0.7 and older refuse those keys at startup.
    # 1.0.7: adds filterprocessor, so this chart can drop k8s.container.ready for Job-owned pods
    #        (otel-collector#39).
    # 1.0.6: same code as 1.0.5, tagged from the first commit whose CI ran the Go tests. The
    #        installer's pin gate refuses a tag no test ran against.
    # 1.0.5: adds transformprocessor, so this chart can redact JWTs on the k8sobjects logs
    #        pipeline (otel-collector#29).
    # 1.0.4: compositionresolver invalidates the RESTMapper on a NO-MATCH, so a composition
    #        group/version minted after the pod started is learned instead of going unlabelled
    #        for the life of the process (otel-collector#22/#24).
    # 1.0.3: compositionresolver falls back to a root composition's own metadata.uid when the
    #        involvedObject is a composition with no inherited krateo.io/composition-id label —
    #        so editor-created (non-installer) compositions' own reconcile events correlate.
    # 1.0.2: + patched clickhouseexporter — recreate the otel_* schema and retry on UNKNOWN_TABLE
    #        (ClickHouse re-provisioned with a fresh DB) instead of dropping data until a restart.
    # 1.0.1: patched k8sobjectsreceiver (recycle timer + restart-on-close) — KOS-1 #112 bug #2
    tag: "1.0.9"
    pullPolicy: IfNotPresent

  # The container binary is still named otelcol-krateo (OTel builder dist.name / Dockerfile
  # ENTRYPOINT); only the published image repository was renamed to krateo-otel-collector.
  command:
    name: otelcol-krateo

  clusterRole:
    create: true
    rules:
      - apiGroups: [""]
        resources: [events, namespaces, nodes, pods, replicationcontrollers,
                    resourcequotas, services, endpoints]
        verbs: [get, list, watch]
      - apiGroups: [apps]
        resources: [daemonsets, deployments, replicasets, statefulsets]
        verbs: [get, list, watch]
      - apiGroups: [batch]
        resources: [jobs, cronjobs]
        verbs: [get, list, watch]
      - apiGroups: [autoscaling]
        resources: [horizontalpodautoscalers]
        verbs: [get, list, watch]
      - apiGroups: ["composition.krateo.io"]
        resources: ["*"]
        verbs: [get]
      - apiGroups: ["templates.krateo.io"]
        resources: ["*"]
        verbs: [get]
      - apiGroups: ["widgets.templates.krateo.io"]
        resources: ["*"]
        verbs: [get]
      - apiGroups: ["deployment.krateo.io"]
        resources: ["*"]
        verbs: [get]
      - apiGroups: ["core.krateo.io"]
        resources: ["*"]
        verbs: [get]

  presets:
    kubernetesAttributes:
      enabled: false
    kubernetesEvents:
      enabled: false
    clusterMetrics:
      enabled: false

  config:
    receivers:
      jaeger: null
      otlp: null
      zipkin: null
      # Prometheus -> OTLP bridge receiver — NULLED by default (like jaeger/otlp/zipkin above).
      #
      # WHY null and not just "declared but inert": the OTel Collector validates the TYPE of
      # EVERY declared receiver at config load, used by a pipeline or not. The minimal
      # krateo-otel-collector image (builder-config.yaml) compiles in ONLY k8sobjects +
      # k8s_cluster — it has NO prometheus receiver — so merely DECLARING `prometheus` here
      # yields `unknown type: "prometheus"` and a CrashLoopBackOff on every default install.
      # (jaeger/zipkin are safe to declare-and-ignore only because they ARE compiled into
      # standard collector images; prometheus is not in this one — that was the wrong
      # assumption behind the old prometheusScrape "gate".)
      #
      # To enable the Prometheus -> OTLP bridge you MUST:
      #   (1) run a collector image BUILT WITH the prometheus receiver
      #       (add receiver/prometheusreceiver to krateo-otel-collector/builder-config.yaml),
      #   (2) replace this `null` with the krateo-pod-annotations scrape config (preserved
      #       commented below for reference), and
      #   (3) add `prometheus` to service.pipelines.metrics.receivers.
      prometheus: null
      # prometheus:
      #   config:
      #     scrape_configs:
      #       - job_name: krateo-pod-annotations
      #         scrape_interval: 60s
      #         kubernetes_sd_configs:
      #           - role: pod
      #         relabel_configs:
      #           # Keep only pods annotated prometheus.io/scrape: "true".
      #           - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
      #             action: keep
      #             regex: "true"
      #           # Honour prometheus.io/path (default /metrics).
      #           - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
      #             action: replace
      #             target_label: __metrics_path__
      #             regex: (.+)
      #           # Honour prometheus.io/port: rewrite the scrape address host:port.
      #           - source_labels: [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port]
      #             action: replace
      #             regex: ([^:]+)(?::\d+)?;(\d+)
      #             replacement: $$1:$$2
      #             target_label: __address__
      #           # Surface namespace / pod / node as labels for downstream attribution.
      #           - source_labels: [__meta_kubernetes_namespace]
      #             action: replace
      #             target_label: k8s_namespace_name
      #           - source_labels: [__meta_kubernetes_pod_name]
      #             action: replace
      #             target_label: k8s_pod_name
      #           - source_labels: [__meta_kubernetes_pod_node_name]
      #             action: replace
      #             target_label: k8s_node_name
      k8sobjects:
        objects:
          - name: events
            mode: watch
            group: ""
            namespaces: []
      k8s_cluster:
        # 30s, not 60s (Diego, 2026-11-08). The per-pod "not Ready for 5 minutes" alert evaluates
        # 1-minute buckets, and HyperDX (2.35) checks [t-1m, t) at t+0.4s with no evaluation delay.
        # At 60s every point is stamped :59 and lands ~4s later, so every bucket was EMPTY when
        # checked, and under `below 1` an empty bucket fires an ungrouped alert (measured by acmp on
        # krateo-057, alert-provider 0.2.64). At 30s each minute also holds a :29 point that is
        # already stored. Cost measured on krateo-057: +125,781 rows/hour, +24% of otel_metrics_gauge
        # rows, ~+0.4 GiB over the 7-day TTL.
        collection_interval: 30s
        node_conditions_to_report: [Ready, MemoryPressure, DiskPressure, PIDPressure]
        allocatable_types_to_report: [cpu, memory, ephemeral-storage]
        # 22.7% of otel_metrics_gauge was these two metrics and nothing reads them.
        #
        # Measured on krateo-057 (2026-10-23): otel_metrics_gauge held 105,789,485 rows
        # in 1.64 GiB, of which k8s.replicaset.available and k8s.replicaset.desired were
        # 12,027,538 rows EACH -- 24,055,076 together, 22.7% of the table. ReplicaSets are
        # churned by every Deployment rollout, so the cardinality is dominated by dead
        # ReplicaSets reporting 0/0 forever.
        #
        # The signal is NOT lost: k8s.deployment.available / k8s.deployment.desired carry
        # the same fact at the controller that actually owns it, at 1.6% of the rows.
        #
        # Verified before disabling: no RESTAction consumes these. The three RESTActions
        # that match "replicaset" (krateo-compositions/composition-events,
        # krateo-compositions/composition-resources, krateo-observability/component-detail)
        # reference the ReplicaSet *resource*, not these gauges.
        #
        # Done at the RECEIVER, not with a filter processor, deliberately: the deployment
        # collector runs ghcr.io/krateo-platformops/otel-collector, whose builder-config.yaml has
        # no filter processor. Adding one here would fail at STARTUP, and `helm template` cannot
        # catch it -- only the collector validates its own component set. Disabling at the
        # receiver also means the metrics are never generated at all.
        metrics:
          k8s.replicaset.available:
            enabled: false
          k8s.replicaset.desired:
            enabled: false

    processors:
      # JOB-OWNED PODS' READINESS. A completed Job's pod reports k8s.container.ready = 0 for as long
      # as the pod object exists, so a per-pod "not Ready" alert would fire on every finished
      # CronJob run (the audit-worm seal/verify pods, the hyperdx-key-bootstrap Job). The
      # k8s_cluster points carry no owner, so this adds ONE attribute, k8s.job.name, from the pod's
      # ownerReference, matched by k8s.pod.uid. It is a separate instance from `k8sattributes`
      # (logs) on purpose: that one copies every pod label, which on every cluster metric would
      # multiply the series. Readiness is meaningless for a Job's pod, so its points are dropped
      # below; every other metric of a Job pod is kept (and gains k8s.job.name).
      #
      # incident-provider's CHECK PODS are run-to-completion too, but bare pods with no Job
      # owner: a new one every 30-60s in krateo-incident-checks, each ready=0 for its one point.
      # They can't fire sre-container-not-ready (5 windows), but one is nearly always in the
      # current window, so the alert sat in PENDING on a healthy cluster. They're matched by
      # the pod label app.kubernetes.io/component=incident-check: a constant in incident-provider
      # (ComponentCheck, checkpod.go) that its NetworkPolicy also selects on, whereas the
      # namespace is a chart value. The label is read into a temporary attribute and removed
      # after the filter, so no other series changes.
      k8sattributes/run-to-completion:
        passthrough: false
        extract:
          metadata: [k8s.job.name]
          labels:
            - tag_name: krateo.tmp.pod.component
              key: app.kubernetes.io/component
              from: pod
        pod_association:
          - sources:
              - from: resource_attribute
                name: k8s.pod.uid
      filter/run-to-completion-readiness:
        error_mode: ignore
        metrics:
          datapoint:
            - 'metric.name == "k8s.container.ready" and resource.attributes["k8s.job.name"] != nil'
            - 'metric.name == "k8s.container.ready" and resource.attributes["krateo.tmp.pod.component"] == "incident-check"'
      transform/drop-tmp-component:
        error_mode: ignore
        metric_statements:
          - context: resource
            statements:
              - 'delete_key(attributes, "krateo.tmp.pod.component")'
      # JWT redaction (installer#394). This pipeline carries Kubernetes Events, whose free-text
      # message can quote a failing command line, token included.
      #
      # body.string, not body: k8sobjects bodies are nested maps, and replace_pattern(body, ...)
      # leaves a map untouched, so the token stays. Tested on the v0.118.0 processor. body.string
      # converts a record to a string only when the pattern matches, so clean records stay maps,
      # and the ClickHouse exporter writes Body().AsString() either way.
      #
      # error_mode: ignore skips a failing statement silently, so sre-jwt-in-telemetry in
      # krateo-observability is what catches a miss.
      transform:
        error_mode: ignore
        log_statements:
          - context: log
            statements:
              - 'replace_pattern(body.string, "eyJ[A-Za-z0-9._-]{20,}", "<REDACTED-JWT>")'
              - 'replace_all_patterns(attributes, "value", "eyJ[A-Za-z0-9._-]{20,}", "<REDACTED-JWT>")'
      batch:
        send_batch_size: 10000
        timeout: 5s
      memory_limiter:
        check_interval: 5s
        limit_percentage: 75
        spike_limit_percentage: 20
      k8sattributes:
        extract:
          metadata:
            - k8s.namespace.name
            - k8s.pod.name
            - k8s.pod.uid
            - k8s.deployment.name
            - k8s.node.name
            - k8s.statefulset.name
            - k8s.daemonset.name
            - k8s.replicaset.name
            - k8s.job.name
            - k8s.cronjob.name
          labels:
            - tag_name: $$1
              key_regex: (.*)
              from: pod
        passthrough: false
        pod_association:
          - sources:
              - from: resource_attribute
                name: k8s.pod.ip
          - sources:
              - from: resource_attribute
                name: k8s.pod.uid
          - sources:
              - from: connection
      resource:
        attributes:
          - key: telemetry.source
            value: "k8s-events"
            action: insert
      compositionresolver:
        cache_ttl: 5m
        negative_cache_ttl: 30s
        label_key: "krateo.io/composition-id"
        # Compositions are named at the source: each event records the composition's name and
        # namespace next to its id, so a consumer can link to /compositions/<ns>/<name> without
        # listing every composition kind to map an id. They come from the same source as the id:
        # the involvedObject's krateo.io/composition-name/-namespace labels, or a root
        # composition's own metadata. Each is written only when known. "" turns one off.
        # Requires image 1.0.8 or later.
        name_label_key: "krateo.io/composition-name"
        namespace_label_key: "krateo.io/composition-namespace"

    exporters:
      clickhouse:
        endpoint: "tcp://krateo-clickstack-clickhouse-clickhouse-headless.krateo-system.svc:9000"
        username: "${env:CH_USERNAME}"
        password: "${env:CH_PASSWORD}"
        database: default
        logs_table_name: otel_logs
        traces_table_name: otel_traces
        metrics_table_name: otel_metrics
        create_schema: true
        # RETENTION — DO NOT REMOVE. Incident 2026-07: with no TTL the otel_* tables grew
        # unbounded and filled the 10Gi ClickHouse volume in 8 days → every insert failed
        # with code 243 (NOT_ENOUGH_SPACE) → the collectors buffered and OOM-crash-looped →
        # telemetry dead. ttl: 168h stamps a native 7-day TTL into the CREATE TABLE the
        # exporter issues, so FRESH installs are bounded from day one. NOTE: create_schema
        # is CREATE ... IF NOT EXISTS — this ttl only applies at table CREATION; tables that
        # already exist (e.g. the live bench) were fixed with a live
        # `ALTER TABLE ... MODIFY TTL` (7 days) and are untouched by this setting.
        # Disk-size sibling fixes: krateo-observability 0.1.9 (15Gi volume + 3-day
        # system-log ttl via cluster.spec.settings.extraConfig).
        ttl: 168h
        timeout: 10s
        retry_on_failure:
          enabled: true
          initial_interval: 5s
          max_interval: 30s
          max_elapsed_time: 300s

    service:
      pipelines:
        logs:
          receivers: [k8sobjects]
          # transform runs after compositionresolver, which reads the map body, and last before
          # batch so it sweeps log attributes added by earlier processors. It does not touch
          # resource attributes: 0 JWT-shaped values in them on krateo-057 over 7 days.
          #
          # This collector needs an image with transform, 1.0.5 or later. Older images crash-loop
          # at startup with: unknown type: "transform".
          processors: [memory_limiter, k8sattributes, resource, compositionresolver, transform, batch]
          exporters: [clickhouse]
        # To enable the Prometheus -> OTLP bridge: restore the prometheus receiver (nulled by
        # default under config.receivers — requires a prometheus-capable collector image) and
        # add it here, i.e. receivers: [k8s_cluster, prometheus].
        metrics:
          receivers: [k8s_cluster]
          processors: [memory_limiter, k8sattributes/run-to-completion, filter/run-to-completion-readiness, transform/drop-tmp-component, batch]
          exporters: [clickhouse]
        traces: null

  extraEnvs:
    - name: CH_USERNAME
      valueFrom:
        secretKeyRef:
          name: otel-clickhouse-credentials
          key: username
    - name: CH_PASSWORD
      valueFrom:
        secretKeyRef:
          name: otel-clickhouse-credentials
          key: password

  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 100m
      memory: 256Mi

  # Probe tolerances, passed through to the upstream opentelemetry-collector chart's
  # templates/_pod.tpl (org standard). The Kubernetes defaults (timeoutSeconds: 1,
  # failureThreshold: 3) kill HEALTHY pods under CPU contention — a slow-but-alive
  # health reply counts as a failure and the resulting restart storm worsens the
  # contention. Liveness is lenient so only a truly dead process dies: implicit
  # periodSeconds default 10 x 6 failures = 60s of continuous failure before restart.
  livenessProbe:
    timeoutSeconds: 5
    failureThreshold: 6
  # Readiness keeps prompt endpoint removal (failureThreshold: 3, implicit 10s period)
  # but timeoutSeconds: 5 keeps load alone from flapping the endpoint in and out.
  readinessProbe:
    timeoutSeconds: 5
    failureThreshold: 3
