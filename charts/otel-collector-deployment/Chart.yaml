apiVersion: v2
name: otel-collector-deployment
description: >-
  Cluster-level OpenTelemetry collector (deployment mode) for Krateo. Wraps the
  upstream opentelemetry-collector chart with a custom otelcol-krateo image that
  enriches K8s events with krateo.io/composition-id and exports to ClickHouse.
type: application
# 0.3.4: explicit lenient probe tolerances + Quantity (integer|string) resources typing in
# values.schema.json.
# 0.3.3: clickhouse exporter ttl: 168h — 7-day retention stamped into freshly created otel_*
# tables (retention incident: 10Gi filled in 8 days → insert code 243 → collector OOM loop).
# 0.3.5: bump opentelemetry-collector dep 0.158.1 → 0.170.0 (collector 0.153.0 → 0.158.0). The two
# breaking value renames in that range (rewriteDeprecatedProcessorNames→...ComponentNames,
# telemetry.metrics.address→...readers) are NOT set by this wrapper — verified by a clean render
# against 0.170.0's strict values.schema.json. Also repoints the dead-org icon to the canonical asset.
# 0.3.7: bump the custom collector image to 1.0.3 — compositionresolver falls back to a root
# composition's own metadata.uid when the involvedObject is a composition with no inherited
# krateo.io/composition-id label (editor-created compositions' own reconcile events now correlate).
# 0.3.6: rewriteDeprecatedComponentNames=false — the krateo custom otel image only has `k8sattributes`,
# not the `k8s_attributes` the 0.170.0 chart rewrites to (runtime "unknown type k8s_attributes").
# 0.3.8: bump the custom collector image to 1.0.4 — compositionresolver invalidates the RESTMapper
# on a NO-MATCH, so a composition group/version minted after the collector pod started can be
# learned (otel-collector#22/#24). Measured on krateo-057 2026-10-12: composition-kind event
# labelling was ~100% for established group/versions but 0% for newly minted ones —
# composition.krateo.io/v1-12-42 0/8 and v0-3-413 0/6 (both rolled that morning) against
# v0-3-0 8159/8165 and v0-1-0 3224/3225. Every chart bump mints a new vX-Y-Z, and the upstream
# DeferredDiscoveryRESTMapper self-heal is dead because memCacheClient.Fresh() reports POPULATED,
# not current. 1.0.4 also carries the Go 1.25 builder fix that made 1.0.4's first cut unbuildable.
# 0.3.9: SECURITY (installer#394/#396) — this pipeline had NO redaction at all. The daemonset has
#   carried one since 0.1.9; this collector never did, and the two are easy to assume alike. The
#   k8sobjects receiver ships Kubernetes objects and events verbatim, and an event message can quote
#   a command line ("--token eyJ..."), so a token that reached etcd reached ClickHouse too. Adds a
#   `transform` processor on the logs pipeline redacting the body and SWEEPING every attribute value
#   (`replace_all_patterns`) rather than naming keys — naming keys is what let `http.path` through on
#   the daemonset's traces side. Placed after compositionresolver and before batch, so anything an
#   earlier processor adds is swept and the batch carries already-redacted records.
version: 0.3.9
appVersion: "1.0.4"
dependencies:
  - name: opentelemetry-collector
    version: 0.170.0
    repository: https://open-telemetry.github.io/opentelemetry-helm-charts
home: https://krateo.io
icon: https://raw.githubusercontent.com/krateo-platformops/.github/main/brand/logo.svg
keywords:
  - krateo
  - platformops
  - opentelemetry
  - observability
sources:
  - https://github.com/krateo-platformops/clickstack-chart
  - https://github.com/krateo-platformops/otel-collector
