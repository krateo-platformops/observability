apiVersion: v2
name: otel-collector-deployment
description: >-
  Cluster-level OpenTelemetry collector (deployment mode) for Krateo. Wraps the
  upstream opentelemetry-collector chart with a custom otelcol-krateo image that
  enriches K8s events with krateo.io/composition-id and exports to ClickHouse.
type: application
# 0.3.11: disable k8s.replicaset.available / k8s.replicaset.desired at the k8s_cluster receiver —
# 22.7% of otel_metrics_gauge (24,055,076 of 105,789,485 rows, 1.64 GiB total, measured on 057
# 2026-10-23) with no consumer. ReplicaSets churn on every Deployment rollout, so the rows are
# dominated by dead ReplicaSets reporting 0/0; k8s.deployment.{available,desired} carries the same
# fact at the owning controller for 1.6% of the volume. Disabled at the RECEIVER, not via a filter
# processor: this collector's builder-config.yaml ships only [batch memory_limiter k8sattributes
# resource compositionresolver], so a filter/ would fail at startup and helm template cannot catch
# it. TTL stays 168h and the PVC is NOT resized (disk was 32%, 4.7G of 14.7G — headroom, not a fire).
# 0.3.4: explicit lenient probe tolerances + Quantity (integer|string) resources typing in
# values.schema.json.
# 0.3.3: clickhouse exporter ttl: 168h — 7-day retention stamped into freshly created otel_*
# tables (retention incident: 10Gi filled in 8 days → insert code 243 → collector OOM loop).
# 0.3.5: bump opentelemetry-collector dep 0.158.1 → 0.170.0 (collector 0.153.0 → 0.158.0). The two
# breaking value renames in that range (rewriteDeprecatedProcessorNames→...ComponentNames,
# telemetry.metrics.address→...readers) are NOT set by this wrapper — verified by a clean render
# against 0.170.0's strict values.schema.json. Also repoints the dead-org icon to the canonical asset.
# 0.3.7: bump the custom collector image to 1.0.3 — compositionresolver falls back to a root
# composition's own metadata.uid when the involvedObject is a composition with no inherited
# krateo.io/composition-id label (editor-created compositions' own reconcile events now correlate).
# 0.3.6: rewriteDeprecatedComponentNames=false — the krateo custom otel image only has `k8sattributes`,
# not the `k8s_attributes` the 0.170.0 chart rewrites to (runtime "unknown type k8s_attributes").
# 0.3.8: bump the custom collector image to 1.0.4 — compositionresolver invalidates the RESTMapper
# on a NO-MATCH, so a composition group/version minted after the collector pod started can be
# learned (otel-collector#22/#24). Measured on krateo-057 2026-10-12: composition-kind event
# labelling was ~100% for established group/versions but 0% for newly minted ones —
# composition.krateo.io/v1-12-42 0/8 and v0-3-413 0/6 (both rolled that morning) against
# v0-3-0 8159/8165 and v0-1-0 3224/3225. Every chart bump mints a new vX-Y-Z, and the upstream
# DeferredDiscoveryRESTMapper self-heal is dead because memCacheClient.Fresh() reports POPULATED,
# not current. 1.0.4 also carries the Go 1.25 builder fix that made 1.0.4's first cut unbuildable.
# 0.3.9: SECURITY (installer#394/#396) — this pipeline had NO redaction at all. The daemonset has
#   carried one since 0.1.9; this collector never did, and the two are easy to assume alike. The
#   k8sobjects receiver ships Kubernetes objects and events verbatim, and an event message can quote
#   a command line ("--token eyJ..."), so a token that reached etcd reached ClickHouse too. Adds a
#   `transform` processor on the logs pipeline redacting the body and SWEEPING every attribute value
#   (`replace_all_patterns`) rather than naming keys — naming keys is what let `http.path` through on
#   the daemonset's traces side. Placed after compositionresolver and before batch, so anything an
#   earlier processor adds is swept and the batch carries already-redacted records.
# 0.3.10: REVERT the 0.3.9 transform. It crash-looped this collector on krateo-057:
#     error decoding 'processors': unknown type: "transform" for id: "transform"
#     (valid values: [memory_limiter k8sattributes resource compositionresolver batch])
#   This collector runs the CUSTOM image ghcr.io/krateo-platformops/otel-collector, which is built
#   with that exact component set and has no transform processor -- 0.3.6's note says so and 0.3.9
#   was written past it. `helm template` cannot catch this: the chart renders a valid-looking config
#   and only the collector validates its own component set, at startup, so the failure lands in the
#   cluster rather than in CI. Redacting k8sobjects logs needs `transform` added to the custom
#   image's builder manifest first (krateo-platformops/otel-collector); until then this pipeline is
#   unredacted and installer#394 stays open for it. The daemonset's 0.1.12 sweep is unaffected --
#   it runs opentelemetry-collector-contrib, which has transform.
# 0.3.12: metadata only -- `sources` names this repo by its current name, krateo-platformops/observability
# (was the old clickstack-chart, which only redirects). Bumped so the next tag does not overwrite
# 0.3.11 with different metadata: consumers cache by version (see krateo-observability 0.1.3).
# 0.3.13: redact JWTs on the k8sobjects logs pipeline with image 1.0.5, which adds transformprocessor
# (otel-collector#29). This does NOT restore the 0.3.9 statements: k8sobjects bodies are nested maps,
# which replace_pattern(body, ...) leaves untouched, so this targets body.string. Clean records stay
# maps. Requires otel-collector 1.0.5, which this chart sets itself.
# 0.3.14: image 1.0.6, the same code as 1.0.5. The installer's pin gate refused 1.0.5 because no CI
# ran the Go tests at that tag. Requires 1.0.5 or later, for transform.
# 0.3.15: k8s_cluster collects every 30s instead of 60s, so a 1-minute HyperDX bucket always holds a
# point that is already stored when it is checked (the per-pod readiness alert; Diego 2026-11-08):
# +24% otel_metrics_gauge rows on krateo-057. And k8s.container.ready is dropped for Job-owned pods,
# found by a narrow k8sattributes/job-owner that adds only k8s.job.name: a finished Job's pod reads
# not-ready forever. Every other metric is unchanged apart from gaining k8s.job.name on Job pods.
# Requires image 1.0.7 (filterprocessor), which this chart sets.
# 0.3.16: k8s.container.ready is also dropped for incident-provider's check pods (pod label
# app.kubernetes.io/component=incident-check), bare run-to-completion pods that kept
# sre-container-not-ready in PENDING on a healthy cluster. job-owner/job-readiness are renamed
# run-to-completion/run-to-completion-readiness; the label is read into a temporary attribute and
# deleted after the filter, so no other series changes.
# 0.3.17: image 1.0.8. compositionresolver also writes krateo.io/composition-name and
# krateo.io/composition-namespace next to krateo.io/composition-id (name_label_key,
# namespace_label_key), so the portal's events bell can link to /compositions/<ns>/<name> without
# listing every composition kind. On krateo-057, 0 of 1,854 live objects carrying a composition-id
# label lack either label. Requires image 1.0.8: the processor's config is strict, so older images
# refuse the new keys at startup.
# 0.3.18: image 1.0.9, a dependency-only release: every Dependabot alert on the collector cleared,
# Go 1.26.11, govulncheck clean (otel-collector#30). Collector core stays v0.118.0, so no config key
# changes. One behaviour change in the collector's own telemetry: a service.telemetry.resource
# schema_url is now ignored instead of rejected (this chart sets none).
# 0.3.19: comments only: neutral wording in comments (no internal ids or private repo
# references); no rendered object changes.
# 0.3.20: comments only: neutral wording (no internal work-item or plan ids);
# no rendered object changes.
# 0.3.21: the chart renders the collector's ConfigMap itself (templates/configmap.yaml) and the
# upstream subchart mounts it (configMap.create false + configMap.existingName). values.yaml used
# to drop upstream's default jaeger, otlp, prometheus and zipkin receivers and its traces pipeline
# with null; Helm 4.2 and later drop a parent chart's nulls before the subchart's defaults merge
# in (upstream Helm change 31979), so under Helm 4 they came back. The template now leaves each out
# while it holds upstream's default; no null is left in values.yaml. Under Helm 3 the render is the
# same object for object, ConfigMap name, labels and checksum/config value included, so pods do
# not restart; Helm 4 renders the same. Overrides under opentelemetry-collector.config keep their
# meaning. tests/collector-helm4-render.py.
# 0.3.22: no container ports and no Service. Upstream opened ports for its default receivers
# (otlp 4317/4318, jaeger 6831/14250/14268, zipkin 9411); this collector runs none of them, since
# k8sobjects and k8s_cluster read the Kubernetes API and listen on nothing, so every one refused
# connections. ports.<name>.enabled: false for all six, and service.enabled: false, because a
# ClusterIP Service with no ports is rejected by the API server (spec.ports: Required value). The
# collector config and checksum/config are unchanged; the pod rolls once for the pod-template ports.
# A receiver added that listens needs its port enabled; tests/collector-helm4-render.py checks
# ports and started receivers against each other, both ways.
# 0.3.23: an upstream default receiver a pipeline names is kept. templates/_collector-config.tpl
# left out upstream's jaeger, otlp, prometheus and zipkin receivers whenever they held upstream's
# default, so a pipeline that named one (say otlp in a traces pipeline, its config left alone)
# pointed at an undeclared receiver and the collector would refuse to start. A whole receiver is now
# left out only while it equals upstream's default AND no pipeline names it (an extension: while
# service.extensions does not name it). Upstream's default traces pipeline is left out first, so
# its receivers do not count. The default render is the same byte for byte, checksum/config
# included, so the pod does not restart.
# 0.3.24: image 1.0.10: a failed list no longer ends event collection (otel-collector#42). On a test
# cluster one refused list during an API server restart cost 20 minutes of events, until the pod was
# replaced; reproduced with images 1.0.6 and 1.0.9. No config change; the pod rolls for the image.
# 0.3.25: CompositionDefinitions are read by pull, every 5 minutes, one row each in otel_logs with
# telemetry.source = 'k8s-objects' (receiver k8sobjects/definitions, its own pipeline
# logs/definitions: memory_limiter, resource/definitions, transform/definitions, batch). A failed
# Ready on a definition is a successful reconcile that only writes status.conditions[type=Ready], so
# core-provider emits no Event for it or for its clearing, and the condition itself is the source for
# the two alerts in krateo-observability 0.1.61. The transform keeps metadata.name, namespace and
# generation and status.observedGeneration and conditions (1.2 KB of 4.3 KB an object on krateo-057,
# 79 definitions, before managedFields), then sweeps JWTs as the events pipeline does. The
# ClusterRole gains list and watch on compositiondefinitions.core.krateo.io. The events pipeline and
# its 'k8s-events' tag are unchanged. No image change (1.0.10 has the k8sobjects pull mode, resource
# and transform). NOTE: the receiver refuses to start when the resource is not in API discovery, so a
# cluster without core-provider's CRD crash-loops this collector until the CRD is served.
version: 0.3.25
appVersion: "1.0.10"
dependencies:
  - name: opentelemetry-collector
    version: 0.170.0
    repository: https://open-telemetry.github.io/opentelemetry-helm-charts
home: https://krateo.io
icon: https://raw.githubusercontent.com/krateo-platformops/.github/main/brand/logo.svg
keywords:
  - krateo
  - platformops
  - opentelemetry
  - observability
sources:
  - https://github.com/krateo-platformops/observability
  - https://github.com/krateo-platformops/otel-collector
