apiVersion: v2
name: clickhouse-operator
description: >-
  ClickHouse Kubernetes operator packaged as a Krateo composition for the ClickStack data layer.
type: application
# version = this Krateo wrapper's own release stream. appVersion = the upstream
# clickhouse-operator-helm version actually deployed.
# 0.1.1: bump clickhouse-operator-helm dep 0.0.5 → 0.0.7. 0.0.7 renamed the values contract
# `enable:` → `enabled:` across blocks, so values.yaml migrates operator.webhook/certManager
# `enable: false` → `enabled: false` (else the toggles silently no-op and the webhook +
# cert-manager Certificates the umbrella doesn't provide would come back on). CRD set unchanged
# (clickhouseclusters + keeperclusters); patch-level app bump v0.0.5 → v0.0.7.
version: 0.1.1
appVersion: "0.0.7"
home: https://krateo.io
icon: https://raw.githubusercontent.com/krateo-platformops/.github/main/brand/logo.svg
keywords:
  - clickhouse
  - database
  - operator
  - krateo
  - clickstack
annotations:
  krateo.io/category: database
  krateo.io/maturity: beta
  krateo.io/display-name: ClickHouse Operator
  krateoSupportedVersion: ">= 2.5.1"
sources:
  - https://github.com/ClickHouse/clickhouse-kubernetes-operator
  - https://github.com/krateo-platformops/clickstack-operators-chart
dependencies:
  # Aliased to `operator`: a values key named `clickhouse-operator` would pascalize to this
  # chart's own Kind (ClickhouseOperator) and collide in core-provider's crdgen struct-naming.
  # The alias makes Helm read the subchart's values from `operator:`.
  - name: clickhouse-operator-helm
    alias: operator
    version: "0.0.7"
    repository: oci://ghcr.io/clickhouse
