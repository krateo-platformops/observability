global: {}

# NODE-LOCAL Service (templates/service-local.yaml): <release>-local, ClusterIP with
# internalTrafficPolicy: Local, OTLP on 4317/4318. For senders that can only be given a Service name
# (the composition-dynamic-controllers); the upstream chart's own Service is headless, so it is
# not node-local. Senders that can use their node's IP (status.hostIP) keep doing so.
localService:
  enabled: true

opentelemetry-collector:
  mode: daemonset

  # Keep the config on the CANONICAL component names (`k8sattributes`, `filelog`, ...) rather than the
  # `k8s_attributes`/`file_log` form the chart rewrites to by default since ~0.162.x. The daemonset runs
  # the upstream contrib image (which still keeps the deprecated aliases), so it works either way — but
  # we pin false for parity with the deployment (whose custom image only has the canonical names) and to
  # avoid depending on aliases contrib may eventually drop.
  rewriteDeprecatedComponentNames: false

  # Headless Service exposing the node-local agent's OTLP receiver at a stable in-cluster DNS name
  # (otel-collector-daemonset-opentelemetry-collector.<ns>.svc:4317 grpc / :4318 http) so the engine,
  # cdc controllers and app components can export OTLP -> ClickHouse without needing per-node
  # status.hostIP (the core-provider otel.endpoint is a literal string, not a downward-API ref).
  # clusterIP: None keeps it headless -> consumes no Service-CIDR address.
  service:
    enabled: true
    type: ClusterIP
    clusterIP: None

  image:
    repository: otel/opentelemetry-collector-contrib

  command:
    name: otelcol-contrib

  clusterRole:
    create: true
    rules:
      - apiGroups: [""]
        resources: [nodes/proxy, pods]
        verbs: [get, list, watch]

  presets:
    logsCollection:
      enabled: true
      includeCollectorLogs: false
    hostMetrics:
      enabled: true
    kubernetesAttributes:
      enabled: true
      extractAllPodLabels: true
    kubeletMetrics:
      enabled: true

  config:
    receivers:
      filelog:
        operators:
          - id: container-parser
            max_log_size: 102400
            type: container
          - id: recombine-multiline
            type: recombine
            combine_field: body
            combine_with: "\n"
            is_first_entry: 'body not matches "^  " and body not matches "^}"'
            source_identifier: attributes["log.file.path"]
            max_unmatched_batch_size: 100
            overwrite_with: oldest
          # #54: promote severity and trace context out of JSON log lines. Without these, SeverityText
          # and TraceId stay empty on every filelog row. Separate operators, not one json_parser with
          # severity/trace blocks, because inside json_parser a line with no level makes the collector
          # log an error with a stack trace, once per line, and krateo-clickstack-mongodb logs JSON
          # without one (measured on krateo-057: 45,203 of 450,493 JSON rows in 6h).
          #
          # Body stays the raw line: the default alerts, the portal and nightly-review all read
          # fields out of Body. `krateo.scratch` holds the parsed copy and json-cleanup removes it, so
          # LogAttributes do not grow a second copy of every line. The parsed JSON sits under .json
          # and the derived value beside it, so no key an emitter logs can collide with either.
          #
          # on_error is send_quiet throughout: a line that does not parse is still a log line, and
          # must reach ClickHouse unchanged.
          #
          # KNOWN LIMITS, each measured at 0 rows on krateo-057 over 24h. These operators run after
          # recombine and before `transform`, so a JSON line with stack-trace continuation lines, or
          # with ANSI colour around it, does not parse and keeps empty fields. Both fail silently. To
          # check for the first: startsWith(Body, '{') AND position(Body, '\n') > 0 AND SeverityNumber = 0.
          - id: json-body
            type: json_parser
            if: 'body matches "^\\s*\\{"'
            parse_from: body
            parse_to: attributes["krateo.scratch"].json
            on_error: send_quiet
          # Reads `level` (slog, zap) or, when that is not a usable string, `severity_text` (the OTel
          # shape krateo-audit-worm and the budget evaluator emit). Upper-casing keeps SeverityText to
          # one spelling per level: both "ERROR" and "error" are live, 93 of 259 error rows in 6h being
          # lowercase. It belongs here and not in `transform`, which also runs on logs/audit, because
          # krateo-audit-worm hashes SeverityText and audit records must stay as written. Numeric
          # levels are skipped: they would become SeverityText "30" with SeverityNumber 0.
          - id: json-severity-text
            type: add
            if: '(type(attributes["krateo.scratch"]?.json?.level) == "string" and attributes["krateo.scratch"].json.level != "") or (type(attributes["krateo.scratch"]?.json?.severity_text) == "string" and attributes["krateo.scratch"].json.severity_text != "")'
            field: attributes["krateo.scratch"].severity
            value: 'EXPR(upper(type(attributes["krateo.scratch"].json.level) == "string" and attributes["krateo.scratch"].json.level != "" ? attributes["krateo.scratch"].json.level : attributes["krateo.scratch"].json.severity_text))'
            on_error: send_quiet
          # SeverityText is the level as emitted, so filter on SeverityNumber, not text: PANIC and
          # ERROR+1 are errors whose text is not "ERROR". The mapping adds what the default mapping
          # leaves at SeverityNumber 0: slog's +1 to +3 offsets (oasgen-provider logs DEBUG+3, 92,926
          # rows in 6h), ERROR+4 and DEBUG-4 (how slog prints custom FATAL and TRACE levels), and
          # CRITICAL/PANIC. Any other level, such as NOTICE, keeps its text with SeverityNumber 0.
          - id: json-severity
            type: severity_parser
            if: 'attributes["krateo.scratch"]?.severity != nil'
            parse_from: attributes["krateo.scratch"].severity
            on_error: send_quiet
            mapping:
              trace: DEBUG-4
              debug2: DEBUG+1
              debug3: DEBUG+2
              debug4: DEBUG+3
              info2: INFO+1
              info3: INFO+2
              info4: INFO+3
              warn2: WARN+1
              warn3: WARN+2
              warn4: WARN+3
              error2: ERROR+1
              error3: ERROR+2
              error4: ERROR+3
              fatal: ERROR+4
              fatal2: [CRITICAL, PANIC, DPANIC]
          # trace_parser pads or truncates other lengths into an id that joins to nothing, so
          # json-trace requires a W3C trace id and this drops a span id of the wrong shape first.
          # camelCase `traceId` is plumbing's 9-character shortid and is deliberately not read.
          # SpanId is set only together with a valid trace_id.
          - id: json-span-guard
            type: remove
            if: 'attributes["krateo.scratch"]?.json?.span_id != nil and not (type(attributes["krateo.scratch"].json.span_id) == "string" and attributes["krateo.scratch"].json.span_id matches "^[0-9a-fA-F]{16}$")'
            field: attributes["krateo.scratch"].json.span_id
            on_error: send_quiet
          - id: json-trace
            type: trace_parser
            if: 'type(attributes["krateo.scratch"]?.json?.trace_id) == "string" and attributes["krateo.scratch"].json.trace_id matches "^[0-9a-fA-F]{32}$"'
            on_error: send_quiet
            trace_id:
              parse_from: attributes["krateo.scratch"].json.trace_id
            span_id:
              parse_from: attributes["krateo.scratch"].json.span_id
          - id: json-cleanup
            type: remove
            if: 'attributes["krateo.scratch"] != nil'
            field: attributes["krateo.scratch"]
            on_error: send_quiet

      hostmetrics:
        collection_interval: 60s

      kubeletstats:
        collection_interval: 60s
        auth_type: serviceAccount
        endpoint: "${env:K8S_NODE_NAME}:10250"
        insecure_skip_verify: true
        # The volume group is for storage headroom (installer#393). extra_metadata_labels is what
        # puts k8s.volume.type and k8s.persistentvolumeclaim.name on a volume's points: without it
        # no point says which claim it belongs to, and filter/pvc-volumes below would drop them all.
        metric_groups: [node, pod, container, volume]
        extra_metadata_labels: [k8s.volume.type]
        metrics:
          # Headroom needs available and capacity. An out-of-inodes volume is a real failure, but
          # nothing alerts on it yet, so the three inode metrics aren't worth a series per volume.
          k8s.volume.inodes:
            enabled: false
          k8s.volume.inodes.free:
            enabled: false
          k8s.volume.inodes.used:
            enabled: false
          k8s.pod.cpu_limit_utilization:
            enabled: true
          k8s.pod.cpu_request_utilization:
            enabled: true
          k8s.pod.memory_limit_utilization:
            enabled: true
          k8s.pod.memory_request_utilization:
            enabled: true
          k8s.pod.uptime:
            enabled: true
          k8s.node.uptime:
            enabled: true
          k8s.container.cpu_limit_utilization:
            enabled: true
          k8s.container.cpu_request_utilization:
            enabled: true
          k8s.container.memory_limit_utilization:
            enabled: true
          k8s.container.memory_request_utilization:
            enabled: true
          container.uptime:
            enabled: true

      # The agentgateways' own metrics (OTEL-14(a), installer#406): requests by route and status,
      # latencies, and LLM token usage by team. agentgateway exposes them only as Prometheus on
      # :15020/metrics (its metrics policy has no OTLP push), so each node agent scrapes the gateway
      # pods on its own node. Scoped to the agentgateway gateway class, not to every pod with
      # prometheus.io annotations: about 2,100 series today, and a new gateway is picked up without
      # a chart change. `job` is the pod's app.kubernetes.io/name, which the receiver turns into
      # service.name, so the metrics carry the same name as the gateway's traces. The receiver sets
      # k8s.namespace.name and k8s.pod.name on the resource from the pod's discovery labels.
      prometheus/agentgateway:
        config:
          scrape_configs:
            - job_name: agentgateway
              scrape_interval: 30s
              kubernetes_sd_configs:
                - role: pod
                  selectors:
                    - role: pod
                      field: spec.nodeName=${env:K8S_NODE_NAME}
                      label: gateway.networking.k8s.io/gateway-class-name=agentgateway
              relabel_configs:
                - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
                  regex: "true"
                  action: keep
                - source_labels: [__meta_kubernetes_pod_ip, __meta_kubernetes_pod_annotation_prometheus_io_port]
                  regex: (.+);(\d+)
                  replacement: $$1:$$2
                  target_label: __address__
                - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
                  regex: (.+)
                  target_label: __metrics_path__
                - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_name]
                  target_label: job

    processors:
      transform:
        # error_mode:ignore so a redaction statement on an absent attribute key never fails the
        # whole batch (drops telemetry) — it just skips that statement.
        error_mode: ignore
        # SECURITY (#122): the upstream kagent-tools server leaks the caller's authn JWT unredacted
        # — the Authorization header (every call) and error/exception messages ("[Kubernetes] ...
        # --token eyJ...", on kubectl errors). It reaches BOTH sinks: spans over OTLP, and the
        # agent's pod stdout via filelog — so otel_traces AND otel_logs would persist a
        # 24h-replayable admin JWT in ClickHouse. Amplified by per-user RBAC (TOKEN_PASSTHROUGH=true
        # -> --token on every kubectl call). Collector-side backstop until kagent-dev/tools ships
        # the fix (reported privately). Drop the Authorization header attr outright; redact any JWT
        # (eyJ base64url incl. its dots) from every sink it can land in.
        log_statements:
          - context: log
            statements:
              - 'replace_pattern(body, "\\x1b\\[[0-9;]*[mGKHFABCDsu]", "")'
              # The container parser puts the whole pod log line in body as a string, so body is
              # the sink for every token an agent prints to stdout. body.string, not body, because
              # this also runs on the OTLP arms, where a producer may send a map body, and
              # replace_pattern(body, ...) leaves a map untouched. It converts a record only when the
              # pattern matches, so a clean record stays as sent, and a string body behaves the same.
              - 'replace_pattern(body.string, "eyJ[A-Za-z0-9._-]{20,}", "<REDACTED-JWT>")'
              # body was the only sink redacted until 0.1.12, which left log ATTRIBUTES unredacted.
              # replace_all_patterns sweeps every attribute VALUE, so a token in any key -- present
              # or added later -- is caught without enumerating the key. Enumerating is what let
              # http.path through on the traces side for days (installer#396).
              - 'replace_all_patterns(attributes, "value", "eyJ[A-Za-z0-9._-]{20,}", "<REDACTED-JWT>")'
              # S1 (2026-11-09): drop any attribute whose KEY names a credential header, whatever its
              # value, in any naming (http.header.Authorization, http.request.header.authorization,
              # http.request.header.cookie, ...). The JWT sweep above only catches JWT-shaped values;
              # an opaque bearer token or a session cookie passes it. Partial, case-insensitive match,
              # so proxy-authorization and set-cookie go too.
              - 'delete_matching_keys(attributes, "(?i)(authorization|cookie)")'
              - 'set(attributes["krateo.io/composition-id"], resource.attributes["k8s.pod.labels.krateo.io/composition-id"]) where resource.attributes["k8s.pod.labels.krateo.io/composition-id"] != nil'
        trace_statements:
          - context: span
            statements:
              - 'delete_key(attributes, "http.header.Authorization")'
              # S1 (2026-11-09): upstream kagent tools copy the raw Authorization header into spans when
              # tracing is on, and the exact key above misses other namings
              # (http.request.header.authorization) and cookies. An opaque non-JWT token is not caught
              # by the JWT sweep below either. So drop any attribute whose KEY names a credential
              # header, case-insensitive and partial (proxy-authorization, set-cookie included).
              # krateo-observability's sre-credential-header-in-traces fires if one ever gets through.
              - 'delete_matching_keys(attributes, "(?i)(authorization|cookie)")'
              # MEASURED on krateo-057 2026-10-22 (installer#396): 22 spans still carried a raw JWT
              # after the per-key statements below, every one of them in `http.path`, on spans named
              # `GET /events/*` and `GET krateo-sse-proxy...:8080`. The enumerated keys could not
              # catch it because nobody had thought of that key. replace_all_patterns sweeps every
              # attribute VALUE instead, so the fix does not depend on predicting the key.
              # Root cause is installer#395 -- the events bell puts the bearer token in the URL
              # because EventSource cannot set headers, and the gateway records the URL as http.path.
              # This is a BACKSTOP: it stops the token reaching ClickHouse, it does not stop the
              # browser sending it in a URL, where it also lands in any proxy or access log.
              - 'replace_all_patterns(attributes, "value", "eyJ[A-Za-z0-9._-]{20,}", "<REDACTED-JWT>")'
              - 'replace_pattern(status.message, "eyJ[A-Za-z0-9._-]{20,}", "<REDACTED-JWT>")'
              - 'replace_pattern(attributes["exception.message"], "eyJ[A-Za-z0-9._-]{20,}", "<REDACTED-JWT>") where attributes["exception.message"] != nil'
          - context: spanevent
            statements:
              - 'delete_matching_keys(attributes, "(?i)(authorization|cookie)")'
              - 'replace_all_patterns(attributes, "value", "eyJ[A-Za-z0-9._-]{20,}", "<REDACTED-JWT>")'
              - 'replace_pattern(attributes["exception.message"], "eyJ[A-Za-z0-9._-]{20,}", "<REDACTED-JWT>") where attributes["exception.message"] != nil'
              - 'replace_pattern(attributes["error.message"], "eyJ[A-Za-z0-9._-]{20,}", "<REDACTED-JWT>") where attributes["error.message"] != nil'
      # THE AUDIT TABLE HAS TWO PRODUCERS NOW, so the pipelines below partition the OTLP log
      # stream instead of letting both land in krateo_audit. The `logs/audit` comment below
      # anticipated exactly this: "If a second [OTLP log producer] ever appears, gate THIS
      # pipeline with a filter on event.name==\"audit\" rather than letting foreign records land
      # in krateo_audit." It has appeared. MEASURED on krateo-057 2026-10-22, krateo_audit held
      # 2,493 rows: 10 from snowplow's audit exporter (ScopeName .../snowplow/audit) and 2,483
      # from the AGENT GATEWAY's access log (ServiceName krateo-agent-gateway, ScopeName
      # request), which has no other destination because `logs/audit` is the only otlp-fed logs
      # pipeline on this agent. Consequences that forced the fix rather than a query-side
      # workaround: (a) every audit consumer -- widget, RestAction, ad-hoc query -- has to
      # remember a ScopeName predicate or it reports 2,493 "audit records" when there are 10,
      # and installer#415's userAccessFilter matches ZERO rows in whichever population it was
      # not written for while still returning a result (on an audit view that fails toward
      # disclosure); (b) krateo_audit carries TTL 365 DAYS against otel_logs' 7, so the access
      # logs were being retained 52x longer than the pod logs they belong with.
      # WHY TWO FILTERS AND A THIRD PIPELINE, not one filter: dropping the gateway records
      # would lose them, and they are useful -- they are the only per-request record of the LLM
      # and MCP hops. A receiver feeds every pipeline that NAMES it, so otlp fans out to both
      # `logs/audit` and `logs/gateway` and each keeps the complement of the other. The
      # partition is exact and total: a record either has event.name=="audit" or it does not.
      # Cost is k8s_attributes + transform running twice over the OTLP log stream (~1.2k
      # records/day), NOT over the filelog firehose, which is why the pair-of-filters objection
      # in the `logs/audit` comment does not apply here -- that objection was about adding otlp
      # to the `logs` pipeline and re-processing every pod log on every node.
      # error_mode:ignore is deliberate and its bias differs per filter. filterprocessor with
      # ignore RETAINS a record whose condition errored, so an audit record whose event.name is
      # somehow unevaluable stays in krateo_audit rather than being silently dropped. Silent
      # loss from an audit trail is the one failure mode worth biasing against; a gateway record
      # duplicated into otel_logs is harmless.
      filter/audit-only:
        error_mode: ignore
        logs:
          log_record:
            # DROPS what matches, so this keeps ONLY audit records. A gateway access-log record
            # has no event.name key at all: OTTL resolves the missing key to nil, nil != "audit"
            # is true, and the record is dropped here -- which is the intent.
            - 'attributes["event.name"] != "audit"'
      filter/not-audit:
        error_mode: ignore
        logs:
          log_record:
            - 'attributes["event.name"] == "audit"'
      # DROPS what matches. kubeletstats reports every pod volume, and nearly all of them are
      # projected service-account tokens, configmaps and emptyDirs: 431 volumes on krateo-057, 7 of
      # them claims. The rest would add series with no use, so only claims are kept. Other kubelet
      # metrics have no k8s.volume.type, so the name test is what leaves them alone.
      filter/pvc-volumes:
        error_mode: ignore
        metrics:
          metric:
            - 'IsMatch(name, "^k8s\\.volume\\.") and resource.attributes["k8s.volume.type"] != "persistentVolumeClaim"'
      # SLO SPAN METRICS (D5): the spans the performance SLOs are computed from, and nothing else.
      # DROPS what matches (conditions are ORed). The first keeps only snowplow SERVER spans (the
      # API SLI) and krateo-frontend RUM spans re-exported by snowplow's rum-ingest (the UI SLIs);
      # every other service and snowplow's client/internal spans never reach the connector, which
      # is what keeps the metric series bounded.
      # The second: SSE stream and the RUM ingest itself, excluded from the SLIs per X5 (acmp).
      # Done HERE rather than in the alert because alert-provider labels match data-point
      # Attributes by exact value only, so a Metric CR cannot say "route is NOT x". The strings
      # are snowplow's templates exactly: the path half of mux patterns "GET /refreshes" /
      # "POST /refreshes" (main.go) and rum.Path "/telemetry/v1/traces" (rum/handler.go).
      # snowplow gives the ingest route no Server span today (tracing/server.go unspannedRoutes),
      # so that half is a guard: it also covers a RUM krateo.widget.fetch naming it.
      # The third: abandoned interactions are EXCLUDED from the SLIs per acmp's X5 span contract,
      # not counted as errors. They stay in otel_traces (this pipeline gets its own copy of each
      # span). acmp's abandoned_flag_selfcheck watches the abandoned share against its 7-day
      # baseline, so a frontend bug that marks real slowness as abandoned cannot silently improve
      # p95. SNOWPLOW DEPENDENCY: snowplow PR #1061 (Fixes #1060, in review, expected in snowplow
      # 1.12.65) forwards the key only as a typed bool `true` (AnyValue_BoolValue), and only on
      # krateo.composition.open, krateo.form.submit and krateo.page.publish; it drops false,
      # strings, numbers and arrays. The comparison is against the BOOL true, so it matches exactly
      # what snowplow forwards. Until that release no span carries the key and this rule matches
      # nothing, which is harmless.
      # error_mode ignore: these conditions only compare fields and cannot error in practice; if one
      # ever did, the span would be KEPT, and the connector's aggregation_cardinality_limit below
      # still caps what that can cost.
      filter/slo-spans:
        error_mode: ignore
        traces:
          span:
            - >-
              not ((resource.attributes["service.name"] == "snowplow" and kind == SPAN_KIND_SERVER)
              or (resource.attributes["service.name"] == "krateo-frontend"
              and instrumentation_scope.name == "snowplow/rum-ingest"))
            - 'attributes["http.route"] == "/refreshes" or attributes["http.route"] == "/telemetry/v1/traces"'
            - 'attributes["krateo.interaction.abandoned"] == true'
      # Resource attributes are copied onto every span_metrics output by default in contrib
      # 0.158.0 (the connector.spanmetrics.excludeResourceMetrics gate is alpha, i.e. off), and the
      # connector also KEYS its aggregation on the full resource. Left alone, every pod restart and
      # every SDK resource detail would start new rows. Keeping only service.name collapses that:
      # one aggregate per service per node agent, and ServiceName still lands in its own column.
      # Safe because the temporality is DELTA (see span_metrics), where summing rows is correct
      # without any per-producer identity.
      # Browser spans (installer#405) reach this agent from snowplow's rum-ingest, not from the
      # browser, so k8sattributes associates them by connection with SNOWPLOW's pod and stamps
      # snowplow's k8s.*, pod labels and service.version on them: on krateo-057, browser spans
      # carried k8s.deployment.name=snowplow and service.version=1.12.67, snowplow's version. The
      # frontend sets only service.name on its resource (ui/src/otel/tracing.ts), so after
      # k8sattributes a krateo-frontend resource keeps only service.name. It runs before
      # loadbalancing, so the tail sampler and otel_traces never see the wrong pod.
      transform/browser-resource:
        error_mode: ignore
        trace_statements:
          - context: resource
            conditions:
              - 'attributes["service.name"] == "krateo-frontend"'
            statements:
              - 'keep_keys(attributes, ["service.name"])'
      transform/slo-resource:
        error_mode: ignore
        trace_statements:
          - context: resource
            statements:
              - 'keep_keys(attributes, ["service.name"])'
      # krateo.sli.error, the SLI's error flag, as an EXACT-VALUE attribute ("true"/"false") because
      # alert-provider labels cannot express a numeric range (>= 500). The rule (D3: 4xx is NOT an
      # error):
      #   "true"  when http.response.status_code >= 500;
      #   "true"  when the span has NO http.response.status_code and its status is ERROR (no
      #           response at all: abort, network failure, CORS);
      #   "false" otherwise, a 4xx included. This matters for RUM: the browser's fetch
      #           instrumentation sets status ERROR at >= 400, so status.code alone would count a
      #           404 as an error.
      # Only http.response.status_code is read, and that was VERIFIED, not assumed: snowplow's
      # otelhttp v0.69.0 uses semconv v1.41.0 and has no old-semconv (OTEL_SEMCONV_STABILITY_OPT_IN)
      # path, and snowplow's rum allowlist forwards only http.response.status_code. Nothing in scope
      # emits the old http.status_code. Every source sends it as an INT (otelhttp, snowplow's panic
      # handler, the rum rebuild); Int() also accepts a numeric string, and Int() of anything
      # unparseable is nil, whose comparison is false, so such a span reads "false" if it has a code.
      transform/slo-error:
        error_mode: ignore
        trace_statements:
          - context: span
            statements:
              - 'set(attributes["krateo.sli.error"], "false")'
              - >-
                set(attributes["krateo.sli.error"], "true")
                where attributes["http.response.status_code"] != nil
                and Int(attributes["http.response.status_code"]) >= 500
              - >-
                set(attributes["krateo.sli.error"], "true")
                where attributes["http.response.status_code"] == nil
                and status.code == STATUS_CODE_ERROR
      batch:
        send_batch_size: 10000
        timeout: 5s
      memory_limiter:
        check_interval: 5s
        limit_percentage: 80
        spike_limit_percentage: 25

    exporters:
      clickhouse:
        endpoint: "tcp://krateo-clickstack-clickhouse-clickhouse-headless.krateo-system.svc:9000"
        username: "${env:CH_USERNAME}"
        password: "${env:CH_PASSWORD}"
        database: default
        logs_table_name: otel_logs
        traces_table_name: otel_traces
        metrics_table_name: otel_metrics
        # create_schema:true creates otel_logs and otel_metrics_* (idempotent CREATE IF NOT
        # EXISTS). NOT otel_traces any more: traces leave this agent through `loadbalancing`
        # below, and the exporter creates a signal's tables only when that signal's exporter
        # starts, so otel-collector-tailsampling (>= 0.1.1) owns otel_traces now, with the same
        # 168h ttl. traces_table_name stays set but unused.
        create_schema: true
        # RETENTION — DO NOT REMOVE. Incident 2026-07: with no TTL the otel_* tables grew
        # unbounded and filled the 10Gi ClickHouse volume in 8 days → every insert failed
        # with code 243 (NOT_ENOUGH_SPACE) → this collector buffered and OOM-crash-looped →
        # telemetry dead. ttl: 168h stamps a native 7-day TTL into the CREATE TABLE the
        # exporter issues, so FRESH installs are bounded from day one. NOTE: create_schema
        # is CREATE ... IF NOT EXISTS — this ttl only applies at table CREATION; tables that
        # already exist (e.g. the live bench) were fixed with a live
        # `ALTER TABLE ... MODIFY TTL` (7 days) and are untouched by this setting.
        # Disk-size sibling fixes: krateo-observability 0.1.9 (15Gi volume + 3-day
        # system-log ttl via cluster.spec.settings.extraConfig).
        ttl: 168h
        timeout: 10s
        retry_on_failure:
          enabled: true
          initial_interval: 5s
          max_interval: 30s
          max_elapsed_time: 300s
      # A SECOND, NAMED instance for the Krateo audit record, so audit gets its OWN table and its
      # OWN retention instead of inheriting the 168h above, which is shared with every pod log on
      # the cluster. A 7-day audit trail that LOOKS like a working one is worse than none
      # (installer#407). Each signal's exporter creates only its own signal's tables at start(),
      # so two instances with different `ttl` values yield two tables with different retention --
      # read from the contrib exporter's source, not assumed.
      # JOINABILITY IS PRESERVED. snowplow's audit package rejects "an audit id-space parallel to
      # traceparent/trace_id" as un-joinable, and that objection is about the ID SPACE, not the
      # table: the Logs SDK stamps TraceId/SpanId as LogRecord FIELDS, so they are columns here
      # exactly as in otel_logs and still join to otel_traces.
      clickhouse/audit:
        endpoint: "tcp://krateo-clickstack-clickhouse-clickhouse-headless.krateo-system.svc:9000"
        username: "${env:CH_USERNAME}"
        password: "${env:CH_PASSWORD}"
        database: default
        logs_table_name: krateo_audit
        create_schema: true
        # 8760h = 365 days, Diego's retention decision on installer#407. Cost is not a factor:
        # the non-preview trail measures ~1.5 MiB/year. SAME CAVEAT as the sibling ttl above --
        # create_schema is CREATE ... IF NOT EXISTS, so this applies at table CREATION only.
        # krateo_audit does not exist yet, which is the one window in which this value is free;
        # once it does, changing it needs ALTER TABLE krateo_audit MODIFY TTL.
        ttl: 8760h
        timeout: 10s
        retry_on_failure:
          enabled: true
          initial_interval: 5s
          max_interval: 30s
          max_elapsed_time: 300s

      # TRACES LEAVE THIS AGENT FOR THE TAIL SAMPLER (installer#402, observability#118 step 2).
      # Tail sampling decides per FINISHED trace, so every span of a trace must reach the same
      # sampler replica whichever node produced it: the platform gateway and snowplow run on
      # different nodes. `loadbalancing` hashes TraceId over the replicas that the headless
      # Service's DNS returns, and re-resolves as they come and go.
      # Depends on otel-collector-tailsampling being installed. Both charts are pinned under the
      # installer's `portal` feature, so neither exists without the other; if either pin's feature
      # ever changes, this exporter would point at a Service that isn't there.
      # The SLIs are NOT routed here: traces/slo below still sees every span on this node.
      loadbalancing:
        routing_key: traceID
        protocol:
          otlp:
            timeout: 10s
            tls:
              insecure: true
            retry_on_failure:
              enabled: true
              initial_interval: 5s
              max_interval: 30s
              max_elapsed_time: 300s
        resolver:
          dns:
            hostname: otel-collector-tailsampling-opentelemetry-collector.krateo-system.svc.cluster.local
            # A STRING: the dns resolver's `port` is typed string, and an integer here fails config
            # decoding at startup on every node ("'port' expected type 'string'"). Caught by
            # tests/tailsampling-route-docker.py; helm lint and the component check both pass it.
            port: "4317"

    connectors:
      # SLO SPAN METRICS (D5). Turns the spans kept by filter/slo-spans into a call counter and a
      # duration histogram, written by the SAME `clickhouse` exporter as every other metric, so they
      # land in otel_metrics_sum / otel_metrics_histogram. `span_metrics` is the name otelcol-contrib
      # 0.158.0 registers (`spanmetrics` survives only as a deprecated alias) -- read from
      # `otelcol-contrib components` on this exact image, not assumed.
      # Exact names as they land, for whoever writes the Metric CRs (also in docs/configuration.md):
      #   MetricName traces.span.metrics.calls    -> otel_metrics_sum       (monotonic counter)
      #   MetricName traces.span.metrics.duration -> otel_metrics_histogram (unit ms)
      #   Attributes: service.name, span.name, status.code, krateo.sli.error, plus http.route and
      #   http.response.status_code when the span carries them. ResourceAttributes: service.name.
      span_metrics:
        # Pinned to its default so a future default (or the legacyMetricNames gate, which only acts
        # on the default namespace) cannot silently rename the metrics the Metric CRs query.
        namespace: traces.span.metrics
        # DELTA, not the cumulative default. This connector runs once PER NODE: with cumulative
        # counters every agent's series would have to stay distinct (collector.instance.id) and every
        # query would need per-series diffs with reset handling across agent restarts. Delta rows
        # are the count for their own interval, so a window's total is a plain sum across rows and
        # agents, and a restart loses at most one unflushed interval instead of breaking a series.
        aggregation_temporality: AGGREGATION_TEMPORALITY_DELTA
        metrics_flush_interval: 60s
        # The four built-in dimensions are service.name, span.name, span.kind and status.code, and
        # 0.158.0 adds collector.instance.id by default (the includeCollectorInstanceID gate is beta).
        # span.kind is excluded because the filter already fixes it per service (SERVER for
        # snowplow), so it adds a column and no information. collector.instance.id is excluded
        # because under DELTA it only splits one aggregate into one row per node agent and per agent
        # restart. status.code (STATUS_CODE_UNSET / _OK / _ERROR) is KEPT.
        exclude_dimensions: [span.kind, collector.instance.id]
        # Raw values, no bucketing: a 4xx stays a 4xx. Whether a span is an error is krateo.sli.error
        # (transform/slo-error). Neither http.* key has a default, so a span without one (a snowplow
        # 404 no route serves) simply has no such attribute rather than an invented value.
        # On RUM spans both are browser-supplied but allowlisted by snowplow's rum-ingest: the route
        # on krateo.widget.fetch must be one snowplow serves, the page-level routes are only
        # shape-checked, and the status code is 100-599. The cap below is what bounds a hostile
        # client.
        dimensions:
          - name: http.route
          - name: http.response.status_code
          # Set on every span by transform/slo-error, so present on every row.
          - name: krateo.sli.error
        histogram:
          unit: ms
          # Fixed for a p95 that may sit anywhere from 50 ms to 10 s; NOT tuned to any target (the
          # targets are set at deploy time and never committed). The bucket bounds land in
          # ExplicitBounds as [25, 50, ..., 10000] (ms), plus the implicit +Inf bucket.
          explicit:
            buckets: [25ms, 50ms, 100ms, 250ms, 500ms, 750ms, 1s, 1500ms, 2500ms, 5s, 10s]
        # Circuit breaker per service per agent per interval, set above the loose bound in
        # docs/SLO.md (~1,400 for snowplow); past it, new combinations fold into one series marked
        # otel.metric.overflow=true instead of growing the table.
        aggregation_cardinality_limit: 2000

    service:
      pipelines:
        # `otlp` ON THE LOGS PIPELINE — DO NOT REMOVE. Without it an OTLP log export has NO
        # CONSUMER on this agent: the records leave the exporting process and are dropped here,
        # silently. snowplow's AuditEvent (internal/support/audit, D19a) is exactly such an
        # exporter — it emits the canonical Krateo audit record as an OTLP LogRecord aimed at
        # otel_logs — and that is why the snowplow chart ships OTEL_LOGS_ENABLED="false"
        # EXPLICITLY even with the OTEL_ENABLED master on: without the override the per-signal
        # gate would default to the master and the pipeline would export into a void.
        # The receiver itself is NOT declared in this chart's config.receivers — it comes from
        # the upstream opentelemetry-collector chart's defaults and is deep-merged in. Verified
        # on the LIVE agent ConfigMap rather than assumed: the rendered config carries
        # otlp.protocols.{grpc ${env:MY_POD_IP}:4317, http ${env:MY_POD_IP}:4318}, and snowplow
        # already dials http://$(HOST_IP):4318. The metrics and traces pipelines have referenced
        # `otlp` all along and run clean, which is the empirical proof the receiver resolves.
        logs:
          receivers: [filelog]
          processors: [memory_limiter, k8sattributes, transform, batch]
          exporters: [clickhouse]
        # THE AUDIT PIPELINE, deliberately SEPARATE from `logs` above rather than adding `otlp`
        # to it. Without an otlp-fed logs pipeline somewhere, an OTLP log export has NO CONSUMER
        # on this agent: the records leave the exporting process and are dropped here, silently.
        # That is why the snowplow chart ships OTEL_LOGS_ENABLED="false" EXPLICITLY even with the
        # OTEL_ENABLED master on, and its package doc calls the gap "entirely collector-side".
        # WHY SEPARATE AND NOT `otlp` ON `logs`: one pipeline would mix the audit stream with
        # every pod log on every node, which then has to be un-mixed -- by a routing connector
        # (needs that component compiled into otelcol-krateo, unverified) or by a pair of filter
        # processors (runs k8sattributes + transform TWICE over the pod-log firehose and discards
        # one copy). A receiver feeds only the pipelines that NAME it, so filelog -> `logs` and
        # otlp -> here keeps the streams apart at zero cost, with the pod-log hot path untouched.
        # Safe because snowplow is the ONLY component carrying an OTEL_LOGS_ENABLED knob --
        # verified, not assumed: absent from the installer schema, absent as direct env on every
        # workload, present in exactly one ConfigMap -- so OTLP logs have one producer. If a
        # second ever appears, gate THIS pipeline with a filter on event.name=="audit" rather
        # than letting foreign records land in krateo_audit.
        # THE PROCESSOR LIST IS DELIBERATELY IDENTICAL, `transform` INCLUDED. It reads as
        # filelog-specific because it strips ANSI escapes from body, but it also carries
        # `replace_pattern(body, "eyJ[A-Za-z0-9._-]{20,}", "<REDACTED-JWT>")` -- the JWT
        # redaction. Dropping it here would bypass that control on the one stream most likely to
        # carry identity, on a platform that has already had to purge 384 leaked bearer tokens
        # from otel_traces. Its other statements are inert for these records: there is no ANSI in
        # an audit body, and the composition-id copy is guarded `where ... != nil`.
        logs/audit:
          receivers: [otlp]
          processors: [memory_limiter, k8sattributes, transform, filter/audit-only, batch]
          exporters: [clickhouse/audit]
        # The gateway access logs' own home: same otlp receiver, inverse filter, and the 7-day
        # `clickhouse` exporter (otel_logs) rather than the 365-day krateo_audit. Without this
        # pipeline the filter above would DELETE them; they are the only per-request record of
        # the LLM and MCP hops, carrying jwt.sub, team, gen_ai.* token counts, mcp.* and the
        # per-request http.*, so they belong with the other logs, not in the audit trail and
        # not nowhere. `transform` is kept: these records are the ones most likely to carry a
        # token in an attribute, and 1,568 of the 2,483 measured carry a 176-192 character
        # mcp.session.id -- AES-256-GCM ciphertext, not a credential (see installer#394), but
        # the sweep costs nothing and the next attribute added here is not guaranteed to be
        # as harmless.
        logs/gateway:
          receivers: [otlp]
          processors: [memory_limiter, k8sattributes, transform, filter/not-audit, batch]
          exporters: [clickhouse]
        # KOS-1 #112 bug #2: wire OTLP metrics -> ClickHouse. The reconcile RED suite
        # (unstructured_runtime.reconcile.*) + the kagent GenAI token metrics arrive as OTLP on the
        # node-local agent's otlp receiver (same one the traces pipeline below uses); without it in
        # this pipeline they had no consumer and never reached otel_metrics_*.
        metrics:
          receivers: [hostmetrics, kubeletstats, otlp]
          processors: [memory_limiter, filter/pvc-volumes, k8sattributes, batch]
          exporters: [clickhouse]
        # KOS-1 #112 bug #1: wire OTLP traces -> ClickHouse. Apps/agents send OTLP spans to the
        # node-local agent (status.hostIP:4317 grpc / :4318 http, from chart-default otlp receiver);
        # previously the traces pipeline exported to debug only (chart default) so nothing landed
        # and otel_traces was never created. jaeger/zipkin receiver defaults stay defined-but-unused
        # (the collector ignores unreferenced receivers), so no need to null them.
        traces:
          receivers: [otlp]
          # `transform` runs the trace_statements above (drop Authorization header + redact JWTs) BEFORE
          # batch/export, so no caller JWT reaches otel_traces (#122). k8sattributes runs HERE, on the
          # node, because it associates spans with pods by the sender's IP, which the tail sampler
          # would not see. Then `loadbalancing` hands each trace to its tail-sampler replica, which
          # writes the kept ones to otel_traces. transform/browser-resource undoes k8sattributes'
          # snowplow-pod guess on browser spans, which snowplow forwards.
          processors: [memory_limiter, k8sattributes, transform/browser-resource, transform, batch]
          exporters: [loadbalancing]
        # SLO SPAN METRICS (D5): a SECOND consumer of the same otlp receiver. A receiver fans out to
        # every pipeline that names it, each getting its own copy, so the `traces` pipeline above is
        # byte-identical and every span still reaches otel_traces. This one keeps only the SLO spans
        # (filter first, so everything after it sees a handful of spans), redacts like `traces` does
        # (a token in http.route would otherwise reach a metric attribute), trims the resource, sets
        # krateo.sli.error, and hands the spans to the connector. No k8sattributes: no dimension
        # needs pod metadata.
        traces/slo:
          receivers: [otlp]
          processors: [memory_limiter, filter/slo-spans, transform, transform/slo-resource, transform/slo-error]
          exporters: [span_metrics]
        # The connector's output, through the same exporter (and so the same otel_metrics_* tables
        # and 168h TTL) as the `metrics` pipeline. Its own pipeline rather than a receiver on
        # `metrics`, which would run k8sattributes over these and change a pipeline that works.
        metrics/slo:
          receivers: [span_metrics]
          processors: [memory_limiter, batch]
          exporters: [clickhouse]
        # The gateways' scraped Prometheus metrics (OTEL-14(a)). Their own pipeline so the scrape
        # can't change the `metrics` pipeline, and no k8sattributes: the scrape's connection is the
        # collector itself, and the receiver already names the namespace and pod from discovery.
        metrics/agentgateway:
          receivers: [prometheus/agentgateway]
          processors: [memory_limiter, batch]
          exporters: [clickhouse]

  extraEnvs:
    - name: CH_USERNAME
      valueFrom:
        secretKeyRef:
          name: otel-clickhouse-credentials
          key: username
    - name: CH_PASSWORD
      valueFrom:
        secretKeyRef:
          name: otel-clickhouse-credentials
          key: password

  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 100m
      memory: 256Mi

  # Probe tolerances, passed through to the upstream opentelemetry-collector chart's
  # templates/_pod.tpl (org standard). The Kubernetes defaults (timeoutSeconds: 1,
  # failureThreshold: 3) kill HEALTHY pods under CPU contention — a slow-but-alive
  # health reply counts as a failure and the resulting restart storm worsens the
  # contention. Liveness is lenient so only a truly dead process dies: implicit
  # periodSeconds default 10 x 6 failures = 60s of continuous failure before restart.
  livenessProbe:
    timeoutSeconds: 5
    failureThreshold: 6
  # Readiness keeps prompt endpoint removal (failureThreshold: 3, implicit 10s period)
  # but timeoutSeconds: 5 keeps load alone from flapping the endpoint in and out.
  readinessProbe:
    timeoutSeconds: 5
    failureThreshold: 3
