apiVersion: v2
name: otel-collector-daemonset
description: >-
  Node-level OpenTelemetry collector (daemonset mode) for Krateo. Wraps the
  upstream opentelemetry-collector chart to collect pod logs, host metrics,
  kubelet metrics and OTLP traces and export them to ClickHouse.
type: application
# 0.1.6: explicit lenient probe tolerances + Quantity (integer|string) resources typing in
# values.schema.json.
# 0.1.5: clickhouse exporter ttl: 168h — 7-day retention stamped into freshly created otel_*
# tables (retention incident: 10Gi filled in 8 days → insert code 243 → collector OOM loop).
# 0.1.7: bump opentelemetry-collector dep 0.158.1 → 0.170.0 (collector 0.153.0 → 0.158.0). The
# breaking value renames in that range are NOT set by this wrapper — verified by a clean render
# against 0.170.0's strict values.schema.json. Also repoints the dead-org icon to the canonical asset.
# 0.1.8: rewriteDeprecatedComponentNames=false (parity with the deployment; canonical component names).
# 0.1.9: SECURITY (#122) — the traces pipeline now runs a `transform` redaction that drops the
# http.header.Authorization span attr and strips JWTs (eyJ…) from exception/error/status messages
# before export, so the upstream kagent-tools JWT-in-span leak can't persist caller tokens into otel_traces.
# 0.1.10: SECURITY (#122) — the same redaction on the LOGS pipeline: the agent's pod stdout carries
# the same `--token eyJ…`, and filelog puts the whole line in the log body, so otel_logs kept the
# token while otel_traces was already clean.
# 0.1.11: give the Krateo audit record a DEDICATED logs pipeline and its OWN ClickHouse table.
# Adds a `logs/audit` pipeline (receivers [otlp] -> exporters [clickhouse/audit]) plus a second
# named exporter instance writing `krateo_audit` with ttl 8760h (365d, Diego's decision on
# installer#407). The main `logs` pipeline is BYTE-IDENTICAL to before -- filelog only -- so the
# pod-log hot path is untouched; the whole diff is two additions.
# Before this, an OTLP log export had no consumer on this agent and was dropped silently, which
# is why the snowplow chart ships OTEL_LOGS_ENABLED="false" EXPLICITLY even with the OTEL_ENABLED
# master on. Prerequisite for the server-authored audit record (installer#408); the flag flip is
# a snowplow-chart change and is NOT part of this.
# A separate pipeline rather than `otlp` on `logs`: mixing audit with every pod log would then
# need un-mixing, by a routing connector (component unverified in otelcol-krateo) or by paired
# filter processors (double-processing the firehose). A receiver feeds only the pipelines naming
# it, so separation is free. Safe because snowplow is the ONLY component with an
# OTEL_LOGS_ENABLED knob, verified three ways.
# `transform` is kept on the audit pipeline ON PURPOSE: it carries the <REDACTED-JWT>
# replace_pattern, and dropping it would bypass JWT redaction on the stream most likely to carry
# identity -- on a platform that has already purged 384 leaked bearer tokens from otel_traces.
# NOTE this chart no longer needs the separate-table work to land first: it IS that work. The
# remaining sequencing constraint is only that OTEL_LOGS_ENABLED stays false until this ships.
# 0.1.13: PARTITION the OTLP log stream -- krateo_audit had acquired a SECOND producer, which
# 0.1.11's own note said to guard against ("If a second ever appears, gate THIS pipeline with a
# filter on event.name==\"audit\""). MEASURED on krateo-057 2026-10-22: of 2,493 krateo_audit rows,
# 10 were snowplow audit records and 2,483 were the AGENT GATEWAY's access log, which had no other
# destination because `logs/audit` is the only otlp-fed logs pipeline here. Two harms, both real:
# every audit consumer had to remember a ScopeName predicate or count 2,493 "audit records" where
# there are 10 (and installer#415's userAccessFilter matches zero rows in whichever population it
# was not written for, while still returning a result -- on an audit view that fails toward
# disclosure); and krateo_audit's 365d TTL was retaining gateway access logs 52x longer than the
# pod logs they belong with.
# The fix is a pair of complementary `filter` processors and a THIRD pipeline, not a drop: a
# receiver feeds every pipeline that NAMES it, so otlp fans out to `logs/audit` (keeps
# event.name=="audit", -> krateo_audit, 365d) and `logs/gateway` (keeps the complement, ->
# otel_logs, 7d). Exact and total partition; the gateway records are preserved at the right
# retention rather than deleted. The paired-filter objection in 0.1.11's note does NOT apply --
# that was about adding otlp to `logs` and re-processing every pod log on every node; this
# double-processes ~1.2k OTLP records/day and never touches the filelog firehose.
# `filter` IS compiled into the running image -- verified with `otelcol-contrib components` on a
# live agent pod BEFORE writing this, not inferred from "it's contrib". That check exists because
# otel-collector-deployment 0.3.9 added `transform` to a chart whose custom image lacks it and
# crash-looped 057: `helm template` renders an invalid component reference perfectly cleanly, and
# only the collector validates its own component set, at startup.
# 0.1.12: SECURITY (installer#396) — redact by SWEEPING attribute VALUES, not by naming keys.
#   The per-key statements added in 0.1.9/0.1.10 were measured on krateo-057 and still leaked: 22
#   spans in otel_traces carried a raw JWT, every one of them in `http.path`, on spans named
#   `GET /events/*` and `GET krateo-sse-proxy...:8080`. The list could not catch it because nobody
#   had thought of that key — which is the flaw in enumerating keys, not a missing entry. All three
#   contexts (log, span, spanevent) now also run
#   `replace_all_patterns(attributes, "value", "eyJ[A-Za-z0-9._-]{20,}", "<REDACTED-JWT>")`.
#   This also closes a gap on the LOGS side: before this, log bodies were redacted and log
#   ATTRIBUTES were not. The enumerated statements are kept — delete_key removes the Authorization
#   header rather than redacting it, and status.message is not an attribute so the sweep misses it.
#   BACKSTOP, not a fix: the root cause is installer#395, the events bell putting the bearer token
#   in the URL because EventSource cannot set headers. This stops the token reaching ClickHouse; it
#   does not stop the browser sending it in a URL, where any proxy or access log can still record it.
# 0.1.14: metadata only -- `sources` names this repo by its current name, krateo-platformops/observability
# (was the old clickstack-chart, which only redirects). Bumped so the next tag does not overwrite
# 0.1.13 with different metadata: consumers cache by version (see krateo-observability 0.1.3).
# 0.1.15: SLO span metrics. Performance alerts are built from the span_metrics connector, so
# this agent gains a SECOND consumer of its otlp receiver: `traces/slo` keeps only snowplow SERVER
# spans and krateo-frontend spans from the `snowplow/rum-ingest` scope, and feeds them to
# `span_metrics`, whose output (`metrics/slo`) goes out through the existing `clickhouse` exporter
# as traces.span.metrics.calls (otel_metrics_sum) and traces.span.metrics.duration
# (otel_metrics_histogram, ms, explicit buckets 25ms..10s). The `traces` pipeline is BYTE-IDENTICAL
# -- the receiver fans out, nothing is diverted. DELTA temporality, because the connector runs once
# per node and delta rows sum across agents and restarts with no per-series reset logic.
# span_metrics and filter are both compiled into otelcol-contrib 0.158.0 -- read from
# `otelcol-contrib components` on that exact image, and the rendered config passes
# `otelcol-contrib validate` -- because helm template cannot catch a missing component (0.3.9 of
# the deployment chart). Dimensions, buckets and the series bound: docs/SLO.md.
# Also in 0.1.15: the SLI pipeline drops /refreshes and /telemetry/v1/traces and adds the
# krateo.sli.error dimension ("true" for >= 500 or no code with status ERROR; 4xx is "false"),
# because alert-provider labels match exact Attribute values and cannot say NOT or >= (raised by the
# CMP team).
# appVersion "0.1.0" -> "0.158.0". For a wrapper chart appVersion names the app it deploys (as
# krateo-observability's 3.2.0 names ClickStack), and "0.1.0" matched neither our tags nor the
# image. 0.158.0 is the collector this chart RENDERS: the wrapper sets only image.repository, and
# the upstream opentelemetry-collector 0.170.0 template takes `image.tag | default .Chart.AppVersion`
# from ITS OWN Chart.yaml (appVersion 0.158.0) -> otel/opentelemetry-collector-contrib:0.158.0.
# Metadata only: the wrapper's appVersion does not feed that template, so the image is unchanged.
# Keep the two equal when the dependency is bumped.
# 0.1.16: the SLI pipeline also drops spans with krateo.interaction.abandoned == true (bool):
# abandoned interactions are EXCLUDED from the SLIs per the CMP team's span contract for the
# performance SLOs, not counted as errors, and stay in otel_traces. The CMP team's abandoned-flag
# self-check watches the abandoned share against its 7-day baseline, so a frontend bug marking real
# slowness as abandoned cannot silently improve p95. Depends on snowplow #1061 (Fixes #1060,
# expected in 1.12.65), which forwards the key only as bool true on krateo.composition.open /
# form.submit / page.publish; until then it matches nothing. The traces/logs/metrics pipelines are
# unchanged.
# 0.1.17: #54 — filelog promotes `level` or `severity_text`, and a W3C `trace_id` with `span_id`, from
# JSON log lines into SeverityText, SeverityNumber, TraceId and SpanId. Body stays the raw line and
# LogAttributes are unchanged, because the parsed copy is scratch space removed in the receiver.
# SeverityText is upper-cased in the filelog operators, not in `transform`, so logs/audit is untouched.
# Non-JSON lines are unchanged. TraceId stays empty for snowplow until snowplow#1184 moves its
# request-path WARN/ERROR sites to the *Context calls that stamp trace_id.
# 0.1.18: JWT redaction on log bodies targets body.string, so it also covers a map body on the OTLP
# arms, logs/audit included. Every OTLP body on krateo-057 is a string today, so nothing leaked and
# no record changes until one matches.
# 0.1.19: kubeletstats emits k8s.volume.available and k8s.volume.capacity for PersistentVolumeClaims,
# which a storage headroom alert needs (installer#393). Other volume types are filtered out, and the
# inode metrics stay off. Adds 2 series per claim, 14 on krateo-057. Every other metric is unchanged.
# 0.1.20: the traces pipeline exports to otel-collector-tailsampling through a TraceId-keyed
# `loadbalancing` exporter instead of straight to ClickHouse (installer#402, observability#118 step 2).
# Requires otel-collector-tailsampling >= 0.1.1, which now owns otel_traces; pin it FIRST. The
# traces/slo pipeline is unchanged, so the SLIs still count every span. Logs and metrics unchanged.
# 0.1.21: adds a NODE-LOCAL Service, <release>-local (ClusterIP, internalTrafficPolicy: Local, OTLP 4317/4318),
# for senders that can only be given a Service name: the composition-dynamic-controllers, whose tracing
# Diego turned on for the audit-to-reconcile join (installer#400). The upstream Service is headless, which ignores
# internalTrafficPolicy, so spans could land on another node's agent and go unenriched by its
# node-filtered k8sattributes. Additive: nothing else changes.
# 0.1.25: the trace transform deletes agent CONTENT before it leaves the node: kagent's
# gcp.vertex.agent.{tool_response,tool_call_args,llm_request,llm_response} and gen_ai prompt/completion/
# message keys, on spans and span events (Diego, 2026-11-10: strip all content, keep kagent.user_id).
# Ships BEFORE kagent agent tracing is switched on. tests/agent-content-keys-docker.py runs it.
# 0.1.26: the span-metrics duration histogram gains a 2000 ms boundary, so the UI
# page-load objective (p95 <= 2000 ms) is decidable instead of falling in (1500, 2500]. A layout
# change: krateo-slo-rollup keeps rows per bounds and reports no p95 over a window that spans both
# layouts, so a 30-day p95 that includes the change day is unavailable until the window passes
# (krateo-slo-rollup isn't deployed on krateo-057 today). HyperDX and alert quantiles read bounds per row.
# 0.1.27: the gateway's AUDIT COPY (observability#138). logs/gateway-audit projects the agent
# gateway's acting hops (A2A calls, MCP tools/call/resources/read/prompts/get, LLM completions) from
# its OTLP access log into krateo_audit as writer `gateway` of krateo-platformops/audit schema v1,
# scope github.com/krateo-platformops/observability/gateway-audit. logs/gateway still writes every
# access-log record to otel_logs unchanged. Session plumbing (initialize, */list, notifications, SSE,
# agent cards, model listing) and requests that matched no route are excluded on an EXPLICIT list in
# transform/gateway-audit-classify and counted (krateo.gateway_audit.excluded in otel_metrics_sum, by
# protocol and method); an MCP method on neither list is projected, never dropped. Needs the access
# log's audit facts from agentgateway-policies >= 0.2.28 for complete records; with older facts a
# record is still written and marks what it lacks. Volume on krateo-057: ~2,260 acting hops a week,
# ~118K rows a year, ~16 MB a year at krateo_audit's measured 140 B/row (365-day TTL), against
# 8.3 GiB free; 1 GiB a year would take ~60x today's agent traffic. tests/gateway-audit-docker.py.
# 0.1.28: gateway-audit COUNTS every gateway record it does not project, not only the explicit
# exclude list. The kagent dashboard's REST writes cross the gateway as protocol `http` on the
# kagent-controller route and were neither projected nor counted. They stay unprojected (audited at
# kagent, kagent#31, snowplow's ruling) but now land in krateo.gateway_audit.excluded, which also
# gains a `route` attribute. No record changes in krateo_audit or otel_logs.
# 0.1.30: logs/gateway keeps ONLY the agent gateway's access log (filter/gateway-access-log: scope
# `request` with a `gateway` field) instead of every non-audit OTLP log. core-provider 2.13.95 with
# core-provider.otel.logs on exports the WHOLE slog stream of core-provider and of every
# composition controller over OTLP, audit records among them; the old complement filter would have
# copied those pod logs into otel_logs a second time (filelog already has them). Audit records still
# reach krateo_audit through logs/audit (attribute event.name == "audit", which audit v0.13.0+ sets
# alongside the LogRecord EventName). No change today: the gateway is the only non-audit OTLP log
# producer on krateo-057 (otel_logs, 7 days). tests/otlp-log-routing-docker.py.
# Also a comment fix in transform/slo-error: an aborted widget fetch is no longer exported (frontend
# 1.8.44), so it is no longer listed among the no-status ERROR spans; the rule is unchanged.
# 0.1.31: readinessProbe.initialDelaySeconds: 10. The first readiness probe ran at container start,
# before the health_check extension listens (it is ready 2.6-5.0s in), so every new pod logged one
# "Readiness probe failed ... connection refused" Unhealthy event (14 per roll on krateo-057) and
# became Ready at the 10s probe regardless. Same Ready time, no failing probe. No other change.
# 0.1.32: comments only: neutral wording in comments (no internal ids or private repo
# references); no rendered object changes.
# 0.1.33: comments only: neutral wording (no internal work-item or plan ids);
# no rendered object changes.
# 0.1.34: only the OTLP ports. Upstream's default jaeger (6831, 14250, 14268) and zipkin (9411)
# receivers were declared but named by no pipeline, so the agent never started them and their
# container ports, hostPorts and Service ports refused every connection. Those four ports are
# enabled: false, and the two receivers are left out of the config by this chart's own ConfigMap
# template (templates/configmap.yaml, the design otel-collector-deployment 0.3.21 uses: configMap.create
# false + existingName, its own checksum/config, the same under Helm 3 and 4), so a pipeline that
# later names one cannot start a receiver no port reaches. A value set at either path is kept.
# Every other receiver stays, the prometheus self-scrape included; otlp 4317/4318 stay on all three.
# The config changes by those two receivers only, so checksum/config changes and the pods roll once.
# 0.1.35: upstream's default prometheus receiver, a self-scrape of the collector's own telemetry
# on :8888, is left out of the config too, the same way: declared but named by no pipeline, so the
# agent never started it. Only while it still equals upstream's default: a prometheus receiver set
# under config (a scrape config of your own) is kept, and prometheus/agentgateway is a different id.
# Template only, no values change. The config loses that one receiver, so checksum/config changes
# and the pods roll once. tests/collector-helm4-render.py now fails, in every collector chart, on
# a declared receiver no pipeline names, or an extension missing from service.extensions.
# The rule for leaving a default receiver out is: it equals upstream's default AND no pipeline
# names it (an extension: service.extensions does not name it). So naming prometheus, jaeger or
# zipkin in a pipeline without configuring it keeps upstream's default receiver instead of leaving
# the pipeline pointing at an undeclared one, which the collector refuses at startup. The same rule
# is in otel-collector-deployment 0.3.23 and otel-collector-tailsampling 0.1.17.
# 0.1.36: reads agentgateway >= 1.6's access log as well as < 1.6's. 1.6 renamed its OTLP scope
# `request` -> `agentgateway.access` (upstream #3430) and its HTTP keys to OTel semconv (#3182):
# http.method -> http.request.method, http.status -> http.response.status_code, src.addr ->
# client.address (no port), http.host -> server.address, http.path -> url.path (+ url.query),
# http.version -> network.protocol.version. On 0.1.35 a 1.6+ gateway's access log would have been
# dropped by filter/gateway-access-log, and krateo_audit would have got no gateway rows, with no
# error. Now otel_logs takes both scopes AS SENT, and the two gateway-audit pipelines adapt a 1.6+
# record to the < 1.6 names on entry (transform/gateway-audit-classify), so classification, the
# excluded count's http.method dimension and the projection are unchanged; three of the new keys are
# projection outputs, so they are deleted there, before anything reads them. The TCP peer in
# krateo.request.source_ips keeps a bare IPv6 client.address whole (the old ":[0-9]+$" strip would
# cut fd00::5 to fd00:). On a < 1.6 gateway nothing changes: every new statement is conditioned on
# the new scope, and the peer rules give the same result for ip:port and [v6]:port.
# tests/gateway-audit-docker.py runs every case in both shapes and requires the same projected
# records and the same excluded counts; tests/otlp-log-routing-docker.py routes a 1.6+ record.
# The config changes, so checksum/config changes and the agents roll once.
# 0.1.37: the agent checkpoints its log positions (presets.logsCollection.storeCheckpoints), so a
# restart no longer drops the container log lines written meanwhile. NEW: a hostPath
# /var/lib/otelcol on every node, and the container runs as root with every capability dropped, a
# read-only root filesystem and no privilege escalation (it ran as the image's own user). Data in
# the in-memory export queue is still lost if the agent is killed rather than stopped.
# 0.1.38: auditCollector (OFF by default; off, the render is 0.1.37's). A two-copy Deployment behind
# one Service for audit records, its config cut out of the agents' own rendered config, so a collector
# roll, a drain or a pod deletion no longer drops records from senders that do not retry a refused
# connection. A crash still can. Nothing uses it until a sender's OTLP logs endpoint points at it.
# Also corrects service-local.yaml's comment: senders do not all retry while an agent restarts.
# 0.1.39: CHILD MODE, for a cluster that cannot run the daemonset (a vcluster child enforces the
# baseline Pod Security Standard, which refuses hostPath and hostPort, and a node's files and kubelet
# belong to other tenants). opentelemetry-collector.mode: deployment selects it; no new value, so no
# schema default reaches an existing instance. The chart then renders a one-replica Deployment with no
# hostPath, hostPort or hostNetwork, and prunes filelog, hostmetrics, kubeletstats, the pipelines they
# alone fed, and the ${env:K8S_NODE_NAME} node selector from the agentgateway scrape. A deployment
# with logsCollection, hostMetrics or kubeletMetrics still on FAILS to render and names the fix. The
# OTLP receivers and every OTLP pipeline stay, logs/audit and its clickhouse/audit exporter (which
# creates krateo_audit) included. New in child mode only: pipeline logs/otlp-pods, so an app's OTLP
# logs reach otel_logs, with filter/otlp-pods dropping what logs/audit and logs/gateway already take.
# The Service <release>-local selects the Deployment's pods (component standalone-collector, not
# agent-collector) with internalTrafficPolicy Cluster. The block to set: docs/configuration.md.
# ALSO in the daemonset, and in every mode: receiver prometheus/clickhouse and pipeline
# metrics/clickhouse scrape ClickHouse's own Prometheus port (:9363) for
# ClickHouseAsyncMetrics_FilesystemMainPath(Available|Total)Bytes, so the disk-headroom alert has a
# source that needs no kubelet (krateo-observability 0.1.60 switches the alert to it). The daemonset
# agent that runs on ClickHouse's node scrapes it (a spec.nodeName selector), one sample set per
# minute. The ONLY change to a daemonset render is those two entries and the config checksum, so
# every agent rolls once. Added value paths: opentelemetry-collector.config.receivers.prometheus/clickhouse
# and config.service.pipelines.metrics/clickhouse; none renamed or removed.
version: 0.1.39
appVersion: "0.158.0"
dependencies:
  - name: opentelemetry-collector
    version: 0.170.0
    repository: https://open-telemetry.github.io/opentelemetry-helm-charts
home: https://krateo.io
icon: https://raw.githubusercontent.com/krateo-platformops/.github/main/brand/logo.svg
keywords:
  - krateo
  - platformops
  - opentelemetry
  - observability
sources:
  - https://github.com/krateo-platformops/observability
  - https://github.com/krateo-platformops/otel-collector
