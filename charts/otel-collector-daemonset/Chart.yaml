apiVersion: v2
name: otel-collector-daemonset
description: >-
  Node-level OpenTelemetry collector (daemonset mode) for Krateo. Wraps the
  upstream opentelemetry-collector chart to collect pod logs, host metrics,
  kubelet metrics and OTLP traces and export them to ClickHouse.
type: application
# 0.1.6: explicit lenient probe tolerances + Quantity (integer|string) resources typing in
# values.schema.json.
# 0.1.5: clickhouse exporter ttl: 168h — 7-day retention stamped into freshly created otel_*
# tables (retention incident: 10Gi filled in 8 days → insert code 243 → collector OOM loop).
# 0.1.7: bump opentelemetry-collector dep 0.158.1 → 0.170.0 (collector 0.153.0 → 0.158.0). The
# breaking value renames in that range are NOT set by this wrapper — verified by a clean render
# against 0.170.0's strict values.schema.json. Also repoints the dead-org icon to the canonical asset.
# 0.1.8: rewriteDeprecatedComponentNames=false (parity with the deployment; canonical component names).
# 0.1.9: SECURITY (#122) — the traces pipeline now runs a `transform` redaction that drops the
# http.header.Authorization span attr and strips JWTs (eyJ…) from exception/error/status messages
# before export, so the upstream kagent-tools JWT-in-span leak can't persist caller tokens into otel_traces.
# 0.1.10: SECURITY (#122) — the same redaction on the LOGS pipeline: the agent's pod stdout carries
# the same `--token eyJ…`, and filelog puts the whole line in the log body, so otel_logs kept the
# token while otel_traces was already clean.
# 0.1.11: give the Krateo audit record a DEDICATED logs pipeline and its OWN ClickHouse table.
# Adds a `logs/audit` pipeline (receivers [otlp] -> exporters [clickhouse/audit]) plus a second
# named exporter instance writing `krateo_audit` with ttl 8760h (365d, Diego's decision on
# installer#407). The main `logs` pipeline is BYTE-IDENTICAL to before -- filelog only -- so the
# pod-log hot path is untouched; the whole diff is two additions.
# Before this, an OTLP log export had no consumer on this agent and was dropped silently, which
# is why the snowplow chart ships OTEL_LOGS_ENABLED="false" EXPLICITLY even with the OTEL_ENABLED
# master on. Prerequisite for the server-authored audit record (installer#408); the flag flip is
# a snowplow-chart change and is NOT part of this.
# A separate pipeline rather than `otlp` on `logs`: mixing audit with every pod log would then
# need un-mixing, by a routing connector (component unverified in otelcol-krateo) or by paired
# filter processors (double-processing the firehose). A receiver feeds only the pipelines naming
# it, so separation is free. Safe because snowplow is the ONLY component with an
# OTEL_LOGS_ENABLED knob, verified three ways.
# `transform` is kept on the audit pipeline ON PURPOSE: it carries the <REDACTED-JWT>
# replace_pattern, and dropping it would bypass JWT redaction on the stream most likely to carry
# identity -- on a platform that has already purged 384 leaked bearer tokens from otel_traces.
# NOTE this chart no longer needs the separate-table work to land first: it IS that work. The
# remaining sequencing constraint is only that OTEL_LOGS_ENABLED stays false until this ships.
# 0.1.13: PARTITION the OTLP log stream -- krateo_audit had acquired a SECOND producer, which
# 0.1.11's own note said to guard against ("If a second ever appears, gate THIS pipeline with a
# filter on event.name==\"audit\""). MEASURED on krateo-057 2026-10-22: of 2,493 krateo_audit rows,
# 10 were snowplow audit records and 2,483 were the AGENT GATEWAY's access log, which had no other
# destination because `logs/audit` is the only otlp-fed logs pipeline here. Two harms, both real:
# every audit consumer had to remember a ScopeName predicate or count 2,493 "audit records" where
# there are 10 (and installer#415's userAccessFilter matches zero rows in whichever population it
# was not written for, while still returning a result -- on an audit view that fails toward
# disclosure); and krateo_audit's 365d TTL was retaining gateway access logs 52x longer than the
# pod logs they belong with.
# The fix is a pair of complementary `filter` processors and a THIRD pipeline, not a drop: a
# receiver feeds every pipeline that NAMES it, so otlp fans out to `logs/audit` (keeps
# event.name=="audit", -> krateo_audit, 365d) and `logs/gateway` (keeps the complement, ->
# otel_logs, 7d). Exact and total partition; the gateway records are preserved at the right
# retention rather than deleted. The paired-filter objection in 0.1.11's note does NOT apply --
# that was about adding otlp to `logs` and re-processing every pod log on every node; this
# double-processes ~1.2k OTLP records/day and never touches the filelog firehose.
# `filter` IS compiled into the running image -- verified with `otelcol-contrib components` on a
# live agent pod BEFORE writing this, not inferred from "it's contrib". That check exists because
# otel-collector-deployment 0.3.9 added `transform` to a chart whose custom image lacks it and
# crash-looped 057: `helm template` renders an invalid component reference perfectly cleanly, and
# only the collector validates its own component set, at startup.
# 0.1.12: SECURITY (installer#396) — redact by SWEEPING attribute VALUES, not by naming keys.
#   The per-key statements added in 0.1.9/0.1.10 were measured on krateo-057 and still leaked: 22
#   spans in otel_traces carried a raw JWT, every one of them in `http.path`, on spans named
#   `GET /events/*` and `GET krateo-sse-proxy...:8080`. The list could not catch it because nobody
#   had thought of that key — which is the flaw in enumerating keys, not a missing entry. All three
#   contexts (log, span, spanevent) now also run
#   `replace_all_patterns(attributes, "value", "eyJ[A-Za-z0-9._-]{20,}", "<REDACTED-JWT>")`.
#   This also closes a gap on the LOGS side: before this, log bodies were redacted and log
#   ATTRIBUTES were not. The enumerated statements are kept — delete_key removes the Authorization
#   header rather than redacting it, and status.message is not an attribute so the sweep misses it.
#   BACKSTOP, not a fix: the root cause is installer#395, the events bell putting the bearer token
#   in the URL because EventSource cannot set headers. This stops the token reaching ClickHouse; it
#   does not stop the browser sending it in a URL, where any proxy or access log can still record it.
version: 0.1.13
appVersion: "0.1.0"
dependencies:
  - name: opentelemetry-collector
    version: 0.170.0
    repository: https://open-telemetry.github.io/opentelemetry-helm-charts
home: https://krateo.io
icon: https://raw.githubusercontent.com/krateo-platformops/.github/main/brand/logo.svg
keywords:
  - krateo
  - platformops
  - opentelemetry
  - observability
sources:
  - https://github.com/krateo-platformops/clickstack-chart
  - https://github.com/krateo-platformops/otel-collector
