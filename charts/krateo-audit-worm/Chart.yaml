apiVersion: v2
name: krateo-audit-worm
description: >-
  Tamper-evidence (WORM) for the Krateo audit trail. Hash-chains the audit rows
  the OTel collector writes to ClickHouse (krateo_audit) into an append-only seal
  chain, and continuously verifies it so any retroactive edit or delete is
  detected.
type: application
# No appVersion: this chart ships no first-party image. The seal/verify logic
# lives in the chart's own ConfigMap and runs on the upstream ClickHouse client
# image, so the chart version IS the logic version.
# 0.1.5: comments and a schema description only (#106), naming alert-provider-crd as the Alert CRD's
# owner. Nothing rendered changes, so 0.1.4 stays pinned. A release refuses a published version
# whose contents differ, even by a comment, so this version has to move.
# 0.1.6: both alerts carry a one-sentence `description` in place of `message`. NEEDS
# alert-provider-crds with spec.description: an older CRD drops the field.
# 0.1.7: the ClickHouse client image is pinned by an exact tag, 24.8.14.39-alpine, the build the
# floating `24.8-alpine` gave 057's Jobs on 2026-11-11. Same image, so nothing that runs changes.
# 0.1.8: a failed ClickHouse query is an error, never an answer. seal.sh tested `[ "$(has T)" != "1" ]`,
# and `set -e` doesn't see a failure inside a test, so during 057's ClickHouse restart (2026-11-11
# 19:15Z) a refused connection was logged as "source table krateo_audit does not exist yet". The
# same shape guarded the chain RESET: one failed count on an unsealed chain would have restarted it
# from a reset genesis. Every answer is now assigned before it's tested, and has() refuses anything
# but 0 or 1. tests/verify-docker.sh checks an unreachable ClickHouse for both scripts, a really
# absent table as a control, and that no query runs inside a test.
version: 0.1.8
keywords:
  - audit
  - worm
  - tamper-evidence
  - clickhouse
  - observability
