apiVersion: v2
name: krateo-audit-worm
description: >-
  Tamper-evidence (WORM) for the Krateo audit trail. Hash-chains the audit rows
  the OTel collector writes to ClickHouse (krateo_audit) into an append-only seal
  chain, and continuously verifies it so any retroactive edit or delete is
  detected.
type: application
# No appVersion: this chart ships no first-party image. The seal/verify logic
# lives in the chart's own ConfigMap and runs on the upstream ClickHouse client
# image, so the chart version IS the logic version.
version: 0.1.2
keywords:
  - audit
  - worm
  - tamper-evidence
  - clickhouse
  - observability
