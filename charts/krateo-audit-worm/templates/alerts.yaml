{{- /*
  The two ways the chain stops being trustworthy. Alerts live here and not in
  krateo-observability's defaults because they only make sense where this chart is installed:
  the silent alert would fire forever on a cluster without a verifier.

  They match the verifier's JSON line and not SeverityNumber, which older daemonset charts leave
  empty. REQUIRES the Alert CRD, which alert-provider-crd owns, so this chart must install after it, or
  set alerts.enabled=false.
*/ -}}
{{- if .Values.alerts.enabled }}
{{- $verifier := printf "ServiceName = '%s' AND JSONExtractString(Body, 'attributes', 'service.name') = 'krateo-audit-verifier'" (include "krateo-audit-worm.name" .) }}
---
apiVersion: observability.krateo.io/v1alpha1
kind: Alert
metadata:
  name: {{ include "krateo-audit-worm.fullname" . }}-chain-not-ok
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "krateo-audit-worm.labels" . | nindent 4 }}
spec:
  displayName: "Audit chain failed verification"
  where: {{ printf "%s AND JSONExtractString(Body, 'attributes', 'krateo.audit.status') != 'ok'" $verifier | quote }}
  threshold: 1
  thresholdType: above
  interval: 1h
  description: "The audit log failed its integrity check, for example because it was tampered with or not sealed."
---
apiVersion: observability.krateo.io/v1alpha1
kind: Alert
metadata:
  name: {{ include "krateo-audit-worm.fullname" . }}-verifier-silent
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "krateo-audit-worm.labels" . | nindent 4 }}
spec:
  displayName: "Audit chain not verified this hour"
  where: {{ printf "%s AND JSONExtractString(Body, 'attributes', 'krateo.audit.status') = 'ok'" $verifier | quote }}
  threshold: 1
  thresholdType: below
  interval: 1h
  description: "The audit log has not been verified in the last hour."
{{- end }}
