apiVersion: v2
name: krateo-slo-rollup
description: >-
  Daily rollup of the SLI span metrics into ClickHouse (krateo_slo_daily), so a rolling 30-day SLO
  can be computed although every otel_* table keeps 7 days. Adds no ingest path and nothing to the
  insert path of the otel_metrics tables.
type: application
# No appVersion: this chart ships no first-party image. The DDL and the apply logic live in the
# chart's own ConfigMap and run on the upstream ClickHouse client image, so the chart version IS the
# logic version.
# 0.1.1: the client image is pinned by digest.
# 0.1.2: runs as krateo-observability's least-privilege `slo_rollup` user by default
# (clickhouse.credentialsSecret.name clickhouse-slo-rollup-credentials), not the collector's writer
# (otel-clickhouse-credentials). Its grants include ALTER TTL on the rollup table, so a ttlDays
# change now applies. The Secret must exist before the first CronJob run.
# 0.1.3: values.schema.json: rollup.ttlDays minimum 29 -> 31, so the TTL covers the 30-day window the
# canonical statements read (a value of 29 or 30 is now refused; the default 40 is unchanged). No
# rendered object changes for any value the new schema accepts. The README reads the table by the canonical
# SLI rules (the 30-day statements 30d-1..30d-3 of ops/slo-alert/sli-span-metrics.sql: percentiles
# as bucket intervals, no interpolation; one row per bucket layout; whole UTC days with FINAL) and
# no longer calls counts "about 5% sampled". The kind proof runs those statements; the chart's
# interpolating tests/rollup-query.sql is gone.
# 0.1.4: comments only: neutral wording in comments and the README (no internal ids or private
# repo references); no rendered object changes.
version: 0.1.4
keywords:
  - slo
  - rollup
  - clickhouse
  - observability
sources:
  - https://github.com/krateo-platformops/observability
