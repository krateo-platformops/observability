# otel-collector-daemonset's credential-header deletion (S1), run in the pinned collector image. The
# transform must drop every span, span-event and log attribute whose key names a credential header
# (authorization, proxy-authorization, cookie, set-cookie; any naming, any case) and keep the rest.
#
# A separate workflow, like check-tailsampling: lint.yaml is the org-wide canonical chart lint.

name: check-credential-keys

on:
  pull_request:
    paths:
      - "charts/otel-collector-daemonset/**"
      - "tests/credential-keys-docker.py"
      - ".github/workflows/check-credential-keys.yaml"
  push:
    branches: [main]
    paths:
      - "charts/otel-collector-daemonset/**"
      - "tests/credential-keys-docker.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  credentials:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.19.0
      - name: Install PyYAML
        run: pip install --quiet pyyaml
      - name: Add the dependency repository
        run: helm repo add open-telemetry https://open-telemetry.github.io/opentelemetry-helm-charts
      - name: Run the chart's transform on spans, events and logs carrying credential headers
        run: python3 tests/credential-keys-docker.py .
