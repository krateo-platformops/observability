# krateo-observability's HyperDX MongoDB credential: the rendered Secret, ConfigMap, Deployment and
# MongoDBCommunity user (no MONGO_URI in clickstack-config, every consumer on secretKeyRef, upstream's
# default password nowhere as a credential, the guards), then MongoDB in the image MCK runs, with the
# rendered init container and uri: it waits while the old password is in force and logs in after.
#
# A separate workflow, like check-tailsampling: lint.yaml is the org-wide canonical chart lint.

name: check-hyperdx-mongo-credential

on:
  pull_request:
    paths:
      - "charts/krateo-observability/**"
      - "tests/hyperdx-mongo-credential-docker.py"
      - ".github/workflows/check-hyperdx-mongo-credential.yaml"
  push:
    branches: [main]
    paths:
      - "charts/krateo-observability/**"
      - "tests/hyperdx-mongo-credential-docker.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  credential:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.19.0
      - name: Install PyYAML
        run: pip install --quiet pyyaml
      - name: Add the dependency repository
        run: helm repo add clickstack https://clickhouse.github.io/ClickStack-helm-charts
      - name: Render the credential wiring, then use the rendered uri against MongoDB 5.0.32
        run: python3 tests/hyperdx-mongo-credential-docker.py .
