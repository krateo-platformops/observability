# Publishes this repo's Helm charts on a release tag. The workflow itself is the org-wide reusable —
# this file supplies only the triggers, so "identical across every chart repo" becomes structural
# instead of a 137-line copy each repo has to keep in step by hand.
#
# The shared workflow also gates the publish on every chart-referenced image existing: a chart that
# names an image which was never published used to publish cleanly and then ImagePullBackOff on every
# install, with the symptom surfacing several layers from the cause
# (krateo-platformops/oasgen-provider#62).
name: release-oci

on:
  push:
    tags: ["[0-9]+.[0-9]+.[0-9]+"]
  workflow_dispatch:
    inputs:
      chart_version:
        description: "Chart version (CHART_VERSION). Default: the git tag."
        required: false
      app_version:
        description: "App image version (APP_VERSION). Default: latest tag of the app repo."
        required: false
      dry_run:
        description: "Rehearse: package and check every chart, push nothing. Untick to publish for real."
        type: boolean
        default: true

jobs:
  release-oci:
    # Pinned by commit, never a branch: a moved ref would change what a tag publishes with no commit
    # here. Dependabot (.github/dependabot.yml) proposes upgrades; rehearse each with dry_run first.
    # Held at 1.1.0: 2.0.0 (b030d3f) requires index_channel (this repo's value: none, the charts are
    # not indexed) and cannot publish yet: its package-and-push fails staging krateo-blueprints/charts
    # at b1326a80 (dry run 45082862711).
    uses: krateo-platformops/.github/.github/workflows/release-oci.yaml@f6185ef0a8161a4201217d6ce0953718fc736fe0 # 1.1.0
    permissions:
      contents: read
      packages: write
    with:
      chart_version: ${{ github.event.inputs.chart_version || '' }}
      app_version: ${{ github.event.inputs.app_version || '' }}
      # A manual run is a rehearsal unless dry_run is unticked; a tag push always publishes.
      dry_run: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
