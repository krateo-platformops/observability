# otel-collector-daemonset's child mode (0.1.39): opentelemetry-collector.mode: deployment, for a
# cluster that enforces the baseline Pod Security Standard (a vcluster child), which refuses the
# daemonset's hostPath volumes and hostPorts.
#
#   render   helm template only: a Deployment with no host access, the OTLP receivers and the audit
#            pipeline kept, the host receivers gone, and a deployment with a host preset still on
#            refused. Then the pinned collector image: the child config passes its own `validate`,
#            and the ClickHouse disk scrape (parent and child) exports the free-bytes metric the
#            disk-headroom alert reads, and nothing else from that endpoint.
#   pss      a kind namespace that enforces baseline: the child's pod is admitted and Ready, its
#            Service has an endpoint, krateo_audit exists; the daemonset beside it is refused.
#
# A separate workflow on purpose: lint.yaml is the org-wide canonical chart-repo lint.

name: check-collector-child-mode

on:
  pull_request:
    paths:
      - "charts/otel-collector-daemonset/**"
      - "charts/krateo-observability/values.yaml"
      - "tests/collector-child-render.py"
      - "tests/collector-child-validate-docker.py"
      - "tests/collector-child-pss-kind.py"
      - "tests/clickhouse-disk-scrape-docker.py"
      - "tests/fixtures/collector-child-values.yaml"
      - ".github/workflows/check-collector-child-mode.yaml"
  push:
    branches: [main]
    paths:
      - "charts/otel-collector-daemonset/**"
      - "charts/krateo-observability/values.yaml"
      - "tests/collector-child-render.py"
      - "tests/collector-child-validate-docker.py"
      - "tests/collector-child-pss-kind.py"
      - "tests/clickhouse-disk-scrape-docker.py"
      - "tests/fixtures/collector-child-values.yaml"
      - ".github/workflows/check-collector-child-mode.yaml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install Helm
        uses: azure/setup-helm@v5
        with:
          version: v3.19.0
      - name: Install PyYAML
        run: pip install --quiet pyyaml
      - name: Build the chart's dependency
        run: |
          helm repo add open-telemetry https://open-telemetry.github.io/opentelemetry-helm-charts
          helm dependency build charts/otel-collector-daemonset
      - name: Render the child, refuse a deployment with a host preset on, keep the daemonset as it was
        run: python3 tests/collector-child-render.py .
      - name: The child config passes the pinned image's validate
        if: ${{ !cancelled() }}
        run: python3 tests/collector-child-validate-docker.py .
      - name: Scrape a stand-in ClickHouse with the chart's own job, parent and child
        if: ${{ !cancelled() }}
        run: python3 tests/clickhouse-disk-scrape-docker.py .

  pss:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install Helm
        uses: azure/setup-helm@v5
        with:
          version: v3.19.0
      - name: Install PyYAML
        run: pip install --quiet pyyaml
      - name: Install kind
        uses: helm/kind-action@v1
        with:
          install_only: true
      - name: Add the dependency repository and build it
        run: |
          helm repo add open-telemetry https://open-telemetry.github.io/opentelemetry-helm-charts
          helm dependency build charts/otel-collector-daemonset
      - name: Install the child under enforced baseline, and the daemonset as the control
        run: python3 tests/collector-child-pss-kind.py .
